[lints.rust]
# The assembly writes no unsafe; what crosses a C interface does so in the
# crates the estate lists (ADR-0050).
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The estate's builds (ADR-0018, amendment 2026-11-20, amending the owner's
# rule of 2026-11-01; rust-style.md section 5b). `dev`, every correctness
# build, compiles the estate's own crates, every member here, at opt-level
# 1, which a test of the codec or Storage still runs at a useful speed
# (unoptimized, the codec's base64 took seconds, 2026-09-26), and every
# third party at 3. Its debug information is line tables, which keep a
# panic's and every backtrace frame's file and line.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# Built whole, never incrementally: rebuilt incrementally after the runtime
# changes under it, this crate's binaries failed to link on Windows, its own
# library naming symbols (core's precondition_check, its own constants) that
# none of its codegen units held (2026-11-02), and the same build linked with
# CARGO_INCREMENTAL=0. A compiler defect, not this crate's.
[profile.dev.package.xmip-core-test-system-test]
incremental = false

# The millisecond rule is measured on the optimized build: `measured`,
# every crate at opt-level 3, debug assertions and overflow checks kept
# as the estate tests with them (rust-style.md section 5c). Every timing
# program runs in it (Test-XmipMeasuredProgram), and so do the binaries
# the System Tests and the demo time. Built on `release`, not `dev`: a
# profile that inherits `dev` inherits its package overrides too.
[profile.measured]
inherits = "release"
opt-level = 3
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true
incremental = true
codegen-units = 256

# The System Tests build whole here too, for the reason above.
[profile.measured.package.xmip-core-test-system-test]
incremental = false

# Every estate crate a member depends on, under the key the member names it
# by: its package and its mount, the path its submodule is mounted at
# (ADR-0005, amendment 2026-11-28). A member takes one with
# `key = { workspace = true }` and says what is its own: features,
# optional, and default-features = false. One key names one package.
# Written from the members by Sync-XmipEstate -Cargo (Update-XmipWorkspace).
[workspace.dependencies]
abi = { package = "xmip-core-abi", path = "module/foundation/abi" }
acme = { package = "xmip-core-provision-acme", path = "module/core/capability/provision/acme" }
