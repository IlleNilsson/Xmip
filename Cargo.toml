# The route technologies xmip-service links and hands to the node it starts
# (`xmip_runtime::linked::Linked::sources`): each the source a Subscription
# filter's prefix names (ADR-0046). A property with no prefix is the
# context's, which every node reads. `content` follows a path into the
# Message's first section, `content:<language>:<expression>`, in the path
# languages this build links: `edi`, a segment, element and component of an
# EDIFACT or X12 interchange (`content:edi:UNH/2/1`, the message type). A
# filter naming a source or a language the build left out is refused as the
# node starts. A site links those it names (deploy/site). The source and the
# list of the languages it carries are made in one place,
# `xmip_route_content::ContentSource::linked`, by the route technology's own
# features, which a language's feature here turns on.
route-content = ["dep:xmip-route-content"]
path-edi = ["dep:xmip-path-edi", "route-content", "xmip-route-content/edi"]

# The cluster's authority, served by the node whose `[provision.node]` names
# it with `serve`: the premises' own ACME service, with renewal information
# and revocation, and its revocation list published over plain HTTP
# (ADR-0034, amendment 2026-10-22). A site that keeps the authority links it.
provision-internal-ca = ["dep:xmip-provision", "dep:xmip-provision-internal-ca"]

# The embedded engines (ADR-0015, amendments 2026-09-25 and 2026-10-01):
# RocksDB, the runtime database's one engine, which the node opens its
# store over, and which every target that keeps a store links
# (deploy/profile/target); and SQLite, an embedded Storage node's
# administration database, which the storage role links
# (deploy/profile/role/storage.toml). Each brings the key home with it: a
# store is always sealed (ADR-0063).
persist-rocksdb = ["persist", "secret", "dep:xmip-persist-rocksdb"]
persist-sqlite = ["persist", "secret", "dep:xmip-persist-sqlite"]
# The platform's key store (ADR-0063 clause 4): DPAPI on Windows, a private
# file on Linux and every Unix, the keychain on macOS. Each crate is empty
# off its own platform, so each is a dependency of its own platform alone, in
# the target tables below (ADR-0062, amendment 2026-11-19).
secret =["dep:xmip-secret", "dep:xmip-secret-dpapi", "dep:xmip-secret-file", "dep:xmip-secret-keychain"]

