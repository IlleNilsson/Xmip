[workspace]
# Nothing but the root. Every module is its own repository and its own workspace
# root; `exclude` keeps cargo inside module/ from walking up, finding this file
# and absorbing a crate into a workspace it has no relationship with. That is
# exactly the coupling separate repositories exist to avoid. Open problem 19.
members = ["."]
exclude = ["module", "template"]
resolver = "2"

[package]
# The platform repository is Xmip, so its primary crate is xmip. It holds no
# behaviour of its own: contracts, journey_model, route and vertical_slice went
# to the repositories that own them on 2026-08-26. What is left is the assembly,
# and xmip-service, the program that starts a node from it.
name = "xmip"
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/Xmip"
description = "The Xmip platform, assembled from its modules."

[lib]
name = "xmip"
# A directory of many usages keeps its source aside (ADR-0049).
path = ".src/lib.rs"

# The Xmip Service (ADR-0018, amendment 2026-09-26): the one program the
# operating system starts, named as ADR-0053 names it. It starts a node from
# its configuration with the technologies this build linked, and a stop from
# the service manager or the console drains it.
[[bin]]
name = "xmip-service"
path = ".src/service/main.rs"
required-features = ["node", "audit", "observe"]

# Starts xmip-service in a console over loopback, carries Messages to it,
# reads what it publishes, acts on it as a surface does and stops it the way a
# terminal or a service manager does.
[[test]]
name = "xmip-service"
path = ".src/test/service/main.rs"
required-features = ["node", "audit", "observe", "transport-tcp", "persist-rocksdb"]

# Renders every node configuration deploy/ writes and reads it the way
# xmip-service reads its own, so a template out of step with the reader fails.
[[test]]
name = "deploy"
path = ".src/test/deploy.rs"

# Xmip Storage as a node meets it: the test Storage node — RocksDB on disk,
# SQLite in memory — in processes of its own, killed hard and reached over
# Xmip's TLS; and the latency of a write, measured and reported.
[[test]]
name = "storage"
path = ".src/test/storage/main.rs"
required-features = ["persist-rocksdb", "persist-sqlite"]

# The scripts IT runs for a database server, held to the schema Xmip Storage
# writes them from, and Xmip Storage against a real server where a test is
# given one (deploy/database).
[[test]]
name = "database"
path = ".src/test/database.rs"
required-features = ["persist"]

[features]
# Nothing by default. A plain `cargo build` is the assembly library with the
# modules every node has; xmip-service is built from a site (deploy/site) by
# Build-XmipService, which sets exactly the features below that the site's
# target, roles and domains need (ADR-0015, amendment 2026-10-01). The
# root's own tests take `--all-features`.
#
# The two fit as two steps. The build sets what is possible: the profiles
# under deploy/profile decide which of these features a site's program
# carries. The node's TOML picks from that at run time: which Locations,
# transports and store it starts, and a name the build left out is refused
# as the node starts. Module selection is configuration; module presence is
# the build's.
default = []

archive = ["dep:xmip-archive"]
assign = ["dep:xmip-assign"]
audit = ["dep:xmip-audit"]
authenticate = ["dep:xmip-authenticate"]
authorize = ["dep:xmip-authorize"]
cluster = ["dep:xmip-cluster"]
contract = ["dep:xmip-contract"]
demote = ["dep:xmip-demote"]
event = ["dep:xmip-event"]
identify = ["dep:xmip-identify"]
node = ["dep:xmip-node"]
observe = ["dep:xmip-observe"]
party = ["dep:xmip-party"]
path = ["dep:xmip-path"]
persist = ["dep:xmip-persist"]
prepare = ["dep:xmip-prepare"]
process = ["dep:xmip-process"]
promote = ["dep:xmip-promote"]
report = ["dep:xmip-report"]
resilience = ["dep:xmip-resilience"]
retain = ["dep:xmip-retain"]
transform = ["dep:xmip-transform"]

# The transports xmip-service links and hands to the node it starts
# (`xmip_runtime::linked::Linked`); a Location naming one the build left out
# is refused as the node starts. A site links the ones its domains serve
# (deploy/profile/domain).
transport-file = ["dep:xmip-transport-file"]
transport-http = ["dep:xmip-transport-http"]
transport-tcp = ["dep:xmip-transport-tcp"]
transport-udp = ["dep:xmip-transport-udp"]

# The embedded engines (ADR-0015, amendments 2026-09-25 and 2026-10-01):
# RocksDB, the runtime database's one engine, which the node opens its
# store over, and which every target that keeps a store links
# (deploy/profile/target); and SQLite, an embedded Storage node's
# administration database, which the storage role links
# (deploy/profile/role/storage.toml). Each brings the key home with it: a
# store is always sealed (ADR-0063).
persist-rocksdb = ["persist", "secret", "dep:xmip-persist-rocksdb"]
persist-sqlite = ["persist", "secret", "dep:xmip-persist-sqlite"]
# The platform's key store (ADR-0063 clause 4): DPAPI on Windows, a private
# file on Linux and every Unix, the keychain on macOS. Each crate is empty
# off its own platform, so all three are linked and each builds where it
# works.
secret = ["dep:xmip-secret", "dep:xmip-secret-dpapi", "dep:xmip-secret-file", "dep:xmip-secret-keychain"]

[dependencies]
xmip-abi = { package = "xmip-core-abi", git = "https://github.com/IlleNilsson/xmip-core-abi", branch = "main" }
xmip-archive = { package = "xmip-core-archive", git = "https://github.com/IlleNilsson/xmip-core-archive", branch = "main", optional = true }
xmip-assign = { package = "xmip-core-assign", git = "https://github.com/IlleNilsson/xmip-core-assign", branch = "main", optional = true }
xmip-audit = { package = "xmip-core-audit", git = "https://github.com/IlleNilsson/xmip-core-audit", branch = "main", optional = true }
xmip-authenticate = { package = "xmip-core-authenticate", git = "https://github.com/IlleNilsson/xmip-core-authenticate", branch = "main", optional = true }
xmip-authorize = { package = "xmip-core-authorize", git = "https://github.com/IlleNilsson/xmip-core-authorize", branch = "main", optional = true }
xmip-cluster = { package = "xmip-core-cluster", git = "https://github.com/IlleNilsson/xmip-core-cluster", branch = "main", optional = true }
xmip-configure = { package = "xmip-core-configure", git = "https://github.com/IlleNilsson/xmip-core-configure", branch = "main" }
xmip-context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
xmip-contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main", optional = true }
xmip-core = { git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
xmip-demote = { package = "xmip-core-demote", git = "https://github.com/IlleNilsson/xmip-core-demote", branch = "main", optional = true }
xmip-event = { package = "xmip-core-event", git = "https://github.com/IlleNilsson/xmip-core-event", branch = "main", optional = true }
xmip-identify = { package = "xmip-core-identify", git = "https://github.com/IlleNilsson/xmip-core-identify", branch = "main", optional = true }
xmip-journey = { package = "xmip-core-journey", git = "https://github.com/IlleNilsson/xmip-core-journey", branch = "main" }
xmip-message = { package = "xmip-core-message", git = "https://github.com/IlleNilsson/xmip-core-message", branch = "main" }
xmip-node = { package = "xmip-core-node", git = "https://github.com/IlleNilsson/xmip-core-node", branch = "main", optional = true }
xmip-observe = { package = "xmip-core-observe", git = "https://github.com/IlleNilsson/xmip-core-observe", branch = "main", optional = true }
xmip-party = { package = "xmip-core-party", git = "https://github.com/IlleNilsson/xmip-core-party", branch = "main", optional = true }
xmip-path = { package = "xmip-core-path", git = "https://github.com/IlleNilsson/xmip-core-path", branch = "main", optional = true }
xmip-persist = { package = "xmip-core-persist", git = "https://github.com/IlleNilsson/xmip-core-persist", branch = "main", optional = true }
xmip-persist-rocksdb = { package = "xmip-core-persist-rocksdb", git = "https://github.com/IlleNilsson/xmip-core-persist-rocksdb", branch = "main", optional = true }
xmip-persist-sqlite = { package = "xmip-core-persist-sqlite", git = "https://github.com/IlleNilsson/xmip-core-persist-sqlite", branch = "main", optional = true }
xmip-prepare = { package = "xmip-core-prepare", git = "https://github.com/IlleNilsson/xmip-core-prepare", branch = "main", optional = true }
xmip-process = { package = "xmip-core-process", git = "https://github.com/IlleNilsson/xmip-core-process", branch = "main", optional = true }
xmip-promote = { package = "xmip-core-promote", git = "https://github.com/IlleNilsson/xmip-core-promote", branch = "main", optional = true }
xmip-receive = { package = "xmip-core-receive", git = "https://github.com/IlleNilsson/xmip-core-receive", branch = "main" }
xmip-report = { package = "xmip-core-report", git = "https://github.com/IlleNilsson/xmip-core-report", branch = "main", optional = true }
xmip-resilience = { package = "xmip-core-resilience", git = "https://github.com/IlleNilsson/xmip-core-resilience", branch = "main", optional = true }
xmip-retain = { package = "xmip-core-retain", git = "https://github.com/IlleNilsson/xmip-core-retain", branch = "main", optional = true }
xmip-route = { package = "xmip-core-route", git = "https://github.com/IlleNilsson/xmip-core-route", branch = "main" }
xmip-runtime = { package = "xmip-core-runtime", git = "https://github.com/IlleNilsson/xmip-core-runtime", branch = "main" }
xmip-secret = { package = "xmip-core-secret", git = "https://github.com/IlleNilsson/xmip-core-secret", branch = "main", optional = true }
xmip-secret-dpapi = { package = "xmip-core-secret-dpapi", git = "https://github.com/IlleNilsson/xmip-core-secret-dpapi", branch = "main", optional = true }
xmip-secret-file = { package = "xmip-core-secret-file", git = "https://github.com/IlleNilsson/xmip-core-secret-file", branch = "main", optional = true }
xmip-secret-keychain = { package = "xmip-core-secret-keychain", git = "https://github.com/IlleNilsson/xmip-core-secret-keychain", branch = "main", optional = true }
xmip-send = { package = "xmip-core-send", git = "https://github.com/IlleNilsson/xmip-core-send", branch = "main" }
xmip-stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }
xmip-transform = { package = "xmip-core-transform", git = "https://github.com/IlleNilsson/xmip-core-transform", branch = "main", optional = true }
xmip-transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
xmip-transport-file = { package = "xmip-core-transport-file", git = "https://github.com/IlleNilsson/xmip-core-transport-file", branch = "main", optional = true }
xmip-transport-http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main", optional = true }
xmip-transport-tcp = { package = "xmip-core-transport-tcp", git = "https://github.com/IlleNilsson/xmip-core-transport-tcp", branch = "main", optional = true }
xmip-transport-udp = { package = "xmip-core-transport-udp", git = "https://github.com/IlleNilsson/xmip-core-transport-udp", branch = "main", optional = true }
# xmip-service's console stop on every platform: Ctrl+C and Ctrl+Break in a
# Windows console, SIGINT, SIGTERM and SIGHUP on Linux and macOS, which is how
# systemd and launchd stop a service. Its unsafe is its own; this crate has none.
ctrlc = { version = "3.5", features = ["termination"] }

[dev-dependencies]
# The deploy test walks a rendered configuration's keys, as configure's reader
# writes them back, with the same TOML reader configure uses.
toml = "0.9"
# The storage test's certificate authority and the identities it issues, for
# a node and a Storage node over mutual TLS: the library's identity, and
# certificates made for the test alone.
xmip-tls = { package = "xmip-core-library-tls", git = "https://github.com/IlleNilsson/xmip-core-library-tls", branch = "main" }
rcgen = "0.13"

[target.'cfg(windows)'.dependencies]
# xmip-service under the Windows Service Control Manager: the dispatcher, the
# control handler a Stop or a Shutdown arrives on, and the status it reports.
windows-service = "0.8"

[lints.rust]
# The assembly writes no unsafe; what crosses a C interface does so in the
# crates the estate lists (ADR-0050).
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 3
