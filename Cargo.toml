[dev-dependencies]
# The test cluster's names, from its `cluster.xmip` (`configure::fixture`;
# ADR-0056, amendment 2026-10-03): no test writes a cluster or node name.
xmip-configure = { package = "xmip-core-configure", git = "https://github.com/IlleNilsson/xmip-core-configure", branch = "main", features = ["test-support"] }
# The deploy test walks a rendered configuration's keys, as configure's reader
# writes them back, with the same TOML reader configure uses.
toml = "1.2.1"
# The storage test's certificate authority and the identities it issues, for
# a node and a Storage node over mutual TLS: the library's identity, and
# certificates made for the test alone.
xmip-tls = { package = "xmip-core-library-tls", git = "https://github.com/IlleNilsson/xmip-core-library-tls", branch = "main" }
rcgen = "0.14"
# The storage test reads an audit record's body back in its one binary form
# (`codec::form::Form`).
xmip-codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
# The service test's operate listener reached as a surface reaches it: the
# runtime's remote surface, and its test authority (`fixture::Authority`),
# which only the test-support feature turns on.
xmip-runtime = { package = "xmip-core-runtime", git = "https://github.com/IlleNilsson/xmip-core-runtime", branch = "main", features = ["test-support"] }
# A loopback address no one holds, for the service a test starts to bind
# (`fixture::unheld`).
xmip-net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main", features = ["test-support"] }
# The service test's figure for an order and the plain wake it is held
# beside (`latency`).
xmip-core = { git = "https://github.com/IlleNilsson/xmip-core", branch = "main", features = ["test-support"] }
# A test's own temporary folder (`xmip_file::temporary`); for the tests only.
xmip-file = { package = "xmip-core-library-file", git = "https://github.com/IlleNilsson/xmip-core-library-file", branch = "main", features = ["test-support"] }
# The service test's client of the cluster's authority the service serves:
# Xmip's own ACME client, as a node on the premises asks it.
xmip-provision-acme = { package = "xmip-core-provision-acme", git = "https://github.com/IlleNilsson/xmip-core-provision-acme", branch = "main" }

# The service test's far end of a serial Send Location and of a protocol's
# master on a serial line: a pseudo-terminal's device end
# (`terminal::Terminal`), Unix's, which only test-support turns on, and the
# device answering on it as the SDK's bus in process has it answer
# (`sdk::serial::Device`).
[target.'cfg(unix)'.dev-dependencies]
