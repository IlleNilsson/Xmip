resolver = "2"

# What every crate of the estate says alike, said once (ADR-0016, amendment
# 2026-11-27): a crate takes each value it shares, `version.workspace =
# true` and the like, and writes its own only where it differs: the module
# boundary's Apache-2.0 (ADR-0075 clause 6), the root's own version.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

# The lints every crate takes with `[lints] workspace = true`. Cargo takes
# a crate's lints from here whole or not at all, so a crate that lowers
# unsafe_code to deny for its one file or folder crossing a C interface
# (rust-style.md section 5a; test/Unsafe.Test.ps1 lists them) keeps its
# own [lints] whole. An empty [lints] takes none: the crates that declared
# no lints before 2026-11-27 say so, as cargo asks of a member under a
# workspace with lints (cargo::missing_lints_inheritance); held to these,
# they would be held to lints they never had (ADR-0016, amendment
# 2026-11-27).
[workspace.lints.rust]
# forbid, not deny: a module has no business writing unsafe.
unsafe_code = "forbid"

[workspace.lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[package]
# The platform repository is Xmip, so its primary crate is xmip. It holds no
# behaviour of its own: contracts, journey_model, route and vertical_slice went
# to the repositories that own them on 2026-08-26. What is left is the assembly,
# and xmip-service, the program that starts a node from it.
name = "xmip"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/Xmip"
description = "The Xmip platform, assembled from its modules."
# Links the Xmip mark into each executable as its Windows icon.
build = ".src/build.rs"

[lib]
name = "xmip"
# A directory of many usages keeps its source aside (ADR-0049).
path = ".src/lib.rs"

# The Xmip Service (ADR-0018, amendment 2026-09-26): the one program the
# operating system starts, named as ADR-0053 names it. It starts a node from
# its configuration with the technologies this build linked, and a stop from
# the service manager or the console drains it. Every build carries the
# authenticate capability, whose `circumstance` verifies a drop folder's
# implied identity: every node infers one where nothing was presented
# (ADR-0019 clause 7; the owner, 2026-10-19).
[[bin]]
name = "xmip-service"
path = ".src/service/main.rs"
required-features = ["node", "audit", "observe", "authenticate"]

# Starts xmip-service in a console over loopback, carries Messages to it,
# reads what it publishes, acts on it as a surface does and stops it the way a
# terminal or a service manager does; and carries files across a Storage
# node's failover.
[[test]]
name = "xmip-service"
path = ".src/test/service/main.rs"
required-features = ["node", "audit", "observe", "authenticate", "transport-tcp", "transport-file", "identify-ip", "identify-certificate", "authenticate-mutual-tls", "authorize-location", "persist-rocksdb", "persist-sqlite", "provision-internal-ca"]

# Starts xmip-service as xmip-service's tests do and measures how long Xmip
# takes, against the millisecond rule: a file dropped in carried to a file
# sent out, an order acted on, a pause published at once, a service nothing
# tells left idle; and a Storage call over the wire beside one in process,
# over what the storage tests open (.src/test/storage). The root's
# timing program (rust-style.md section 5c): a plain cargo test leaves it out,
# and the landing runs it after every other test of the root, alone, one test
# at a time, so what it measures is Xmip's work and not its neighbors'.
[[test]]
name = "measured"
path = ".src/test/measured/main.rs"
test = false
required-features = ["node", "audit", "observe", "authenticate", "transport-tcp", "transport-file", "identify-ip", "identify-certificate", "authenticate-mutual-tls", "authorize-location", "persist-rocksdb", "persist-sqlite", "provision-internal-ca"]

# Renders every node configuration deploy/ writes and reads it the way
# xmip-service reads its own, so a template out of step with the reader fails.
[[test]]
name = "deploy"
path = ".src/test/deploy.rs"

# Xmip Storage as a node meets it: the test Storage node — RocksDB on disk,
# SQLite in memory — in processes of its own, killed hard and reached over
# Xmip's TLS; and the latency of a write, measured and reported.
[[test]]
name = "storage"
path = ".src/test/storage/main.rs"
required-features = ["persist-rocksdb", "persist-sqlite"]

# The scripts IT runs for a database server, held to the schema Xmip Storage
# writes them from, and Xmip Storage against a real server where a test is
# given one (deploy/database).
[[test]]
name = "database"
path = ".src/test/database.rs"
required-features = ["persist"]

# The System Tests' Work Process unit *Order approval*, built here too from
# their one source, which xmip-service's test `approved.rs` opens beside a
# node's configuration (ADR-0066, amendment 2026-11-24). Its own name, so a
# build of both packages at once writes two libraries, never one twice.
[[example]]
name = "order_approval_unit"
path = ".src/example/order_approval_unit.rs"
crate-type = ["cdylib"]
required-features = ["process"]

[features]
# Nothing by default. A plain `cargo build` is the assembly library with the
# modules every node has; xmip-service is built from a site (deploy/site) by
# Build-XmipService, which sets exactly the features below that the site's
# target, roles and chosen technologies need (ADR-0015, amendments
# 2026-10-01 and 2026-10-19). The root's own tests take `--all-features`.
#
# The two fit as two steps. The build sets what is possible: the profiles
# under deploy/profile decide which of these features a site's program
# carries. The node's TOML picks from that at run time: which Locations,
# transports and store it starts, and a name the build left out is refused
# as the node starts. Module selection is configuration; module presence is
# the build's.
default = []

archive = ["dep:xmip-archive"]
assign = ["dep:xmip-assign"]
# What a program hands its audit as it starts (ADR-0062): the file sink, and
# the operating system's log for when audit cannot persist. Each log's crate
# is empty off its own platform, so each is a dependency of its own platform
# alone, in the target tables below (ADR-0062, amendment 2026-11-19).
audit =["dep:xmip-audit", "dep:xmip-audit-file", "dep:xmip-audit-syslog", "dep:xmip-audit-windows-event-log"]
authenticate = ["dep:xmip-authenticate"]
authorize = ["dep:xmip-authorize"]
cluster = ["dep:xmip-cluster"]
contract = ["dep:xmip-contract"]
demote = ["dep:xmip-demote"]
event = ["dep:xmip-event"]
identify = ["dep:xmip-identify"]
# The node's declaration; and what xmip-service alone uses (`.src/service/`),
# which requires this feature: its console stop and the command line's
# document it installs; its Windows Service Control Manager is the runtime's
# (`registration::control_manager`). A build that leaves the program out
# links neither, which cargo refuses as unused dependencies
# (unused_dependencies, Cargo 1.100).
node = ["dep:xmip-node", "dep:ctrlc", "dep:xmip-operate"]
observe =["dep:xmip-observe"]
party = ["dep:xmip-party"]
path = ["dep:xmip-path"]
persist = ["dep:xmip-persist"]
prepare = ["dep:xmip-prepare"]
process = ["dep:xmip-process"]
promote = ["dep:xmip-promote"]
report = ["dep:xmip-report"]
# With the retry guard, which xmip-service hands to the node it starts: a
# Send Port's `retry` is built as it (`xmip_runtime::linked::Linked::retry`;
# ADR-0048, amendment 2026-11-14). Every role that sends carries it
# (deploy/profile/role); a Send Port stating `retry` on a build without it
# is refused as the node starts.
resilience = ["dep:xmip-resilience", "dep:xmip-resilience-retry"]
retain = ["dep:xmip-retain"]
transform = ["dep:xmip-transform"]

# The identify technologies xmip-service links and hands to the node it
# starts (`xmip_runtime::linked::Linked`): the first gate, which reads the
# claim a Stream carries on its transport (ADR-0019 clause 5, ADR-0050
# section 3). Each reads what a linked transport writes on its arrival and
# needs no configuration: the socket peer (`ip`), a bearer token's subject
# (`jwt`), an `X-API-Key` (`api-key`), a Basic credential's user
# (`username`), a TLS peer certificate (`certificate`). A site links those
# it names (deploy/site).
identify-api-key = ["identify", "dep:xmip-identify-api-key"]
identify-ip = ["identify", "dep:xmip-identify-ip"]
identify-jwt = ["identify", "dep:xmip-identify-jwt"]
identify-username = ["identify", "dep:xmip-identify-username"]
# The peer certificate a transport that terminates TLS reports (`tls.peer.*`),
# claimed as `mutual-tls` where its handshake verified it.
identify-certificate = ["identify", "dep:xmip-identify-certificate"]

# The authenticate and authorize technologies xmip-service links, each set
# up by what the node's configuration says and nothing else (ADR-0068):
# `mutual-tls` records what the handshake proved, for a Receive Location
# whose `accept.mechanism` names it; `location` admits at each Receive
# Location the node starts what its `accept` declares it takes. A site links
# those it names.
authenticate-mutual-tls = ["authenticate", "dep:xmip-authenticate-mutual-tls"]
authorize-location = ["authorize", "dep:xmip-authorize-location"]

# The transports xmip-service links and hands to the node it starts
# (`xmip_runtime::linked::Linked`); a Location naming one the build left out
# is refused as the node starts. A site links the ones it names
# (deploy/site). Each is chosen by the scheme a Location's address is
# entered with, the schemes its own `Configured::SCHEMES` declares — a path
# or file://, ftp:// and ftps://, tcp://, as2://, mllp:// and the rest
# (ADR-0064, amendment 2026-10-28). Every transport written whose far end a
# node in a process of its own reaches is here, each proven carrying a file
# through the node to the far end its crate stands, a serial line's on a
# pseudo-terminal, which Linux and macOS have (`.src/test/service/linked.rs`;
# ADR-0015, amendments 2026-11-24 and 2026-11-25); why each other is not is
# architecture.toml's `linked-transports`. tcp terminates
# TLS where its Location says `tls = true`, with the node's
# `[provision.receive]` certificate. HTTP and what rides on it — as2, as4,
# peppol, msmq, webdav, and the vendors' aws-*, azure-* and google-* — are
# linked without TLS, as http's crate leaves it off by default, so their
# secure schemes and an https:// endpoint are refused. The vendors' present
# the secret their Location names, a password secret holding an access key's
# secret, a shared key or a bearer token (ADR-0015, amendment 2026-11-25).
# sftp takes files
# from and puts them on an SFTP server, each under its name: the Parties'
# far end the System Tests serve nodes on machines of their own (ADR-0028,
# amendment 2026-10-22). CAN and what rides on it — canopen, iso-tp, j1939,
# obd-ii, uds — reach the kernel's CAN interface (can-bus's `socketcan`), and
# Ethernet and what rides on it — ethercat, profinet — the kernel's raw
# socket (ethernet's `packet`), so each brings its kernel link, and
# `built.rs` links them on Linux alone: each is proven by a node in a user
# and network namespace of the test's own, on interfaces it makes there
# (`.src/test/service/namespaced.rs`). thread, wireless-hart and zigbee reach
# an IEEE 802.15.4 interface of the kernel's (`net::ieee802154`), so
# `built.rs` links them on Linux alone too: each is proven on the machine's
# own pair of radios, which `mac802154_hwsim` makes, one at a time
# (`.src/test/service/aired.rs`). lorawan is the network server behind
# the gateways that point at the node over Semtech's UDP packet forwarder
# protocol, its far end a device behind a packet forwarder of its crate's
# own (ADR-0051 and ADR-0015, amendments 2026-11-27). bluetooth reaches a
# controller through the kernel's L2CAP sockets, which Linux alone has, and
# `built.rs` links it on Linux alone: it is proven by the node of
# `linked.rs`, from the first of two virtual controllers its crate makes
# over the kernel's `/dev/vhci` to a far end on the second (ADR-0015,
# amendment 2026-11-27).
