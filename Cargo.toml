[workspace]
# Nothing but the root. Every module is its own repository and its own workspace
# root; `exclude` keeps cargo inside modules/ from walking up, finding this file
# and absorbing a crate into a workspace it has no relationship with. That is
# exactly the coupling separate repositories exist to avoid. Open problem 19.
members = ["."]
exclude = ["modules"]
resolver = "2"

[package]
# The platform repository is Xmip, so its primary crate is xmip. It holds no
# behaviour of its own: contracts, journey_model, route and vertical_slice went
# to the repositories that own them on 2026-08-26. What is left is the assembly.
name = "xmip"
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/Xmip"
description = "The Xmip platform, assembled from its modules."

[lib]
name = "xmip"
path = "src/lib.rs"

[features]
default = ["server-profile"]

# A build profile decides what is compiled in. Selection happens at build and
# packaging time; any other composition of the modules below is a custom build,
# which runtime-profiles.md calls a purpose-compiled runtime.
#
# Deployment profiles are deliberately absent. IoT device, edge node, single
# server, cluster, cloud node and hybrid select modules at run time, and module
# selection is configuration. That belongs in TOML, not here.
server-profile = ["archive", "assign", "audit", "authenticate", "authorize", "cluster", "contract", "demote", "event", "exclusiveness", "identify", "node", "observe", "party", "path", "persist", "prepare", "process", "promote", "report", "resilience", "retain", "transform"]

# The same composition as server-profile today. What will separate them is an
# interactive host and a local GUI host, and neither exists yet. The name is
# declared so packaging has a stable target and the difference lands somewhere
# decided when it arrives.
desktop-profile = ["server-profile"]

# Replaces iot-profile and embedded-profile, which were identical to each other
# and to this. Empty on purpose: the modules a forwarder cannot do without are
# not optional, so what makes a build tiny is everything it leaves out.
tiny-profile = []

archive = ["dep:xmip-archive"]
assign = ["dep:xmip-assign"]
audit = ["dep:xmip-audit"]
authenticate = ["dep:xmip-authenticate"]
authorize = ["dep:xmip-authorize"]
cluster = ["dep:xmip-cluster"]
contract = ["dep:xmip-contract"]
demote = ["dep:xmip-demote"]
event = ["dep:xmip-event"]
exclusiveness = ["dep:xmip-exclusiveness"]
identify = ["dep:xmip-identify"]
node = ["dep:xmip-node"]
observe = ["dep:xmip-observe"]
party = ["dep:xmip-party"]
path = ["dep:xmip-path"]
persist = ["dep:xmip-persist"]
prepare = ["dep:xmip-prepare"]
process = ["dep:xmip-process"]
promote = ["dep:xmip-promote"]
report = ["dep:xmip-report"]
resilience = ["dep:xmip-resilience"]
retain = ["dep:xmip-retain"]
transform = ["dep:xmip-transform"]

[dependencies]
xmip-abi = { package = "xmip-core-abi", git = "https://github.com/IlleNilsson/xmip-core-abi", branch = "main" }
xmip-archive = { package = "xmip-core-archive", git = "https://github.com/IlleNilsson/xmip-core-archive", branch = "main", optional = true }
xmip-assign = { package = "xmip-core-assign", git = "https://github.com/IlleNilsson/xmip-core-assign", branch = "main", optional = true }
