# xmip.core.exclusiveness is retired. ADR-0024.
#
# It held a lease inside Xmip and could never say where a cluster-wide one
# would live: per-node persistence proves nothing to another node, and every
# external coordinator that could have held it makes Xmip depend on somebody
# else's cluster to answer a question about its own. ResourceClaim in
# xmip-core-transport replaces it — the endpoint's own atomic claim, which is
# cluster-wide because the endpoint is one thing however many nodes are asking.

  [xmip.core.migrate]
  description = "Reads a source platform's configuration and produces Xmip artifacts, with a report of what has no equivalent."
  architecturalDomain = "Capability"
  repositoryRole = "common-capability"
  maturity = "planned"
  dependency = ["xmip-core"]
    [xmip.core.migrate.apache-camel]
    [xmip.core.migrate.azure-logic-apps]
    [xmip.core.migrate.biztalk]
    [xmip.core.migrate.boomi]
    [xmip.core.migrate.ibm-ace]
    [xmip.core.migrate.mulesoft]
    [xmip.core.migrate.oracle-soa]
    [xmip.core.migrate.sap-po]
    [xmip.core.migrate.tibco-businessworks]
    [xmip.core.migrate.webmethods]

