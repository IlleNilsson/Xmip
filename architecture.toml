# Xmip architecture manifest.
#
# Schema 2.0. The tree is the data: a repository name is derived from its
# position, so a name cannot drift from the structure that owns it.
#   xmip.core.transport.http -> xmip-core-transport-http
#
# The path is the name. Dots become hyphens and nothing else happens.
#
# Keys follow ADR-0011: shortest singular form.

schemaVersion = "2.0.0"
architectureVersion = "0.15.0"
minimumScriptVersion = "1.5.0"
name = "Xmip Architecture"
owner = "IlleNilsson"
surface = ["abi", "cli", "gui", "powershell"]

[powershellRuntime]
edition = "Core"
version = "7.6.5"
versionPolicy = "minimum"
crossPlatform = true
windowsPowerShellSupported = false

[default]
visibility = "public"
autoInitialize = true
hasIssues = true
hasProjects = false
hasWiki = false
defaultBranch = "main"
license = "AGPL-3.0-or-later"
maturity = "reserved"
repositoryTopics = ["xmip"]
submoduleRoot = "module"

[classification]
Foundation = "Things Xmip is."
Capabilities = "Things Xmip does."
Technology = "How a capability is implemented."
Operations = "Running and governing Xmip."
Platform = "Platform-wide runtime services."

[crate]
primaryLanguage = "rust"
edition = "2024"
primaryCrateMatchesRepository = true
license = "AGPL-3.0-or-later"
automaticVerification = false

# The .NET counterpart of [crate]. ADR-0021: current platforms only, which for
# a build target means the latest — and .NET 11 is preview until it goes stable
# on 2026-11-10, which prerequisite.toml already records.
#
# Declared here because it was previously written in three places and checked in
# none: the template's Directory.Build.props, and a <TargetFramework> in each of
# the two surface projects. Three copies of a version number is three chances to
# be on a different one.
[project]
primaryLanguage = "dotnet"
targetFramework = "net11.0"
sdk = "preview"

# An assembly is loaded by something, and when that something owns the runtime,
# it decides the target. The estate builds with the latest SDK either way.
#
# pwsh 7.6.5 hosts .NET 10 and carries its own runtime. A net11.0 build of the
# PowerShell module compiles cleanly and is then refused at Import-Module with
# "Could not load file or assembly 'System.Runtime, Version=11.0.0.0'", because
# an assembly cannot load into a runtime older than it targets. Re-proved
# 2026-09-03 rather than taken from the comment that claimed it.
#
# This follows pwsh upward. When pwsh hosts .NET 11, this line moves and the
# exception disappears.
hostedTargetFramework = "net10.0"
hostedBy = "powershell"

# One template per language, keyed by primaryLanguage.
#
# Was a single `template = "IlleNilsson/xmip-template"`. That repository was
# renamed to xmip-template-rust on 2026-08-27 and xmip-template-dotnet was
# created beside it, and this key was not updated — so `-Create` posted to a
# repository that no longer exists, and the drift check exempted a name nothing
# has while reporting both real templates as unexpected.
#
# A table rather than a string because the estate has two languages and will
# have more. ADR-0014 clause 14: gui and powershell carry their own.
#
# `owner/name` because that is what the GitHub generate API takes. Each is also
# a submodule of this repository at `template/<language>`, so the templates are
# in the estate rather than beside it — a template nobody clones with the estate
# is a template that drifts from what it is supposed to produce.
[crate.template]
rust = "IlleNilsson/xmip-template-rust"
dotnet = "IlleNilsson/xmip-template-dotnet"

# Repositories that existed, were retired, and are archived rather than deleted.
#
# Without this a retirement reports as drift forever, and a warning that is
# always there is a warning nobody reads. The reason is required: an entry with
# no reason is indistinguishable from a repository somebody forgot to declare.
[[retired]]
name = "xmip-core-exclusiveness"
on = "2026-08-27"
reason = "ADR-0024. ResourceClaim in xmip-core-transport replaces it. Archived rather than deleted because ADR-0017 is part of the record."

[[retired]]
name = "xmip-core-webapi"
on = "2026-09-06"
reason = "ADR-0014 amendment 2026-08-26. The web API belongs to the Logic axis (xmip-core-logic-http-api over xmip-core-transport-http), not a module of its own; it was declared, mounted nowhere, and deprecated. Retired rather than deleted because the amendment is part of the record; may return with the Logic axis."

[policy]
acyclic = true
rule = ["Foundation repositories must not depend on Technology repositories.", "Common capability repositories must not depend on their technology children.", "Technology repositories may depend on their parent capability.", "Technology sibling dependencies are disallowed unless explicitly declared.", "Operation repositories consume public contracts and events, not implementation internals.", "Platform services must not depend on specific Technology repositories."]

[handler]
separationRequired = true
rules = ["Receive and Send own orchestration, ports, groups and locations; they do not own technology implementation repositories.", "Transport implementation repositories are direction-neutral and declare whether they support receive, send or both.", "Transport handlers must not own message serialization semantics.", "Content handlers must be reusable across compatible transports.", "Content deserialization occurs only when an artifact action requires structured content.", "Pass-through processing must avoid unnecessary deserialization and serialization.", "Logic handlers define method or operation semantics for method-oriented protocols.", "Credential and identity presentation is a security responsibility, not a transport technology.", "Handler is a runtime module role and is not a repository-name prefix.", "Transport implementation repositories declare whether they are exclusive by default: those addressing a discrete claimable artefact are, those addressing a query, queue or connection are not, and either can be overridden by configuration."]

[handler.repositoryModel]
transport = "xmip-<provider>-transport-<standard>"
content = "xmip-<provider>-message-<standard>"
logic = "xmip-<provider>-logic-<standard>"
handlerIsRuntimeRole = true

[handler.types]

[handler.types.Transport]
responsibility = "Move immutable Streams between Xmip and external or internal endpoints without owning message representation or operation semantics."
examples = ["file", "ftp", "sftp", "http", "websocket", "tcp", "udp", "mllp", "amqp", "kafka", "rabbitmq", "mqtt"]
directionNeutral = true

[handler.types.Content]
responsibility = "Serialize, deserialize and materialize message representations independently of transport."
examples = ["json", "xml", "csv", "protocol-buffers", "apache-avro"]
deserializeOnDemand = true
passThroughAllowed = true

[handler.types.Logic]
responsibility = "Expose and invoke method-oriented protocol operations independently of transport and content representation."
appliesTo = ["soap", "http-api", "grpc"]

# The estate. Depth is the classification: xmip.<provider> is the provider
# root repository, xmip.<provider>.<module> a module, and one level deeper an
# implementation. Keys inside a table are its metadata; sub-tables are its
# children.

