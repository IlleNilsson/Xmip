# Platform services. These existed as crates with no module, so nothing would
# have created a repository for them. Descriptions taken from what the crates
# contain, not from what their names suggest.

# The Xmip Service and the Xmip Host Service are both here. They are one idea
# and never move independently: the Service builds the execution tree, the Host
# Service executes a host process plan, and runtime owns both types. Separate
# repositories for 10 KB that always change together would be ceremony.
# ADR-0018.
  [xmip.core.runtime]
  description = "The Xmip Service and the Xmip Host Services it spawns: configuration, execution tree, startup validation, host process plans, capability and module registries."
  architecturalDomain = "Platform"
  repositoryRole = "platform-service"
  maturity = "planned"
  dependency = ["xmip-core", "xmip-core-abi", "xmip-core-configure", "xmip-core-resilience"]

  [xmip.core.persist]
  description = "Durable runtime state behind one store contract: execution checkpoints, Journey recovery, leases and deduplication."
  architecturalDomain = "Platform"
  repositoryRole = "platform-service"
  maturity = "planned"
  dependency = ["xmip-core"]

  [xmip.core.configure]
  description = "Reads and validates declared Xmip configuration and turns it into a service configuration."
  architecturalDomain = "Platform"
  repositoryRole = "platform-service"
  maturity = "planned"
  dependency = ["xmip-core"]

# Surfaces, ADR-0014. abi is above. These three were named in surface and had
# no module, so they were invisible to repository creation.
#
# language overrides [crate].language for a module that is not a Rust crate.
# ADR-0011 governs module and repository names; it does not govern the name of
# a command a person types, nor .NET project names.

