# No implementation repositories. Exclusiveness is an internal Xmip concern
# and has nothing to do with protocols. Process scope is served by the
# in-memory store inside the module; Cluster scope is a lease in
# xmip-core-persist, which Xmip already requires. Consul, etcd, redis,
# zookeeper and file locks were five external coordinators nobody asked for.
# ADR-0017.

