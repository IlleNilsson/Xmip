name: Rust

# One workflow. There were four, two of them both called Rust CI running
# different jobs, which is why two checks disagreed on every pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# .cargo/config.toml links the RocksDB kept under .local-work, which a runner
# does not have: here it is compiled from source in every job that links it,
# and the cache keeps it until the RocksDB version changes.
env:
  ROCKSDB_COMPILE: "1"

jobs:
  # Every operating system Xmip targets, each reported on its own: one that
  # fails does not cancel the others (the owner, 2026-10-06: *lets turn on
  # all the OS's we can for tests and all for targets and see how we do*).
  workspace:
    name: Workspace build and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cargo.lock is not committed (.gitignore says why): it is resolved
      # once, here, from the branches ADR-0005 tracks, and every cargo step
      # of the job after reads that one resolution with --locked, so no step
      # resolves the dependencies again and two steps never build two trees.
      - name: Lock file
        run: cargo generate-lockfile

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      # Every feature, because nothing is on by default: xmip-service and its
      # tests are built from a site, and here from all of them at once.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Test
        run: cargo test --workspace --all-features --locked

  sites:
    name: Site builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      # Cargo.lock is not committed (.gitignore says why): it is resolved
      # once, here, from the branches ADR-0005 tracks, and every cargo step
      # of the job after reads that one resolution with --locked, so no step
      # resolves the dependencies again and two steps never build two trees.
      - name: Lock file
        run: cargo generate-lockfile

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install PSToml
        shell: pwsh
        run: Install-Module -Name PSToml -Scope CurrentUser -Force

      # Each example site through the one place a site becomes a build
      # (ADR-0015, amendment 2026-10-01). The device's is refused, in words
      # naming what builds for it instead, which is the next step.
      - name: Example sites
        shell: pwsh
        run: |
          Import-Module ./Xmip/Xmip.psd1
          foreach ($site in 'hospital-interface', 'factory-gateway', 'personal-computer', 'b2b-exchange') {
              Build-XmipService -Site $site -CargoArgument '--locked'
          }

      - name: Device, xmip-core alone
        run: |
          git submodule update --init module/foundation/core
          cargo build --manifest-path module/foundation/core/Cargo.toml --no-default-features --features serde --target thumbv7em-none-eabihf

  # The phone host for the iPhone, built where Apple's tools run: the owner
  # has no Mac (ADR-0014, amendment 2026-10-14). For the simulator, so
  # nothing is signed; built, never run.
  phone-ios:
    name: Phone host, iOS simulator
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runtime the remote build is made from, and what Xmip.Operations
      # references: its own gui module and xmip-core-abi's Xmip.Surface. The
      # runtime's estate dependencies are git dependencies on the branches
      # ADR-0005 tracks, so nothing is patched to a working tree here; a
      # landing does that (New-XmipLocalPatch), before anything is pushed.
      - name: Submodules
        run: git submodule update --init module/platform/runtime module/foundation/abi module/core/operation/gui

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: module/platform/runtime -> ../../../.ai-interaction/target-ios

      # The newest stable Xcode on the image; the image's default can be
      # older than the one .NET for iOS asks for.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # global.json pins an 11 preview and rolls forward to the latest
      # feature, prerelease allowed: the newest 11.0 preview or release
      # candidate is one it accepts, and the one a developer has.
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Install the MAUI iOS workload
        working-directory: module/core/operation/gui
        run: dotnet workload install maui-ios

      # The one place the remote build is made (Build-XmipRemoteRuntime):
      # a static library for a device and the simulator, joined into the
      # xcframework Xmip.Abi.Native.props links.
      - name: Remote runtime, iOS
        shell: pwsh
        run: |
          Import-Module ./Xmip/Xmip.psd1
          Build-XmipService -Remote iOS

      # From the gui module, so its global.json chooses the SDK. Xcode's
      # version is not held to the one .NET for iOS names: this checks that
      # the host builds, and a newer Xcode builds it.
      - name: Xmip.Operations, iOS simulator
        working-directory: module/core/operation/gui
        run: dotnet build src/Xmip.Operations/Xmip.Operations.csproj -f net11.0-ios -c Debug -p:RuntimeIdentifier=iossimulator-arm64 -p:ValidateXcodeVersion=false
