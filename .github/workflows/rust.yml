name: Rust

# One workflow. There were four, two of them both called Rust CI running
# different jobs, which is why two checks disagreed on every pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# .cargo/config.toml links the RocksDB kept under .local-work, which a runner
# does not have: here it is compiled from source in every job that links it,
# and the cache keeps it until the RocksDB version changes.
env:
  ROCKSDB_COMPILE: "1"

jobs:
  # Windows alone for now (the owner, 2026-11-02: *Just build Windows, we can
  # get back to other OS and target*); Xmip is still designed for every one.
  workspace:
    name: Workspace build and tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cargo.lock is not committed (.gitignore says why): it is resolved
      # once, here, from the branches ADR-0005 tracks, and every cargo step
      # of the job after reads that one resolution with --locked, so no step
      # resolves the dependencies again and two steps never build two trees.
      - name: Lock file
        run: cargo generate-lockfile

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      # Every feature, because nothing is on by default: xmip-service and its
      # tests are built from a site, and here from all of them at once.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Test
        run: cargo test --workspace --all-features --locked

  sites:
    name: Site builds
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Cargo.lock is not committed (.gitignore says why): it is resolved
      # once, here, from the branches ADR-0005 tracks, and every cargo step
      # of the job after reads that one resolution with --locked, so no step
      # resolves the dependencies again and two steps never build two trees.
      - name: Lock file
        run: cargo generate-lockfile

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # The runner's pwsh is older than Xmip's floor, the newest PowerShell
      # the estate has (ADR-0021, amendment 2026-11-02): that release, first
      # on the PATH of every later step. It moves with prerequisite.toml.
      - name: Install PowerShell
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v7.7.0'
          $to = Join-Path $env:RUNNER_TEMP 'pwsh'
          gh release download $tag --repo PowerShell/PowerShell --pattern "PowerShell-$($tag.TrimStart('v'))-win-x64.zip" --dir $env:RUNNER_TEMP
          Expand-Archive -Path (Join-Path $env:RUNNER_TEMP "PowerShell-$($tag.TrimStart('v'))-win-x64.zip") -DestinationPath $to
          Add-Content -Path $env:GITHUB_PATH -Value $to

      - name: Install PSToml
        shell: pwsh
        run: Install-Module -Name PSToml -Scope CurrentUser -Force

      # Each example site through the one place a site becomes a build
      # (ADR-0015, amendment 2026-10-01).
      - name: Example sites
        shell: pwsh
        run: |
          Import-Module ./Xmip/Xmip.psd1
          foreach ($site in 'hospital-interface', 'factory-gateway', 'personal-computer', 'b2b-exchange') {
              Build-XmipService -Site $site -CargoArgument '--locked'
          }
