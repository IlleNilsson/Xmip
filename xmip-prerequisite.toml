# Prerequisites for a machine that runs or builds Xmip.
#
# The script applies, this file decides. Install-XmipPrerequisite.ps1 hard-codes
# exactly one thing, PSToml, because reading this file requires it. Everything
# else is here.
#
# Roles are cumulative.

[role.operator]
description = "Runs Xmip and drives it from the command line."
include = []

[role.developer]
description = "Builds Xmip from source."
include = ["operator"]

[role.build]
description = "Produces release artifacts."
include = ["developer"]

[prerequisite.powershell]
role = "operator"
source = "winget"
id = "Microsoft.PowerShell"
minimum = "7.0"
note = "Xmip scripts declare #requires -PSEdition Core. Windows PowerShell 5.1 will not run them."

[prerequisite.git]
role = "operator"
source = "winget"
id = "Git.Git"
minimum = "2.40"

[prerequisite.pstoml]
role = "operator"
source = "psgallery"
id = "PSToml"
note = "Reads xmip-architecture.toml. PowerShell has no built-in TOML parser, so this is the one prerequisite the script knows about without reading this file."

[prerequisite.rustup]
role = "developer"
source = "winget"
id = "Rustlang.Rustup"
component = ["rustfmt", "clippy"]
note = "CI runs cargo fmt --check and clippy with -D warnings, so both components are required rather than optional."

[prerequisite.buildtools]
role = "developer"
source = "winget"
id = "Microsoft.VisualStudio.BuildTools"
override = "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"
elevation = true
note = "Installing BuildTools without the VCTools workload leaves no link.exe, and Rust then fails at the linker rather than at the compiler, which reads as a Rust problem and is not one."

[prerequisite.dotnet]
role = "developer"
source = "winget"
id = "Microsoft.DotNet.SDK.Preview"
optional = true
note = "For the Blazor surfaces in ADR-0014. .NET 11 is preview until 10 November 2026. The winget identifier for preview SDKs is not verified; the released ones are versioned, such as Microsoft.DotNet.SDK.9."
