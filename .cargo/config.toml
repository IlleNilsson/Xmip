# Read by every cargo build under the estate root.
#
# RocksDB is compiled once per version, not once per build (the owner,
# 2026-10-05: "Compile RocksDB if there is a new version of it, otherwise I do
# not see the need"). librocksdb-sys links the static library kept under
# .local-work/native/rocksdb/<version>; test/NativeLibrary.Test.ps1 fails the
# gate when the version cargo resolves is not the one kept here.
[env]
ROCKSDB_LIB_DIR = { value = ".local-work/native/rocksdb/11.8.1", relative = true }
ROCKSDB_STATIC = "1"

# The estate's own crates build optimized in a debug build too, as what they
# depend on does already (`[profile.dev.package."*"]` in each workspace root):
# the millisecond rule is measured on the optimized build (the owner,
# 2026-11-01). One place, read by every build under the estate root; debug
# assertions and debug information stay as a debug build has them
# (`doc/governance/rust-style.md` section 5b).
[profile.dev]
opt-level = 3

# A warning fails every build under the estate root: cargo build, check,
# clippy and test alike (Cargo 1.97). Lint levels no longer change between
# check, clippy and test, as `-- -D warnings` on clippy alone made them, so
# one build serves all three. A module repository checked out alone does not
# read this file; the shared rust-verify.yml denies warnings there.
[build]
warnings = "deny"

# The Windows libraries RocksDB's port layer calls (UUIDs, paths). Its own
# build names them when it compiles RocksDB; linking the kept one, we do.
[target.'cfg(windows)']
rustflags = ["-l", "rpcrt4", "-l", "shlwapi"]
