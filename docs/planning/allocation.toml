# BizTalk vocabulary: JourneyStarted, JourneyCompleted and Fault against the
# Begin, Finished and Failure that audit already declares, and TrackingSink
# against audit.implementation.elasticsearch and .file. ADR-0014 names four
# observation capabilities, and a fifth would contradict it.

# xmip-core-transport-file is needed by crates/xmip-handler-file but is a
