# Xmip allocation map.
#
# Every tracked file in Xmip@a3b001e871 has exactly one entry below. Nothing is
# implicit: a file is kept, moved, or removed, and each says why.
#
#   [keep]    stays in Xmip. The root is the manifest, the record, the
#             assembly and the tooling that composes the rest.
#   [move]    goes to the repository that owns the thing it describes or
#             implements. Follows the code, per your call.
#   [remove]  handler-era tooling that ADR-0010 and ADR-0011 left behind.
#   [review]  I could not decide honestly. Eleven questions. Read these.
#
# Counts at the bottom. Read [review] first; the rest is mechanical.

schemaVersion = "1.0.0"
source = "IlleNilsson/Xmip"
sourceCommit = "a3b001e871"
revised = "2026-08-25, after api became webapi and xmip-tracking was recognised as audit"
generated = "2026-08-25"

# ===========================================================================
# 1. Repositories this map needs that do not exist yet
# ===========================================================================
#
# Seven were already planned. Seven more come from the orphan crates, named
# to ADR-0011: shortest singular form, verb where the module does something.
# The names are a proposal. Say so if any of them is wrong.

[create]
planned = [
    "xmip-core-abi",
    "xmip-core-webapi",
    "xmip-core-transport",
    "xmip-core-logic",
    "xmip-core-migrate",
    "xmip-core-schedule",
    "xmip-core-diagnose",
]

fromOrphanCrate = [
    "xmip-core-runtime",   # crates/xmip-runtime + -service + -host, ADR-0018
    "xmip-core-persist",   # crates/xmip-persistence   RuntimeStore, checkpoints, recovery, leases
    "xmip-core-configure", # crates/xmip-configuration parses declared configuration
]

# Surfaces named in surface with no module, so nothing would have created a
# repository for them. ADR-0014 clauses 7, 12, 13 and 14.
fromSurface = [
    "xmip-core-cli",        # the xmip executable and the operations library
    "xmip-core-powershell", # PowerShell Core module, cross-platform
    "xmip-core-gui",        # .NET 11 Blazor, MAUI desktop and server-side web
]

# No xmip-core-track. crates/xmip-tracking is an early xmip-core-audit under
# BizTalk vocabulary: JourneyStarted, JourneyCompleted and Fault against the
# Begin, Finished and Failure that audit already declares, and TrackingSink
# against audit.implementation.elasticsearch and .file. ADR-0014 names four
# observation capabilities, and a fifth would contradict it.

# xmip-core-transport-file is needed by crates/xmip-handler-file but is a
# level-two repository and none of those exist yet. Held in [review].

