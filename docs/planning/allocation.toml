# ===========================================================================
# 5b. Origin material — what was taken, and what was not
# ===========================================================================
#
# Found 2026-08-26 after 'check _origins, it is old and maybe stale'. It was
# both: written in the retired Artifact and Handler vocabulary, asserting a
# Rust-only runtime and the pre-ADR-0011 crate names — and simultaneously the
# only record of nine pieces of live design.
#
# TAKEN:
#
#   Identity classes and context isolation  ADR-0022 (new)
#   Security profiles                       deployment-model.md section 4
#   Build targets, ARM and industrial       deployment-model.md section 1
#   The Xmip URI and scope hierarchy        observability-model.md section 7
#   Mandatory and optional reports          observability-model.md section 8
#   Delivery semantics                      runtime-model.md section 15
#   The Void lane                           runtime-model.md section 23, as
#                                           evidence for the open Dismissed
#                                           ruling — not decided, ADR-0013 owns it
#
# ALREADY PRESENT, nothing taken:
#
#   'Routing creates no new Messages; Assignment and Transformation do'
#       runtime-model.md line 50 states it already.
#   Lease-based claim, checkpointed recovery
#       ADR-0017 already has ExclusiveLease, ResourceClaim and RecoveryLease.
#       Only the delivery-semantics half was missing.
#
# REJECTED, and why:
#
#   Rust-only implementation
#       Contradicted by the estate. xmip-core-powershell and xmip-core-gui
#       declare primaryLanguage and are not Rust crates — ADR-0014 clause 14.
#   xmip-interface, xmip-core, xmip-cli as crate names
#       ADR-0011 and schema 2.0. The manifest tree path is the name now.
#   Artifact as the primary runtime noun
#       Superseded by Stream, Message, Section and Journey. 'Artifact' survives
#       only in its ordinary build sense.
#   transportHandler, contentHandler, intentHandler, contractHandler
#       ADR-0011: handler is a runtime role, never a repository-name segment,
#       and the four-way split is capability repositories now.
#   'Core semantics may not be forked or reimplemented'
#       Cannot be adopted. Xmip is AGPL-3.0-or-later, which grants exactly the
#       right to modify and redistribute that this sentence withholds. A
#       licence and a wish, and the licence is the one that binds. Flagged
#       rather than silently dropped, because it was written on purpose.
#   template.xmip.toml, cluster.xmip.toml, node xmip.toml
#       Not rejected on merit — it is direct input to the open node
#       configuration question ([[modules]] against the Ansible template), and
#       adopting one side of an open question by importing it from a draft is
#       how an open question gets closed without being decided. Recorded in
#       docs/planning/open-problems.md instead.
#
# The entries below are what was found, kept as the record of where each item
# came from. They are inert to Invoke-Distribute.

[[unmined]]
subject = "The Xmip URI"
source = "_origins/Xmip_Current_State_Specification.md section 12"
detail = """
xmip://[userinfo@][host][:port]/path?query#fragment, stated RFC 3986 compliant.
Omitted userinfo means the caller's identity; omitted host means cluster-wide.
It is the addressing scheme for logging, tracing, metrics, tracking, operations
and reports — six subsystems with no other addressing model written down.
"""
candidate = "docs/architecture/observability-model.md, and an ADR: a URI scheme is a public contract."

[[unmined]]
subject = "Identity classes and identity-context isolation"
source = "_origins/Xmip_Current_State_Specification.md section 8"
detail = """
Four identity classes — highAssurance, federated, sharedSecret, anonymous — and
the isolation rules that use them:

  - Different identity contexts must not share a host process.
  - The regulated profile enforces node-level isolation for highAssurance.
  - A violation blocks artifact startup, and is logged and reported.

Kerberos identity context is defined as domain, service principal, delegation
scope and delegation allow-list, with constrained and unconstrained delegation
being distinct contexts that must not co-reside.

ADR-0019 settled which identity wins. This settles which identities may run
beside each other, which is a different question and is unanswered today.
"""
candidate = "ADR-0019 and ADR-0017. Isolation that blocks startup is exclusiveness."

[[unmined]]
subject = "Security profiles"
source = "_origins/Xmip_Current_State_Specification.md section 9"
detail = """
standard, enterprise, regulated. Regulated means strict isolation, fail-closed,
and mandatory compliance reporting. deployment-model.md has node profiles and
roles; it has no security profile, and fail-closed is a runtime behaviour that
has to be designed rather than declared.
"""
candidate = "docs/architecture/deployment-model.md"

[[unmined]]
subject = "The Void lane"
source = "_origins/Xmip_Current_State_Specification.md section 5"
detail = """
Four runtime lanes — Receive, Process (optional), Send, Void — with four valid
flows: Receive to Send, Receive to Process to Send, Receive to Void, and
Receive to Process to Void.

Void is a terminal lane for a Message that is deliberately not sent. That is
very likely the answer to the open question in runtime-model.md section 21
about Dismissed having no JourneyState variant: the origin model already had
somewhere for a Message to end without delivery and without failure.
"""
candidate = "docs/architecture/runtime-model.md, and it closes an open problem rather than adding one."

[[unmined]]
subject = "Mandatory reports"
source = "_origins/Xmip_Current_State_Specification.md section 13"
detail = """
Two mandatory: the Firewall & Operations Report, and the Identity & Isolation
Compliance Report. Two optional: Performance & Capacity, and Artifact
End-to-End Drill-Down.

The firewall report enumerates TCP and UDP ports, UNC paths for file-based
locations, and protocol exposure — which is derivable from the Receive and Send
Locations, and is the document a security team asks for before Xmip is allowed
onto a network.
"""
candidate = "docs/architecture/observability-model.md, with xmip-core-report owning production."

[[unmined]]
subject = "Message creationInstance metadata"
source = "_origins/Xmip_Current_State_Specification.md section 6"
detail = """
Every Message records how it came to exist: type (port, assignment or
transformation), name, nodeName, clusterName and a UTC timestamp. Together with
'routing never creates new messages; only transformation and assignment do',
this is the provenance rule for the immutable Message model.
"""
candidate = "docs/architecture/runtime-model.md. Check first whether src/ already carries it under another name."

[[unmined]]
subject = "Service bus delivery and sequential sources"
source = "_origins/Xmip_Current_State_Specification.md section 10"
detail = """
Durable queues, restart recoverable, exactly-once where possible and
at-least-once where the external system limits it. Sequential sources use a
durable claim model, lease-based locking and checkpointed recovery.

'It is not a lock, it is runtime exclusiveness' was the correction that
produced ADR-0017. Lease-based locking with checkpointed recovery is the
mechanism that phrasing implies and ADR-0017 does not yet specify.
"""
candidate = "ADR-0017, and xmip-core-resilience."

[[unmined]]
subject = "Offline-first build governance"
source = "_origins/Xmip_Current_State_Specification.md sections 15 and 16"
detail = """
Local build is canonical; CI is advisory. Git is the system of record.
Contributions are moderated. Extensions may be commercial or open source, but
core semantics may not be forked or reimplemented.

The last clause is a licensing position and Xmip is AGPL-3.0-or-later. Whether
'may not be reimplemented' is enforceable, aspirational, or in tension with the
licence is a question for a human, not for this file.
"""
candidate = "docs/governance/release-model.md, and CONTRIBUTING.md. The licence clause needs a decision."

[[unmined]]
subject = "Build targets"
source = "_origins/Xmip_Current_State_Specification.md section 15"
detail = """
Windows, Linux, macOS, ARM including Raspberry Pi, and industrial and defense
hardware. deployment-model.md does not name a target list, and ADR-0021 is
about platform currency rather than platform breadth. ARM and industrial
hardware are the two that change build and packaging decisions.
"""
candidate = "docs/architecture/deployment-model.md and ADR-0015."

