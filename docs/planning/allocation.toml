[[superseded]]
path = "docs/architecture/protocol-landscape.md"
replacedBy = "architecture.toml and docs/architecture/module-model.md"
why = """
Held back through two consolidation passes because its taxonomy was absorbed
into module-model.md section 6 while its **catalogue** was not — it named
protocols that the manifest had never heard of, and deleting it would have
deleted the only record they were intended.

Twenty repositories added to architecture.toml on 2026-08-26, at which point
the catalogue was in the manifest and the document had nothing left to hold.

Transports: bacnet, bluetooth, canopen, coap, dds, dicom, ethernet-ip, j1939,
lorawan, matter, mdns, nats-jetstream, obd-ii, peppol, profinet, redpanda,
snmp, ssdp, syslog, thread, zigbee. Messages: edi-tradacoms, ubl.

Six were classified as not needing a repository and the owner overruled that on
2026-08-26. Four of those overrules were right on precedent and two are
recorded as disagreements rather than settled:

**J1939, OBD-II, CANopen — the owner was right.** They were called protocols
carried on CAN rather than transports. But transport-http depends on
transport-tcp and is its own repository, so a protocol above a transport is
already a transport here. Declared with a dependency on can-bus, exactly as
http declares one on tcp.

**Peppol — the owner was right.** Called AS4 plus UBL, both covered. That
misses SMP and SML lookup, which is Peppol-specific, is neither transport nor
document format, and is the part an implementer actually has to build.

**NATS JetStream — reasonable either way.** Called a mode of NATS. It is a
different API surface with durable streams and its own delivery guarantees,
which is a different implementation whatever it is called.

**Syslog — reasonable, and the two are not the same thing.**
xmip-core-audit-syslog **emits** audit records to a syslog sink.
xmip-core-transport-syslog **receives** syslog as integration input. Same
protocol, opposite directions, different repositories. Worth watching that
nobody merges them on the strength of the shared name.

**Redpanda — the objection was aimed at the wrong thing.** The complaint was
that a separate repository duplicates the Kafka implementation to carry a
vendor name. The answer to that is a declared dependency, not a refused
repository: transport-redpanda depends on transport-kafka and carries the
delta, exactly as nats-jetstream depends on nats. Objection withdrawn,
dependency added.

**mDNS, SSDP, DNS and DHCP — the assistant argued this wrongly and the owner
was right.** The argument made was that they carry no business message.

That premise is false, and the repository already contained its own
counter-example: transport-modbus carries device register values, and nobody
claims Modbus is not a transport because register values are not invoices.
**What a Stream carries does not decide which capability moves it.** On an
industrial edge node, 'a new device appeared with this vendor class' is the
event the estate exists to react to.

The rule is now stated in repository-model.md section 5, because the same wrong
instinct will recur every time a protocol arrives whose payload is not
obviously business data.

There is a real distinction nearby and it is a different feature: a runtime
that *uses* discovery to locate an endpoint and bind a Receive Location to it
is doing self-configuration, not transport. That is open-problems.md problem
16, and it is a decision record when it happens — it changes what a Definition
means, because the set of Receive Location Instances stops being known at
startup.
"""

