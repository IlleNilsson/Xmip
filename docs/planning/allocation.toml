# Rewritten 2026-08-26 as rules rather than an inventory. The previous version
# named sixty-one files individually, of which about twenty no longer existed —
# docs/glossary.md, docs/architecture/kernel-boundary.md, docs/data/*,
# docs/ux/*, docs/vision/*, the four specifications and the rest. An enumerated
# keep-list is a second copy of the directory tree, and a second copy is wrong
# as soon as the first one moves.
#
# A rule that says 'everything under docs/decisions stays' cannot go stale when
# ADR-0022 is written. That is the whole reason to state it this way.

[[keep]]
path = "docs/decisions/*"
reason = """
Every ADR, twenty-one of them today. A decision is platform-wide even when its
subject is one module, and a decision record scattered across forty-three
repositories is not a record.
"""

[[keep]]
path = "docs/governance/*"
reason = """
How the work is governed: architectural-change-permission, release-model and
powershell-style. Governance binds every repository, so it lives in the one
that owns the estate. rust-style.md joins them per section 3b.
"""

[[keep]]
path = "docs/planning/*"
reason = """
Working notes about the estate itself, including this file. Explicitly not
authoritative — README.md says so, and that is what keeps them useful.
"""

[[keep]]
path = "docs/terminology.md"
reason = """
One vocabulary or none. The overlapping glossary.md at both docs/ and
docs/architecture/ is gone; section 8 records why.
"""

[[keep]]
path = "docs/architecture/runtime-model.md"
[[keep]]
path = "docs/architecture/repository-model.md"
[[keep]]
path = "docs/architecture/module-model.md"
[[keep]]
path = "docs/architecture/deployment-model.md"
[[keep]]
path = "docs/architecture/observability-model.md"
reason = """
Five of the six documents ADR-0020 allows. Each answers one question about the
platform as a whole, so each belongs to the repository that is the platform as
a whole. The sixth, identity-by-technology.md, is the exception and moves —
section 3 says why.

These five are named individually rather than as docs/architecture/* on
purpose: the directory currently holds thirty-one files, and a wildcard here
would quietly keep the twenty-five that section 3b is trying to remove. When 3b
is empty, this becomes docs/architecture/* and the exception list disappears.
"""

