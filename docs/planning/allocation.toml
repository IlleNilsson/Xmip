# ===========================================================================
# 7. Decisions — the eleven questions, answered 2026-08-25
# ===========================================================================
#
# Decided while you slept, on the standing instruction that Xmip
# specifications take precedence and the competition is worth looking at.
# Every one is reversible: git holds all of it. Three of them changed my
# recommendation once I read the files rather than their names — 7, 6 and 10.

[[decision]]
question = 1
path = "crates/xmip-handler-file"
decision = "Fold into xmip-core-transport as an implementation module."
to = "xmip-core-transport"
newPath = "src/file.rs"
reason = """
ADR-0016 creates a repository when a thing earns one, and 249 implementations
are declared while none exist. Creating the first level-two repository for a
demo file handler sets the precedent on the weakest possible case. ADR-0017
already settled the shape of the answer for exclusiveness: several modules
within one repository. Promote it to xmip-core-transport-file when there is a
second consumer or a separate release cadence, which is how Camel treats
camel-file inside camel-components rather than as its own artifact.
"""

[[decision]]
question = 2
path = "include/xmip_module.h"
decision = "Move to xmip-core-abi."
to = "xmip-core-abi"
newPath = "include/xmip_module.h"
reason = """
ADR-0012 makes the header the normative boundary and names xmip-core-abi as
the binding crate. A header and the binding that must match it cannot live in
different repositories and stay in step — drift between them is the exact
failure an ABI exists to prevent. Packaging is a build concern and the root
consumes abi as a submodule, so the assembly still gets the header.
"""

[[decision]]
question = 3
path = "eight handler-era documents"
decision = "Salvage the taxonomy and the four lineage files; drop the other two."
to = "xmip-core-transport"
newPath = "docs/technology-lineage.md"
reason = """
handler-taxonomy.md and the four *-lineage.md files are the reasoning that
produced the implementation lists now in architecture.toml. That reasoning is
the expensive part and it belongs beside the module that owns the
technologies. content-handlers.md and handler-implementation-plan.md are a
plan for a design ADR-0010 and ADR-0011 retired, and a plan for a retired
design is not history, it is a trap.
"""
drop = ["docs/content-handlers.md", "docs/handler-implementation-plan.md"]

[[decision]]
question = 4
path = "docs/decisions/ADR-0004-handler-universe.md"
decision = "Keep, with a Superseded-by header naming ADR-0010."
reason = """
An ADR is a record, never a deletion. But a superseded record that does not
say so is worse than no record: the next reader finds it, believes it, and
implements a retired design. Standard Nygard practice, and what MADR and the
Arc42 templates both do.
"""

[[decision]]
question = 5
path = "the three vocabularies"
decision = "docs/terminology.md survives. Migrate what architecture/glossary.md has that it lacks, then delete both glossaries."
reason = """
terminology.md is the only one aligned with current decisions — it already
carries Xmip Service and Xmip Host Service from ADR-0018. docs/glossary.md is
zero bytes. architecture/glossary.md is 363 lines built on Interchange, which
ADR-0013 replaced with Journey, but it holds six sections terminology.md does
not have and should: Definition versus Instance, Handler versus Extension,
Kernel, Section, Failure Persistence, and Retired terms. Retired terms is the
natural home for Interchange itself, alongside Adapter, Plugin and Enabler.
"""
migrate = ["Definition versus Instance", "Handler versus Extension", "Kernel", "Section", "Failure Persistence", "Retired terms"]
remove = ["docs/glossary.md", "docs/architecture/glossary.md"]

[[decision]]
question = 6
path = "docs/module-loading.md and docs/architecture/module-loading.md"
decision = "Not the same document. Both survive, both are renamed."
reason = """
Eighty-seven differing lines, and they are about different subjects wearing
the same filename. The root one is the execution thread and the runtime
boundary: a module entrypoint runs on the calling thread unless Xmip
schedules otherwise. That is ABI. The architecture one is startup discovery,
Handlers and Extensions. That is runtime. Naming both module-loading.md is
what made them look like duplicates.
"""
rename = [
    { from = "docs/module-loading.md", to = "xmip-core-abi", newPath = "docs/execution-model.md" },
    { from = "docs/architecture/module-loading.md", to = "xmip-core-runtime", newPath = "docs/startup-discovery.md" },
]
follows = "The runtime one still says Handler throughout and needs an ADR-0011 pass before it is trustworthy."

[[decision]]
question = 7
path = "the four specification documents"
decision = "They are not versions of each other. Split by subject, not by number."
reason = """
This is the one that changed once I read them. v1.0 is 595 lines with 23
sections that appear in none of the others: Journey states, Journey control,
Replay, Receive model, Send model, Resilience, Artifacts, Configuration,
Content tree, Contract tree. v1.2 is 263 lines and is really about the
estate — classification, naming, maturity, dependency rules. v1.1 is a strict
subset of v1.2, 36 diff lines, all additions. Baseline-Current is a third
genre again: 16 sections of agreed decisions from a review.

Deleting three and keeping one would have thrown away the substantive runtime
architecture and kept the filing rules. The version numbers actively misled
here, which is the argument for dropping them from filenames: git carries
versions, and a version in a filename guarantees this recurs.
"""
plan = [
    { action = "compose", target = "docs/architecture/runtime-model.md", from = ["Specification-v1.0 runtime sections", "Baseline-Current runtime decisions"] },
    { action = "compose", target = "docs/architecture/repository-model.md", from = ["Specification-v1.2 sections 9-15", "the five repository documents of question 8"] },
    { action = "remove", target = "docs/Xmip-Architecture-Specification-v1.1.md", why = "strict subset of v1.2" },
]

[[decision]]
question = 8
path = "the five repository documents"
decision = "Consolidate into docs/architecture/repository-model.md with v1.2. Keep the reasoning, drop the inventories."
reason = """
architecture.toml is now the answer to what the estate contains, so any
document that lists repositories is a second source of truth and will be
wrong within a week. What the manifest cannot hold is why — why the estate is
shaped this way, why a technology implementation is level two, why a crate
name matches its repository. That reasoning is worth one document.
"""

[[decision]]
question = 9
path = "docs/planning/github-repository-inventory-*.md"
decision = "Delete all three."
reason = """
Stale by construction. Xmip-Estate reads the live estate, and tonight it
found something no hand-written inventory did: 42 repositories exist, not the
43 the manifest names, because xmip-core-webapi was renamed in the manifest
and never on GitHub. An inventory that cannot catch that is not an asset.
"""

[[decision]]
question = 10
path = "forge/"
decision = "Delete both files. Flag: say if forge is a live idea."
reason = """
Nothing in the repository references forge, neither file has been touched
since 21 July, and xmip-technology-tree.md is 118 lines describing a
technology tree that architecture.toml now holds with 249 implementations.
module-rules.md is 13 lines. If forge means something planned that has not
been written down, this is the wrong call and git will give them back — but
a directory nothing references is dead until someone says otherwise.
"""
flag = true

[[decision]]
question = 11
path = "src/main.rs"
decision = "Move to xmip-core-cli. The root keeps no binary."
to = "xmip-core-cli"
newPath = "src/main.rs"
reason = """
ADR-0014 says there is one xmip binary. A demo binary in the root is the kind
of thing that eventually ships by accident, and the root has a clear job
without one: the manifest, the record, the assembly and the tooling that
composes the rest.
"""

