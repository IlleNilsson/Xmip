[count]
# Removed 2026-08-26.
#
# This block used to assert: 183 files, keep 108, move 51, remove 14, and
# 'every one of the 183 tracked files appears exactly once. No file is
# unallocated and no entry names a file that does not exist.'
#
# Every one of those numbers was false by the time anyone read it. The last
# line was the worst: twenty-seven move entries named files that did not exist
# or had been consolidated away, which is precisely what it claimed could not
# happen. A hand-maintained count is a second copy of the tree, and a second
# copy is wrong the moment the first one moves — the same failure the keep
# inventory in section 4 had, for the same reason.
#
# Counting by hand is replaced by tests/Allocation.Tests.ps1, which checks the
# claims this block used to make and fails when they stop being true:
#
#   - every [[move]] and [[superseded]] path exists on disk
#   - every [[move]] destination is a repository in architecture.toml
#   - no path appears in two sections
#   - nothing under docs/ is unaccounted for
#
# Section 4 is now rules rather than an inventory, so 'every file appears
# exactly once' is no longer the invariant. The invariant is that nothing is
# *unaccounted for*, and a rule accounts for a directory without naming it.

verifiedBy = "tests/Allocation.Tests.ps1"

