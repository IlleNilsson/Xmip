# The names are a proposal. Say so if any of them is wrong.

[create]
planned = [
    "xmip-core-abi",
    "xmip-core-webapi",
    "xmip-core-transport",
    "xmip-core-logic",
    "xmip-core-migrate",
    "xmip-core-schedule",
    "xmip-core-diagnose",
]

fromOrphanCrate = [
    "xmip-core-runtime",   # crates/xmip-runtime + -service + -host, ADR-0018
    "xmip-core-persist",   # crates/xmip-persistence   RuntimeStore, checkpoints, recovery, leases
    "xmip-core-configure", # crates/xmip-configuration parses declared configuration
]

# Surfaces named in surface with no module, so nothing would have created a
# repository for them. ADR-0014 clauses 7, 12, 13 and 14.
fromSurface = [
    "xmip-core-cli",        # the xmip executable and the operations library
    "xmip-core-powershell", # PowerShell Core module, cross-platform
    "xmip-core-gui",        # .NET 11 Blazor, MAUI desktop and server-side web
]

