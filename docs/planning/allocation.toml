"""

[[superseded]]
path = "docs/architecture/message-runtime-context.md"
replacedBy = "docs/architecture/runtime-model.md"
why = """
Stream to ownership to publication to subscription, and the validation gates
along it. Sections 5 to 10 carry the lifecycle, and section 22 carries the
serialization rule — structured validation before serialization, representation
checks only after.

Three things it held that section 9 did not, added 2026-08-26 rather than
dropped:

Subscription Instances form a chain like a call stack, which is what makes a
Journey explainable after the fact.

Nothing bounds that chain. A Process publishing a Message that matches a
Subscription starting the same Process is a loop with no depth limit, no cycle
detection and no budget. That was two of this document's six unanswered
questions and is now open-problems.md problem 13, with options.

There is no separate concept of transformed properties — a negative rule, and
the kind that only gets written down once somebody has been tempted.
"""

[[superseded]]
path = "docs/content-handlers.md"
replacedBy = "docs/architecture/runtime-model.md"
why = """
