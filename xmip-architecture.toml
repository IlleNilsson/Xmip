# Xmip architecture manifest.
#
# Schema 2.0. The tree is the data: a repository name is derived from its
# position, so a name cannot drift from the structure that owns it.
#   provider.core.module.transport.implementation.http -> xmip-core-transport-http
#
# Keys follow ADR-0011: shortest singular form.

schemaVersion = "2.0.0"
architectureVersion = "0.9.0"
minimumScriptVersion = "1.4.0"
name = "Xmip Architecture"
owner = "IlleNilsson"
powershellRuntime = "[object Object]"
surface = ["abi", "cli", "gui", "powershell"]

[default]
visibility = "public"
autoInitialize = true
hasIssues = true
hasProjects = false
hasWiki = false
defaultBranch = "main"
license = "AGPL-3.0-or-later"
maturity = "reserved"
repositoryTopics = ["xmip"]
submoduleRoot = "modules"

[classification]
Foundation = "Things Xmip is."
Capabilities = "Things Xmip does."
Technology = "How a capability is implemented."
Operations = "Running and governing Xmip."
Platform = "Platform-wide runtime services."

[crate]
language = "rust"
edition = "2021"
primaryCrateMatchesRepository = true
license = "AGPL-3.0-or-later"
template = "IlleNilsson/xmip-template"
automaticVerification = false

[policy]
acyclic = true
rule = [
  "Foundation repositories must not depend on Technology repositories.",
  "Common capability repositories must not depend on their technology children.",
  "Technology repositories may depend on their parent capability.",
  "Technology sibling dependencies are disallowed unless explicitly declared.",
  "Operations consume public contracts and events, not implementation internals.",
  "Platform services must not depend on specific Technology repositories.",
]

# Platform level. One token after xmip-, no provider, implements nothing.

[platform.xmip-core]
description = "Core Xmip identifiers, shared types and stable public contracts."
domain = "Foundation"
role = "common-architecture"
dependency = []

# Modules. Second token is the provider, third the module.

