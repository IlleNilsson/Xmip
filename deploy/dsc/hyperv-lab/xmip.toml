# The Hyper-V lab's cluster: one xmip.toml for the whole cluster, each node's
# section under [nodes.<name>] (ADR-0031, amendment 2026-10-03), sliced on
# each Xmip machine by `xmip-service --slice` as the lab configures it. A
# node's name is its machine's name in lab.json, and `roles` is what it
# declares, in node::NodeRole's words (ADR-0056, amendments 2026-10-01).
#
# Three Windows Server nodes process; one AlmaLinux node receives and one
# sends, so a Journey crosses machines at both hand-ons. No node declares
# storage yet: the lab's PostgreSQL servers wait for the Storage nodes in
# front of them (deployment-model.md section 7).

[service]
name = "xmip"
cluster_name = "xmip-lab"

[nodes.XMIP-APP01]
roles = "processing"

[nodes.XMIP-APP02]
roles = "processing"

[nodes.XMIP-APP03]
roles = "processing"

[nodes.XMIP-IN01]
roles = "receiving"

[nodes.XMIP-OUT01]
roles = "sending"
