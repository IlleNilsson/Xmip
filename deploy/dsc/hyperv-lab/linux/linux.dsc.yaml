# One AlmaLinux guest of the Xmip Hyper-V lab, run on the guest by DSC v3 as
# the host's Xmip.Lab/LinuxGuests resource asks over SSH. The host writes the
# machine parameter (machine.json beside this file); no secret is in it.
$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
parameters:
  machine:
    type: object
resources:
  - name: LinuxGuest
    type: Xmip.Lab/LinuxGuest
    properties:
      Machine: "[parameters('machine')]"
