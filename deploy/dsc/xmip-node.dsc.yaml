# Xmip DSC v3 sample
# Intended as a starter desired-state document.
#
# TLS is a build feature, not an entry here: a package built without `tls`
# refuses an https endpoint rather than sending it in the clear
# (deployment-model.md section 2, ADR-0033).

$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
resources:
  - name: XmipRoot
    type: Microsoft.DSC/PowerShell
    properties:
      resources:
        - name: CreateXmipLayout
          type: PSDesiredStateConfiguration/Script
          properties:
            GetScript: |
              @{ Result = Test-Path '/opt/xmip' }
            TestScript: |
              Test-Path '/opt/xmip/config/xmip-node.toml'
            SetScript: |
              $root = '/opt/xmip'
              New-Item -ItemType Directory -Force -Path $root | Out-Null
              New-Item -ItemType Directory -Force -Path "$root/bin" | Out-Null
              New-Item -ItemType Directory -Force -Path "$root/config" | Out-Null
              New-Item -ItemType Directory -Force -Path "$root/modules" | Out-Null
              New-Item -ItemType Directory -Force -Path "$root/data/persistence-rocksdb" | Out-Null
              New-Item -ItemType Directory -Force -Path "$root/logs" | Out-Null
              New-Item -ItemType File -Force -Path "$root/data/management.sqlite" | Out-Null
              @'
              # The node configuration xmip-core-configure reads
              # (module/platform/configure/doc/node-configuration.md). What the
              # reader has a default for is left to it: the data directory is
              # the `data` beside this file's `config`, and the runtime store is
              # RocksDB there, sealed by the platform's key store (ADR-0018,
              # amendment 2026-09-30).
              [service]
              name = "local-xmip-service"
              cluster_name = "local-xmip-cluster"
              node_name = "local-xmip-node"
              # ADR-0045: a node may assume no route to the internet unless
              # the operator says so here; nothing at runtime reaches out.
              online = false
              '@ | Set-Content -Path "$root/config/xmip-node.toml" -Encoding UTF8

# The site this node is built from (ADR-0015, amendment 2026-10-01):
# Build-XmipService -Site builds its xmip-service with what the site's
# target, roles and domains need. The node configuration above names no
# technology: the node loads what its configuration names, from what that
# build linked (ADR-0025, amendment 2026-09-28).
metadata:
  xmip:
    site: deploy/site/hospital-interface.toml
