                "xmip-core-resilience-retry",
                "xmip-core-resilience-timeout",
                "xmip-core-transport-aws-kinesis",
                "xmip-core-transport-aws-sns",
                "xmip-core-transport-azure-event-grid",
                "xmip-core-transport-azure-event-hubs",
                "xmip-core-transport-azure-service-bus",
                "xmip-core-transport-bluetooth",
                "xmip-core-transport-canopen",
                "xmip-core-transport-dds",
                "xmip-core-transport-dicom",
                "xmip-core-transport-ethercat",
                "xmip-core-transport-ethernet",
                "xmip-core-transport-ethernet-ip",
                "xmip-core-transport-google-pub-sub",
                "xmip-core-transport-ibm-mq",
                "xmip-core-transport-iec-61850",
                "xmip-core-transport-io-link",
                "xmip-core-transport-j1939",
                "xmip-core-transport-knx",
                "xmip-core-transport-lorawan",
                "xmip-core-transport-m-bus",
                "xmip-core-transport-msmq",
                "xmip-core-transport-named-pipe",
                "xmip-core-transport-nfs",
                "xmip-core-transport-obd-ii",
                "xmip-core-transport-opc-ua",
                "xmip-core-transport-oracle",
                "xmip-core-transport-profinet",
                "xmip-core-transport-smb",
                "xmip-core-transport-thread",
                "xmip-core-transport-uds",
                "xmip-core-transport-unix-socket",
                "xmip-core-transport-wireless-hart",
                "xmip-core-transport-wireless-m-bus",
                "xmip-core-transport-zigbee",
                "xmip-core-message-avro",
                "xmip-core-message-csv",
                "xmip-core-message-edi-edifact",
                "xmip-core-message-edi-tradacoms",
                "xmip-core-message-edi-x12",
                "xmip-core-message-fixed-width",
                "xmip-core-message-hl7-er7",
                "xmip-core-message-protobuf",
                "xmip-core-logic-matter",
              ]
              started = [
                "xmip-core-transport-file", "xmip-core-transport-tcp",
                "xmip-core-transport-udp", "xmip-core-transport-http",
                "xmip-core-contract-csv", "xmip-core-contract-json-schema",
                "xmip-core-contract-xml-schema", "xmip-core-contract-regex",
                "xmip-core-logic-http-api",
                "xmip-core-path-json-pointer", "xmip-core-path-xpath", "xmip-core-path-index",
                "xmip-core-archive-parquet",
              ]
              '@ | Set-Content| Set-Content -Path "$root/config/xmip-node.toml" -Encoding UTF8
