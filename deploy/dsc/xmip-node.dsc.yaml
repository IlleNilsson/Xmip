# Xmip DSC v3 sample
# Intended as a starter desired-state document.

$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
resources:
  - name: XmipRoot
    type: Microsoft.DSC/PowerShell
    properties:
      resources:
        - name: CreateXmipLayout
          type: PSDesiredStateConfiguration/Script
          properties:
            GetScript: |
              @{ Result = Test-Path '/opt/xmip' }
            TestScript: |
              Test-Path '/opt/xmip/config/xmip-node.toml'
            SetScript: |
              $root = '/opt/xmip'
              New-Item -ItemType Directory -Force -Path $root | Out-Null
              New-Item -ItemType Directory -Force -Path "$root/bin" | Out-Null
              New-Item -ItemType Directory -Force -Path "$root/config" | Out-Null
              New-Item -ItemType Directory -Force -Path "$root/modules" | Out-Null
              New-Item -ItemType Directory -Force -Path "$root/data/persistence-rocksdb" | Out-Null
              New-Item -ItemType Directory -Force -Path "$root/logs" | Out-Null
              New-Item -ItemType File -Force -Path "$root/data/management.sqlite" | Out-Null
              @'
              [node]
              name = "local-xmip-node"
              cluster = "local-xmip-cluster"
              # ADR-0045: a node may assume no route to the internet unless
              # the operator says so here; nothing at runtime reaches out.
              online = false

              [storage]
              persistence_engine = "rocksdb"
              persistence_path = "/opt/xmip/data/persistence-rocksdb"
              management_engine = "sqlite"
              management_path = "/opt/xmip/data/management.sqlite"

              [modules]
              load_from = "/opt/xmip/modules"
              '@ |              [modules]
              load_from = "/opt/xmip/modules"

              # The technologies this node carries, by repository name (ADR-0011),
              # and which of them start. One name per module the estate has built,
              # kept in step with architecture.toml maturity; trim for a node that
              # carries less. The started set is what a plain HTTP and file node
              # needs; the rest are present, stopped until a Location names them.
              present = [
                "xmip-core-transport-file", "xmip-core-transport-tcp",
                "xmip-core-transport-udp", "xmip-core-transport-http",
                "xmip-core-transport-smtp", "xmip-core-transport-websocket",
                "xmip-core-transport-mllp", "xmip-core-transport-modbus",
                "xmip-core-transport-bacnet", "xmip-core-transport-serial",
                "xmip-core-transport-can-bus", "xmip-core-transport-mqtt",
                "xmip-core-transport-nats", "xmip-core-transport-syslog",
                "xmip-core-transport-coap", "xmip-core-transport-ftp",
                "xmip-core-transport-pop3", "xmip-core-transport-redis-streams",
                "xmip-core-transport-dns", "xmip-core-transport-imap",
                "xmip-core-transport-amqp", "xmip-core-transport-iec-60870-5-104",
                "xmip-core-transport-dnp3", "xmip-core-transport-kafka",
                "xmip-core-transport-cotp", "xmip-core-transport-s7comm",
                "xmip-core-transport-secs-gem", "xmip-core-transport-snmp",
                "xmip-core-transport-ssdp", "xmip-core-transport-mdns",
                "xmip-core-transport-dhcp", "xmip-core-transport-webdav",
                "xmip-core-transport-activemq", "xmip-core-transport-rabbitmq",
                "xmip-core-transport-nats-jetstream", "xmip-core-transport-redpanda",
                "xmip-core-transport-postgresql", "xmip-core-transport-s3",
                "xmip-core-transport-azure-blob", "xmip-core-transport-google-cloud-storage",
                "xmip-core-transport-mssql", "xmip-core-transport-mysql",
                "xmip-core-contract-csv", "xmip-core-contract-json-schema",
                "xmip-core-contract-xml-schema", "xmip-core-contract-regex",
                "xmip-core-contract-schematron", "xmip-core-contract-fixed-width",
                "xmip-core-contract-edi-edifact", "xmip-core-contract-hl7-v2",
                "xmip-core-contract-fhir", "xmip-core-contract-edi-x12",
                "xmip-core-contract-avro", "xmip-core-contract-graphql-schema",
                "xmip-core-contract-protobuf", "xmip-core-contract-wsdl",
                "xmip-core-contract-openapi", "xmip-core-contract-asyncapi",
                "xmip-core-contract-sql",
                "xmip-core-logic-http-api", "xmip-core-logic-soap", "xmip-core-logic-grpc",
                "xmip-core-path-json-pointer", "xmip-core-path-xpath", "xmip-core-path-index",
                "xmip-core-path-dot", "xmip-core-path-jsonpath", "xmip-core-path-fhirpath",
                "xmip-core-path-predicate", "xmip-core-path-regex",
                "xmip-core-archive-parquet", "xmip-core-archive-sqlite", "xmip-core-archive-file",
                "xmip-core-archive-sql", "xmip-core-archive-postgresql", "xmip-core-archive-mssql",
                "xmip-core-archive-mysql", "xmip-core-archive-s3", "xmip-core-archive-azure-blob",
