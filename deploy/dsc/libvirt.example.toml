# a far end that sends to the cluster, the plan's external TX1
[[machines]]
name = "XMIP-EXTTX01"
address = "10.77.0.91"
image = "AlmaLinux10"
memory_gb = 2
dynamic_memory = { minimum_gb = 0.5, maximum_gb = 2 }
cpu = 1
disk_gb = 32
