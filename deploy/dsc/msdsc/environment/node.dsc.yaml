# One Xmip node on its own machine, Windows or AlmaLinux alike: its account,
# its slice, node.xmip, as the machine deploying the environment sliced and
# signed it, writable by its account and the administrators alone (ADR-0031,
# amendment 2026-11-06, point 4), with the certificate of the authority
# that signed it, its certificate from the cluster's own authority, the estate's package, which
# installs and starts its service, the firewall openings its configuration
# listens on, and its service running. The node never slices
# (ADR-0031, amendment 2026-11-06). Applied on the node machine itself by Xmip.Environment/Machine
# (machine.dsc.yaml), which copies this folder and the files
# below to the machine's staging folder first; README.md says how.
#
# Every resource is an Xmip resource of this folder (node.resource.ps1),
# because the rules it applies — the ports, the layout — are xmip-service's,
# which it asks, and because one document serves both families: DSC refuses
# a document naming a resource its machine has none of, a condition
# notwithstanding, so the built-in Microsoft.Windows/Service, which DSC has
# on Windows alone, cannot be named here (checked 2026-11-11, DSC
# 3.4.0-preview.2: "Resource not found" on AlmaLinux).
$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
directives:
  version: ^3.4.0-preview.2
parameters:
  staging:
    type: string
    description: >-
      Where Xmip.Environment/Machine copied this folder and the files:
      node.xmip, authority.pem, node.pem, node.key, anchors.pem and the
      package.
  family:
    type: string
    allowedValues: [Windows, Linux]
    description: The machine's operating system.
  node:
    type: string
    description: The node this machine is, as cluster.xmip declares it.
  cluster:
    type: string
    description: The cluster's name, which the package's install is given.

  account:
    type: string
    description: >-
      The account the node's service runs as: NT SERVICE\xmip-<node> on
      Windows, a system account on Linux.
  package:
    type: string
    description: The package's file name among the files, the MSI or the .rpm.
  layout:
    type: object
    description: >-
      Where the package puts the node on this family: program, the
      xmip-service it installs, and configuration, its config folder.
resources:
  - name: Account
    type: Xmip.Node/Account
    requireVersion: ^0.1
    condition: "[equals(parameters('family'), 'Linux')]"
    properties:
      name: "[parameters('account')]"
  - name: Slice
    type: Xmip.Node/Slice
    requireVersion: ^0.1
    properties:
      configuration: "[parameters('layout').configuration]"
      source: "[path(parameters('staging'), 'files', 'node.xmip')]"
      certificate: "[path(parameters('staging'), 'files', 'authority.pem')]"
      node: "[parameters('node')]"
      account: "[parameters('account')]"
      program: "[parameters('layout').program]"
  - name: Certificate
    type: Xmip.Node/File
    requireVersion: ^0.1
    properties:
      path: "[path(parameters('layout').configuration, 'tls', 'node.pem')]"
      source: "[path(parameters('staging'), 'files', 'node.pem')]"
      private: false
  - name: Key
    type: Xmip.Node/File
    requireVersion: ^0.1
    dependsOn:
      - "[resourceId('Xmip.Node/File', 'Certificate')]"
    properties:
      path: "[path(parameters('layout').configuration, 'tls', 'node.key')]"
      source: "[path(parameters('staging'), 'files', 'node.key')]"
      private: true
      owner: "[if(equals(parameters('family'), 'Linux'), parameters('account'), '')]"
  - name: Anchors
    type: Xmip.Node/File
    requireVersion: ^0.1
    properties:
      path: "[path(parameters('layout').configuration, 'tls', 'anchors.pem')]"
      source: "[path(parameters('staging'), 'files', 'anchors.pem')]"
      private: false
  - name: Package
    type: Xmip.Node/Package
    requireVersion: ^0.1
    dependsOn:
      - "[resourceId('Xmip.Node/Slice', 'Slice')]"
      - "[resourceId('Xmip.Node/File', 'Key')]"
      - "[resourceId('Xmip.Node/File', 'Anchors')]"
    properties:
      path: "[path(parameters('staging'), 'files', parameters('package'))]"
      node: "[parameters('node')]"
      cluster: "[parameters('cluster')]"
      account: "[parameters('account')]"

  - name: Opening
    type: Xmip.Node/Opening
    requireVersion: ^0.1
    dependsOn:
      - "[resourceId('Xmip.Node/Package', 'Package')]"
    properties:
      program: "[parameters('layout').program]"
      configuration: "[path(parameters('layout').configuration, 'node.xmip')]"
      node: "[parameters('node')]"
  - name: Service
    type: Xmip.Node/Service
    requireVersion: ^0.1
    dependsOn:
      - "[resourceId('Xmip.Node/Package', 'Package')]"
    properties:
      name: "[concat('xmip-', parameters('node'))]"
