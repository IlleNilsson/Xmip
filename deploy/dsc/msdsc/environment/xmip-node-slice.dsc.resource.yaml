$schema: https://aka.ms/dsc/schemas/v3/bundled/resource/manifest.json
type: Xmip.Node/Slice
version: '0.1.0'
description: >-
  The node's configuration, node.xmip, as the machine deploying the environment
  sliced and signed it, and the certificate of the authority that signed it,
  authority/authority.pem beside it, in place; the service restarted when they
  changed and it is installed. The node never slices.
tags:
  - Xmip
get:
  executable: pwsh
  args:
    - -NoLogo
    - -NonInteractive
    - -NoProfile
    - -File
    - ./node.resource.ps1
    - -Kind
    - Slice
    - -Operation
    - get
  input: stdin
test:
  executable: pwsh
  args:
    - -NoLogo
    - -NonInteractive
    - -NoProfile
    - -File
    - ./node.resource.ps1
    - -Kind
    - Slice
    - -Operation
    - test
  input: stdin
  return: state
set:
  executable: pwsh
  args:
    - -NoLogo
    - -NonInteractive
    - -NoProfile
    - -File
    - ./node.resource.ps1
    - -Kind
    - Slice
    - -Operation
    - set
  input: stdin
  implementsPretest: true
  return: state
exitCodes:
  '0': Success
  '1': Error
schema: !embedded
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    required:
      - configuration
      - source
      - certificate
      - node
    properties:
      configuration:
        description: 'The folder the node reads its configuration in.'
        type: string
      source:
        description: 'The node.xmip it was shipped, signed.'
        type: string
      certificate:
        description: 'The certificate of the authority that signed it, as shipped.'
        type: string
      node:
        description: 'The node this machine is.'
        type: string
      _exist:
        type: boolean
        readOnly: true
      _inDesiredState:
        type: boolean
        readOnly: true
