$schema: https://aka.ms/dsc/schemas/v3/bundled/resource/manifest.json
type: Xmip.Node/Slice
version: '0.1.0'
description: >-
  The node's configuration, node.xmip, as the machine deploying the environment
  sliced and signed it, and the certificate of the authority that signed it,
  authority/authority.pem beside it, in place, node.xmip writable by the node's
  account and the administrators alone, and, where the node is installed, the
  configuration it runs, as xmip-service --activation says; the service
  restarted when they changed or the node does not run it, and it is
  installed. The node never slices.
tags:
  - Xmip
get:
  executable: pwsh
  args:
    - -NoLogo
    - -NonInteractive
    - -NoProfile
    - -File
    - ./node.resource.ps1
    - -Kind
    - Slice
    - -Operation
    - get
  input: stdin
  requireSecurityContext: elevated
test:
  executable: pwsh
  args:
    - -NoLogo
    - -NonInteractive
    - -NoProfile
    - -File
    - ./node.resource.ps1
    - -Kind
    - Slice
    - -Operation
    - test
  input: stdin
  requireSecurityContext: elevated
  return: state
set:
  executable: pwsh
  args:
    - -NoLogo
    - -NonInteractive
    - -NoProfile
    - -File
    - ./node.resource.ps1
    - -Kind
    - Slice
    - -Operation
    - set
  input: stdin
  requireSecurityContext: elevated
  implementsPretest: true
  return: state
exitCodes:
  '0': Success
  '1': Error
schema: !embedded
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    required:
      - configuration
      - source
      - certificate
      - node
      - account
      - program
    properties:
      configuration:
        description: 'The folder the node reads its configuration in.'
        type: string
      program:
        description: >-
          The xmip-service the package installs, asked whether the node runs
          the slice placed for it; not asked before it is installed.
        type: string
      source:
        description: 'The node.xmip it was shipped, signed.'
        type: string
      certificate:
        description: 'The certificate of the authority that signed it, as shipped.'
        type: string
      node:
        description: 'The node this machine is.'
        type: string
      account:
        description: >-
          The account the node's service runs as, which with the administrators
          alone may write node.xmip.
        type: string
      access:
        description: >-
          Who may write node.xmip as found: on Windows each rule as
          <SID>:<rights> and protected, that it inherits nothing; on Linux
          owner:group and the mode.
        readOnly: true
        type: array
        items:
          type: string
      activation:
        description: >-
          What xmip-service --activation said, in the node's words: the slice
          it runs as its active configuration, or why it does not run the one
          placed — a correctly signed slice the node cannot start is refused
          and the node runs the last one that ran. Empty where it was not
          asked.
        readOnly: true
        type: string
      _exist:
        type: boolean
        readOnly: true
      _inDesiredState:
        type: boolean
        readOnly: true
