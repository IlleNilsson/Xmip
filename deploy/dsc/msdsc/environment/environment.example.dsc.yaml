# The Playground's cluster on the Hyper-V example's machines, run from the
# host: the names on the DNS server first, then machine.dsc.yaml once for
# each node machine, Windows and AlmaLinux alike. One instance per node,
# written out, as DSC v3 wants a document (copy loops are deprecated,
# https://github.com/PowerShell/DSC/issues/1429). Which node runs on which
# machine is environment.example.parameters.yaml's `nodes`, never the
# cluster's xmip.toml; every node machine is told those nodes, which its
# node's Locations are placed over (xmip-service --slice --bind --nodes).
# README.md says how to run it.
$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
directives:
  version: ^3.2
parameters:
  common:
    type: object
    description: >-
      What every machine shares: template (this folder), cluster, domain,
      configuration, identity, credentialPath, keyPath, linuxAccount and
      farEnd, the address the machines reach the Playground's far end at
      (machine.dsc.yaml).
  packages:
    type: object
    description: Per family, the package's path and the file name it is given there.
  layout:
    type: object
    description: Per family, where the package puts the node.
  accounts:
    type: object
    description: Per family, the account a node's service runs as.
  nameServer:
    type: object
    description: The environment's DNS server, its name, address and family.
  nodes:
    type: object
    description: Each node the environment runs on a machine of its own, and that machine.
resources:
  - name: Names
    type: Xmip.Environment/Machine
    requireVersion: ^0.1
    properties:
      name: "[parameters('nameServer').name]"
      address: "[parameters('nameServer').address]"
      family: "[parameters('nameServer').family]"
      login: "[parameters('common').linuxAccount]"
      credentialPath: "[parameters('common').credentialPath]"
      keyPath: "[parameters('common').keyPath]"
      document: name.dsc.yaml
      files: "[createObject()]"
      parameters: >-
        [createObject('zone', parameters('common').domain, 'records', createArray(
        createObject('name', parameters('common').cluster, 'addresses', createArray(
        parameters('nodes').R1.address, parameters('nodes').S1.address,
        parameters('nodes').P1.address, parameters('nodes').L1.address,
        parameters('nodes').D1.address)),
        createObject('name', 'R1', 'addresses', createArray(parameters('nodes').R1.address)),
        createObject('name', 'S1', 'addresses', createArray(parameters('nodes').S1.address)),
        createObject('name', 'P1', 'addresses', createArray(parameters('nodes').P1.address)),
        createObject('name', 'L1', 'addresses', createArray(parameters('nodes').L1.address)),
        createObject('name', 'D1', 'addresses', createArray(parameters('nodes').D1.address))))]
  - name: R1
    type: Microsoft.DSC/Include
    dependsOn:
      - "[resourceId('Xmip.Environment/Machine', 'Names')]"
    properties:
      configurationFile: "[path(parameters('common').template, 'machine.dsc.yaml')]"
      parametersContent: >-
        [string(createObject('parameters', createObject('common', parameters('common'),
        'packages', parameters('packages'), 'layout', parameters('layout'),
        'accounts', parameters('accounts'),
        'placed', join(objectKeys(parameters('nodes')), ','), 'node', 'R1',
        'machine', parameters('nodes').R1)))]
  - name: S1
    type: Microsoft.DSC/Include
    dependsOn:
      - "[resourceId('Xmip.Environment/Machine', 'Names')]"
    properties:
      configurationFile: "[path(parameters('common').template, 'machine.dsc.yaml')]"
      parametersContent: >-
        [string(createObject('parameters', createObject('common', parameters('common'),
        'packages', parameters('packages'), 'layout', parameters('layout'),
        'accounts', parameters('accounts'),
        'placed', join(objectKeys(parameters('nodes')), ','), 'node', 'S1',
        'machine', parameters('nodes').S1)))]
  - name: P1
    type: Microsoft.DSC/Include
    dependsOn:
      - "[resourceId('Xmip.Environment/Machine', 'Names')]"
    properties:
      configurationFile: "[path(parameters('common').template, 'machine.dsc.yaml')]"
      parametersContent: >-
        [string(createObject('parameters', createObject('common', parameters('common'),
        'packages', parameters('packages'), 'layout', parameters('layout'),
        'accounts', parameters('accounts'),
        'placed', join(objectKeys(parameters('nodes')), ','), 'node', 'P1',
        'machine', parameters('nodes').P1)))]
  - name: L1
    type: Microsoft.DSC/Include
    dependsOn:
      - "[resourceId('Xmip.Environment/Machine', 'Names')]"
    properties:
      configurationFile: "[path(parameters('common').template, 'machine.dsc.yaml')]"
      parametersContent: >-
        [string(createObject('parameters', createObject('common', parameters('common'),
        'packages', parameters('packages'), 'layout', parameters('layout'),
        'accounts', parameters('accounts'),
        'placed', join(objectKeys(parameters('nodes')), ','), 'node', 'L1',
        'machine', parameters('nodes').L1)))]
  - name: D1
    type: Microsoft.DSC/Include
    dependsOn:
      - "[resourceId('Xmip.Environment/Machine', 'Names')]"
    properties:
      configurationFile: "[path(parameters('common').template, 'machine.dsc.yaml')]"
      parametersContent: >-
        [string(createObject('parameters', createObject('common', parameters('common'),
        'packages', parameters('packages'), 'layout', parameters('layout'),
        'accounts', parameters('accounts'),
        'placed', join(objectKeys(parameters('nodes')), ','), 'node', 'D1',
        'machine', parameters('nodes').D1)))]
