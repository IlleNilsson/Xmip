$schema: https://aka.ms/dsc/schemas/v3/bundled/resource/manifest.json
type: Xmip.Node/Service
version: '0.1.0'
description: >-
  The node's service running and started with the machine, its Windows service or its
  systemd unit, restarted once where a step before changed what it runs and waited for
  once until it is ready.
tags:
  - Xmip
get:
  executable: pwsh
  args:
    - -NoLogo
    - -NonInteractive
    - -NoProfile
    - -File
    - ./node.resource.ps1
    - -Kind
    - Service
    - -Operation
    - get
  input: stdin
test:
  executable: pwsh
  args:
    - -NoLogo
    - -NonInteractive
    - -NoProfile
    - -File
    - ./node.resource.ps1
    - -Kind
    - Service
    - -Operation
    - test
  input: stdin
  return: state
set:
  executable: pwsh
  args:
    - -NoLogo
    - -NonInteractive
    - -NoProfile
    - -File
    - ./node.resource.ps1
    - -Kind
    - Service
    - -Operation
    - set
  input: stdin
  requireSecurityContext: elevated
  implementsPretest: true
  return: state
exitCodes:
  '0': Success
  '1': Error
schema: !embedded
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    required:
      - name
    properties:
      name:
        description: 'The unit, xmip-<node>.'
        type: string
      node:
        description: >-
          The node, as cluster.xmip declares it; with configuration, program
          and ready, the node this step restarts once where a step before it
          changed what it runs, and waits for once until it is ready
          (ADR-0056, amendment 2026-11-24).
        type: string
      configuration:
        description: >-
          The node's configuration folder, where the steps before leave what
          they changed (deploy.pending).
        type: string
      program:
        description: 'The xmip-service the package installed, asked whether the node is ready.'
        type: string
      ready:
        description: >-
          How long, in seconds, a node this deploy restarted is waited for
          until it is ready, as xmip-service --readiness says, before the
          next node is deployed; refused past it, in the node's words.
        type: integer
        default: 180
      pending:
        description: >-
          What the steps before left as found: restart, ready, or empty.
        readOnly: true
        type: string
      _exist:
        type: boolean
        readOnly: true
      _inDesiredState:
        type: boolean
        readOnly: true
