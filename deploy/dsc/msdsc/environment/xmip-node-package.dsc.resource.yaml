$schema: https://aka.ms/dsc/schemas/v3/bundled/resource/manifest.json
type: Xmip.Node/Package
version: '0.1.0'
description: >-
  The estate's package installed, which runs xmip-service --install for the
  node, its cluster and its account.
tags:
  - Xmip
get:
  executable: pwsh
  args:
    - -NoLogo
    - -NonInteractive
    - -NoProfile
    - -File
    - ./node.resource.ps1
    - -Kind
    - Package
    - -Operation
    - get
  input: stdin
test:
  executable: pwsh
  args:
    - -NoLogo
    - -NonInteractive
    - -NoProfile
    - -File
    - ./node.resource.ps1
    - -Kind
    - Package
    - -Operation
    - test
  input: stdin
  return: state
set:
  executable: pwsh
  args:
    - -NoLogo
    - -NonInteractive
    - -NoProfile
    - -File
    - ./node.resource.ps1
    - -Kind
    - Package
    - -Operation
    - set
  input: stdin
  requireSecurityContext: elevated
  implementsPretest: true
  return: state
exitCodes:
  '0': Success
  '1': Error
schema: !embedded
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    required:
      - path
      - node
      - cluster
      - account
    properties:
      path:
        description: 'The package: the portable archive on Windows, the .rpm on Linux.'
        type: string
      node:
        description: >-
          The node this machine is, as cluster.xmip declares it.
        type: string
      cluster:
        description: 'The cluster''s name.'
        type: string
      account:
        description: 'The account the node''s service runs as.'
        type: string
      modules:
        description: >-
          The module libraries the cluster's file names, built for this
          family: a zip, empty where it names none, unpacked into the
          configuration folder, where each library_path is read.
        type: string
      configuration:
        description: >-
          The node's configuration folder, where a node that ran before the
          install restarted it is left to its Service step to wait for
          (deploy.pending; ADR-0056, amendment 2026-11-24).
        type: string
      names:
        description: >-
          Every node of the cluster by its name at its machine's address, a
          line each, kept as a marked block of the machine's hosts file.
        type: string
      program:
        description: 'The xmip-service the package installs.'
        type: string
      _exist:
        type: boolean
        readOnly: true
      _inDesiredState:
        type: boolean
        readOnly: true
