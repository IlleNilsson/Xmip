# The network's way out, from the machine DSC runs on: the gateway machine
# the network's gateway_machine names translates the network's prefix out
# of its second adapter, the uplink, behind the owner's firewall, and keeps
# that adapter out of the domain's DNS, NetBIOS and reach, its DNS server
# answering on the network alone. Deploy-XmipEnvironment applies it where
# the environment file names a gateway machine: after the domain's
# controller and before the names (deploy/dsc/README.md).
$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
directives:
  version: ^3.4.0-preview.3
parameters:
  common:
    type: object
    description: How the machine is reached, secretPath among it.
  machine:
    type: object
    description: The gateway machine, its name, address and family.
  prefix:
    type: string
    description: The network in CIDR notation, which the gateway translates.
  domain:
    type: string
    description: The environment's DNS domain, whose controller the machine may be.
resources:
  - name: Gateway
    type: Xmip.Environment/Gateway
    requireVersion: ^0.1
    properties:
      name: "[parameters('machine').name]"
      address: "[parameters('machine').address]"
      prefix: "[parameters('prefix')]"
      domain: "[parameters('domain')]"
      secretPath: "[parameters('common').secretPath]"
