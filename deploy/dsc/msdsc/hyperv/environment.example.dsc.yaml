        parameters('images').WindowsServer2025, 'name', 'XMIP-APP02', 'address', '10.77.0.52',
        'memoryGB', 4, 'cpu', 2, 'diskGB', 64))))]
  # Xmip
  - name: XMIP APP03
    type: Microsoft.DSC/Include
