        parameters('images').WindowsServer2025, 'name', 'XMIP-APP01', 'address', '10.77.0.51',
        'memoryGB', 4, 'cpu', 2, 'diskGB', 64))))]
  # Xmip
  - name: XMIP APP02
    type: Microsoft.DSC/Include
    dependsOn:
      - "[resourceId('Microsoft.DSC/Include', 'Network')]"
    properties:
      configurationFile: "[path(parameters('common').template, 'machine.dsc.yaml')]"
      parametersContent: >-
