# The network an environment's machines share on one Hyper-V host: an
# internal virtual switch, the host's address on it, which is the machines'
# gateway, and outbound NAT for that prefix. It asks for elevation as a
# whole: a switch's host address and NAT are an administrator's to set.
# Deploy-XmipEnvironment applies it first; README.md says how.
$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
directives:
  version: ^3.4.0-preview.2
  securityContext: elevated
parameters:
  environment:
    type: string
    description: The environment's name; the NAT is named for it.
  network:
    type: object
    description: >-
      name (the switch's), prefix (the network in CIDR notation), gateway
      (the host's address on the switch), prefixLength and enableNat.
resources:
  - name: Network
    type: Xmip.HyperV/Network
    properties:
      name: "[parameters('network').name]"
      environment: "[parameters('environment')]"
      prefix: "[parameters('network').prefix]"
      gateway: "[parameters('network').gateway]"
      prefixLength: "[parameters('network').prefixLength]"
      nat: "[parameters('network').enableNat]"
