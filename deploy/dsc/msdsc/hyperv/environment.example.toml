# The Essentials' machines on a Windows host's Hyper-V: what
# Deploy-XmipEnvironment reads, in an elevated Xmip PowerShell Console. Copy
# it to .local-work/deploy/hyperv.toml and write in linux_account,
# ssh_public_key and credential.

name = "Xmip-HyperV"
hypervisor = "hyperv"
# The folder that holds a folder per machine.
root = 'D:\HyperV\Xmip'
domain = "xmip.test"
cluster = "C1"
linux_account = ""
# The ed25519 public key the AlmaLinux machines' account is given.
ssh_public_key = ''
# The Windows machines' Administrator credential, Export-Clixml.
credential = ''

[network]
name = "Xmip"
prefix = "10.77.0.0/24"
gateway = "10.77.0.1"
# XMIP-DC01, the domain controller, answers the environment's names.
dns_server = "10.77.0.10"
nat = true

[images.WindowsServer2025]
path = 'D:\Downloads\OS\Images\Microsoft\WindowsServer2025-Eval-26100.1742-en-us.iso'
sha256 = "d0ef4502e350e3c6c53c15b1b3020d38a5ded011bf04998e950720ac8579b23d"
family = "Windows"
edition = "Windows Server 2025 SERVERDATACENTER"
secureBootTemplate = "MicrosoftWindows"
tpm = false

[images.Windows11]
path = 'D:\Downloads\OS\Images\Microsoft\Windows11-Enterprise-Eval-26H2-26300.9457-en-us.iso'
sha256 = "bc3f24086ebadc94489066b5ad78089e2cf5c3491e90e790bb81a2b199c10e38"
family = "Windows"
edition = "Windows 11 Enterprise Evaluation"
secureBootTemplate = "MicrosoftWindows"
tpm = true

[images.AlmaLinux10]
path = 'D:\Downloads\OS\Images\AlmaLinux\AlmaLinux-10.2-x86_64-dvd.iso'
sha256 = "90244ac532f67c978831a381b420da8bda363729e1f4cf8fb8991daca70ee287"
family = "Linux"
secureBootTemplate = "MicrosoftUEFICertificateAuthority"
tpm = false

# domain controller
[[machines]]
name = "XMIP-DC01"
address = "10.77.0.10"
image = "WindowsServer2025"
memory_gb = 4
cpu = 2
disk_gb = 64

# file server
[[machines]]
