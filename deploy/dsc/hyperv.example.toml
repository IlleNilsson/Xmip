# An Xmip environment on a Windows host's Hyper-V: what Deploy-XmipEnvironment
# reads (deploy/dsc/README.md). Copy it to .local-work/deploy/hyperv.toml and
# write in linux_account, secret, slicer, the packages and, for msdsc, the
# tools. msdsc runs in an elevated Xmip PowerShell Console on
# the host; ansible from a Linux controller, the WSL guest.
#
# XMIP-DC01, the domain controller, is the network's DNS server: the names of
# the cluster and its nodes are given it. Which node runs on which machine is
# here, never in the cluster's file: the Essentials simulates the nodes no
# machine runs.

name = "Xmip-HyperV"
# The template set that makes it all, machines and nodes: msdsc (Microsoft
# DSC v3) or ansible, never a mix (ADR-0015, amendment 2026-10-09).
technology = "msdsc"
hypervisor = "hyperv"
# The folder that holds a folder per machine.
root = 'D:\HyperV\Xmip'
domain = "xmip.test"
cluster = "CL1"
# The account each AlmaLinux machine's kickstart makes; it is given the
# environment's own SSH key, which Deploy-XmipEnvironment makes.
linux_account = ""
# The Windows machines' Administrator secret, Export-Clixml.
secret = ''
# ansible only: the Windows host's address as the controller reaches it over
# WinRM; the account it logs in as is ANSIBLE_REMOTE_USER, its password asked.
host = ""

# The cluster's file, each node's configuration sliced from it.
configuration = "test/core/essentials/configuration/cluster.xmip"
# This machine's xmip-service, which slices each node's configuration and
# signs it with the authority below; a node never slices (ADR-0031,
# amendment 2026-11-06).
slicer = ""
# The folder the cluster's authority is kept in: it signs every slice, and
# issued each node's certificate, New-XmipCertificate -Node.
authority = ".local-work/environment/authority"
# A folder per node of what New-XmipCertificate -Node wrote: node.pem,
# node.key and anchors.pem.
identity = ".local-work/environment/identity"
# The Parties' far end the Essentials serves on the host, where the machines
# reach it: the host on the switch. Every Receive Location and Send Port is
# bound there over SFTP, port 7422 (ADR-0028, amendment 2026-10-22).
far_end = "10.77.0.1"

# The packages the nodes are installed from: Build-XmipService -Site
# personal-computer -Package msi on Windows, -Package rpm on a Linux machine
# (deploy/package/README.md).
[packages.Windows]
path = ""

[packages.Linux]
path = ""

# msdsc only: what DSC is brought to each AlmaLinux machine with, each
# tarball checked against its SHA-256 and unpacked in the machine's staging
# folder, never installed for the machine.
[tools.Linux]
pwsh = { path = "", sha256 = "" }
dsc = { path = "", sha256 = "" }

[network]
name = "Xmip"
prefix = "10.77.0.0/24"
gateway = "10.77.0.1"
# XMIP-DC01, the domain controller, answers the environment's names.
dns_server = "10.77.0.10"
nat = true

[images.WindowsServer2025]
path = 'D:\Downloads\OS\Images\Microsoft\WindowsServer2025-Eval-26100.1742-en-us.iso'
sha256 = "d0ef4502e350e3c6c53c15b1b3020d38a5ded011bf04998e950720ac8579b23d"
family = "Windows"
edition = "Windows Server 2025 SERVERDATACENTER"
secureBootTemplate = "MicrosoftWindows"
tpm = false

[images.Windows11]
path = 'D:\Downloads\OS\Images\Microsoft\Windows11-Enterprise-Eval-26H2-26300.9457-en-us.iso'
sha256 = "bc3f24086ebadc94489066b5ad78089e2cf5c3491e90e790bb81a2b199c10e38"
family = "Windows"
edition = "Windows 11 Enterprise Evaluation"
secureBootTemplate = "MicrosoftWindows"
tpm = true

[images.AlmaLinux10]
path = 'D:\Downloads\OS\Images\AlmaLinux\AlmaLinux-10.2-x86_64-dvd.iso'
sha256 = "90244ac532f67c978831a381b420da8bda363729e1f4cf8fb8991daca70ee287"
family = "Linux"
secureBootTemplate = "MicrosoftUEFICertificateAuthority"
tpm = false

# The machines are made in this order, one installation at a time, and
# their nodes are given theirs in the same order: Xmip Storage first, which
# the other nodes reach.

# domain controller
[[machines]]
name = "XMIP-DC01"
address = "10.77.0.10"
image = "WindowsServer2025"
memory_gb = 4
cpu = 2
disk_gb = 64

# file server
[[machines]]
name = "XMIP-FS01"
address = "10.77.0.20"
image = "WindowsServer2025"
memory_gb = 4
cpu = 2
disk_gb = 64

# developer machine
[[machines]]
name = "XMIP-DEV01"
address = "10.77.0.30"
image = "Windows11"
memory_gb = 12
cpu = 4
disk_gb = 128

# PostgreSQL
[[machines]]
name = "XMIP-DB01"
address = "10.77.0.41"
image = "AlmaLinux10"
memory_gb = 4
cpu = 2
disk_gb = 64

# PostgreSQL, standby of XMIP-DB01
[[machines]]
