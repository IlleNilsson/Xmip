---
# One Xmip node on its own machine, Windows or AlmaLinux alike (README.md).
#
# The node this host is: its key under [nodes] in cluster.xmip.
xmip_node_name: ""
# The cluster's name. cluster.xmip names none: where it runs is
# the environment's, so `xmip-service --install --cluster` and `--slice
# --cluster` give it (ADR-0028, amendment 2026-10-21).
xmip_cluster_name: ""
# cluster.xmip on the controller (ADR-0031, amendment
# 2026-10-03): one file for the whole cluster, each node's configuration
# sliced from it and signed on the controller by `xmip-service --slice
# --authority` (ADR-0031, amendment 2026-11-06). Left empty, the package's
# `xmip-service --install` writes its starter, one node keeping Xmip Storage
# itself, and signs it with an authority of its own.
xmip_cluster_configuration: ""
# The controller's xmip-service, which slices and signs; a build for the
# controller's own system.
xmip_slicer: xmip-service
# The folder on the controller the environment's authority is kept in, the
# one New-XmipCertificate -Node issues the nodes' certificates from: it signs
# every node's slice, and only its certificate leaves the controller.
xmip_authority: ""
# A folder on the controller holding what New-XmipCertificate -Node wrote
# for this node under the cluster's own authority: node.pem, node.key and
# anchors.pem. Left empty, the node is given no certificate.
xmip_identity: ""
# The Parties' far end the Essentials serves, where the machines reach it:
# every Receive Location and Send Port the cluster's file designs is bound
# there over SFTP, placed over the inventory's nodes, and every Work Process
# on each node serving its stage, by `xmip-service --slice --bind --nodes`
# (ADR-0028, amendment 2026-10-22; ADR-0056, amendment 2026-11-13). Left
# empty, nothing is bound.
xmip_far_end: ""
# The nodes the inventory runs, the ones the Locations are placed over.
xmip_placed: >-
  {{ groups['xmip_nodes'] | default([])
  | map('extract', hostvars, 'xmip_node_name') | join(',') }}
xmip_bound: "{{ ['--bind', xmip_far_end, '--nodes', xmip_placed] if xmip_far_end else [] }}"
# The estate's package on the controller (deploy/package): the MSI for a
# Windows machine, the .rpm for an AlmaLinux one.
xmip_package: ""
# The account the node's service runs as: a virtual account of its own on
# Windows, a system account on Linux. The assistant's draft of 2026-10-21,
# for the owner to strike (ADR-0015, amendment 2026-10-21).
xmip_account: "{{ ('NT SERVICE\\xmip-' ~ xmip_node_name) if ansible_facts['os_family'] == 'Windows' else 'xmip' }}"
# Where the package puts the node: xmip-service, and its config folder.
xmip_program: "{{ 'C:\\Program Files\\Xmip\\bin\\xmip-service.exe' if ansible_facts['os_family'] == 'Windows' else '/opt/xmip/bin/xmip-service' }}"
xmip_configuration: "{{ 'C:\\ProgramData\\Xmip\\config' if ansible_facts['os_family'] == 'Windows' else '/opt/xmip/config' }}"
# How long, in seconds, the environment's nodes are started again together
# until each runs (tasks/started.yml).
xmip_started_window: 180
# Where the package is copied before it is installed: Ansible's own, never
# the folder Microsoft DSC's template stages in.
xmip_staging: "{{ 'C:\\ProgramData\\Xmip\\ansible' if ansible_facts['os_family'] == 'Windows' else '/var/tmp/xmip-ansible' }}"
# firewalld's command on an AlmaLinux machine, and the ports the node's
# configuration listens on and its firewalld service holds (tasks/linux.yml).
xmip_firewall_cmd: /usr/bin/firewall-cmd
xmip_listened_ports: "{{ xmip_listening.stdout_lines | map('split') | map('first') | list }}"
xmip_held_ports: "{{ xmip_opened.stdout.split() if xmip_opened.rc == 0 else [] }}"

# The site the package is built from (ADR-0015, amendment 2026-10-01):
# Build-XmipService -Site builds its xmip-service with what the site's
# target, roles and chosen technologies need. The node configuration names
# no technology: the node loads what its configuration names, from what
# that build linked (ADR-0025, amendment 2026-09-28).
xmip_site: deploy/site/personal-computer.xmip
