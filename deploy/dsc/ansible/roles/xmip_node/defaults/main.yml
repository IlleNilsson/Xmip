---
xmip_install_root: /opt/xmip
# The cluster's xmip.toml on the controller (ADR-0031, amendment
# 2026-10-03): one file for the whole cluster, each node's configuration
# sliced from it on the node by `xmip-service --slice`. Left empty, the role
# writes its starter, templates/xmip.toml.j2, from the three below.
xmip_cluster_configuration: ""
# The node this host is: its key under [nodes] in the cluster's file.
xmip_node_name: local-xmip-node
# [service] in the starter cluster file.
xmip_service_name: local-xmip-service
xmip_cluster_name: local-xmip-cluster
# ADR-0045: offline unless said. Set true per node that may reach out.
xmip_online: false

# TLS is a build feature, not an entry here: a package built without `tls`
# refuses an https endpoint rather than sending it in the clear
# (deployment-model.md section 2, ADR-0033).
#
# The site this node is built from (ADR-0015, amendment 2026-10-01):
# Build-XmipService -Site builds its xmip-service with what the site's
# target, roles and domains need. The node configuration the template
# writes names no technology: the node loads what its configuration names,
# from what that build linked (ADR-0025, amendment 2026-09-28).
xmip_site: deploy/site/b2b-exchange.toml
