---
# A changed slice or certificate takes effect when the node starts again,
# never mid-flight (module/platform/configure/doc/cluster-configuration.md,
# Activation). Only a node that runs is restarted: one that does not, as
# before the environment's nodes are started together, is started by
# started.yml with the others.

- name: Restart the Xmip node
  ansible.windows.win_powershell:
    parameters:
      Name: "xmip-{{ xmip_node_name }}"
    script: |
      param($Name)
      $Ansible.Changed = (Get-Service -Name $Name -ErrorAction SilentlyContinue).Status -eq 'Running'
      if ($Ansible.Changed) {
          Restart-Service -Name $Name
      }
  when: ansible_facts['os_family'] == 'Windows'
  listen: Restart the Xmip node

- name: Restart the Xmip node on Linux
  ansible.builtin.command:
    argv: [systemctl, try-restart, "xmip-{{ xmip_node_name }}"]
  changed_when: true
  when: ansible_facts['os_family'] != 'Windows'
  become: true
  listen: Restart the Xmip node

- name: Reload the firewall
  ansible.builtin.command:
    argv: [firewall-cmd, --reload]
  changed_when: true
  become: true

# A node this run restarted, one that ran before it, is waited for until it
# is ready before the next host is deployed: environment.yml deploys the
# nodes one host at a time, each host's handlers run before the next, so the
# next Storage node is restarted only once the one before is ready — a
# Storage node restarted comes back a standby, and its primary stopped in
# order before it follows ready has no standby to hand over to (the owner,
# 2026-11-23: "That has to be sorted, nothing can be left"; ADR-0056,
# amendment 2026-11-23). Ready is the node's own word, `xmip-service
# --readiness`, asked again as the node publishes, never a sleep, and past
# xmip_ready_window seconds the run fails in the node's words. After the
# restarts above: handlers run in the order written here.
- name: The Xmip node ready before the next is deployed
  ansible.builtin.command:
    argv:
      - "{{ xmip_program }}"
      - --configuration
      - "{{ xmip_configuration }}/node.xmip"
      - --readiness
      - --within
      - "{{ xmip_ready_window }}"
  changed_when: false
  when: ansible_facts['os_family'] != 'Windows' and xmip_ran.rc | default(1) == 0
  become: true
  listen:
    - Restart the Xmip node
    - The Xmip node restarted

- name: The Xmip node ready before the next is deployed, on Windows
  ansible.windows.win_command:
    argv:
      - "{{ xmip_program }}"
      - --configuration
      - "{{ xmip_configuration }}\\node.xmip"
      - --readiness
      - --within
      - "{{ xmip_ready_window }}"
  changed_when: false
  when: >-
    ansible_facts['os_family'] == 'Windows'
    and (xmip_ran_windows.services | default([]) | map(attribute='state') | list) == ['started']
  listen:
    - Restart the Xmip node
    - The Xmip node restarted
