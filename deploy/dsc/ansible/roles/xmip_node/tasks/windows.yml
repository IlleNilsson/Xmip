---
# The node on a Windows machine, over PowerShell 7 (ansible_pwsh_interpreter).
# Its account is a virtual account, NT SERVICE\xmip-<node>, which exists with
# its service: nothing makes it, and `xmip-service --install --account`
# gives it what it reads.

- name: The config and staging folders
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ xmip_configuration }}"
    - "{{ xmip_staging }}"

- name: The folder of the authority that signed the node's configuration
  ansible.windows.win_file:
    path: "{{ xmip_configuration }}\\authority"
    state: directory
  when: xmip_slice is not skipped

- name: The certificate of the authority that signed it, which the node checks it by
  ansible.windows.win_copy:
    src: "{{ xmip_authority }}/authority.pem"
    dest: "{{ xmip_configuration }}\\authority\\authority.pem"
  when: xmip_slice is not skipped
  notify: Restart the Xmip node

- name: The node's configuration as it is
  ansible.builtin.slurp:
    src: "{{ xmip_configuration }}\\node.xmip"
  register: xmip_held
  failed_when: false
  when: xmip_slice is not skipped

- name: The node's configuration where it reads it, where the text it signs differs
  ansible.windows.win_copy:
    content: "{{ xmip_slice.stdout }}\n"
    dest: "{{ xmip_configuration }}\\node.xmip"
  when: >-
    xmip_slice is not skipped and (xmip_held.content is not defined
    or (xmip_held.content | b64decode).split('\n[signature]\n')[0]
    != xmip_slice.stdout.split('\n[signature]\n')[0])
  notify: Restart the Xmip node

- name: The certificate's folder, inheriting nothing
  ansible.windows.win_file:
    path: "{{ xmip_configuration }}\\tls"
    state: directory
  when: xmip_identity | length > 0

- name: The certificate's folder readable by SYSTEM and the administrators alone
  ansible.windows.win_acl_inheritance:
    path: "{{ xmip_configuration }}\\tls"
    state: absent
    reorganize: false
  when: xmip_identity | length > 0

- name: SYSTEM and the administrators hold the certificate's folder
  ansible.windows.win_acl:
    path: "{{ xmip_configuration }}\\tls"
    user: "{{ item }}"
    rights: FullControl
    type: allow
    inherit: ContainerInherit, ObjectInherit
  loop:
    - SYSTEM
    - Administrators
  when: xmip_identity | length > 0

- name: The node's certificate and anchors from the cluster's authority
  ansible.windows.win_copy:
    src: "{{ xmip_identity }}/{{ item }}"
    dest: "{{ xmip_configuration }}\\tls\\{{ item }}"
  loop:
    - node.pem
    - anchors.pem
  when: xmip_identity | length > 0
  notify: Restart the Xmip node

# The key is a secret: registered for ansible-core 2.22's masking, so it is
# $REDACTED$ wherever Ansible would show it, and never logged or diffed.
- name: The node's key from the cluster's authority
  ansible.windows.win_copy:
    content: "{{ xmip_node_key }}"
    dest: "{{ xmip_configuration }}\\tls\\node.key"
  vars:
    xmip_node_key: >-
      {{ lookup('ansible.builtin.file', xmip_identity ~ '/node.key', rstrip=false)
      | ansible.builtin.register_secret }}
  when: xmip_identity | length > 0
  no_log: true
  diff: false
  notify: Restart the Xmip node

- name: The package, copied to the machine
  ansible.windows.win_copy:
    src: "{{ xmip_package }}"
    dest: "{{ xmip_staging }}\\xmip.msi"

- name: The package installed, which runs xmip-service --install
  ansible.windows.win_package:
    path: "{{ xmip_staging }}\\xmip.msi"
    arguments:
      - XMIP_NODE={{ xmip_node_name }}
      - XMIP_CLUSTER={{ xmip_cluster_name }}
      - XMIP_ACCOUNT={{ xmip_account }}
    creates_service: "xmip-{{ xmip_node_name }}"
    state: present

# The file is the node's alone to write: its account's and the
# administrators' (ADR-0031, amendment 2026-11-06, point 4), the starter
# too. The virtual account exists once the package has registered its
# service, so this follows the install.
- name: The node's configuration inheriting nothing
  ansible.windows.win_acl_inheritance:
    path: "{{ xmip_configuration }}\\node.xmip"
    state: absent
    reorganize: false

- name: The node's configuration writable by the node's account and the administrators alone
  ansible.windows.win_acl:
    path: "{{ xmip_configuration }}\\node.xmip"
    user: "{{ item.user }}"
    rights: "{{ item.rights }}"
    type: allow
  loop:
    - { user: SYSTEM, rights: FullControl }
    - { user: Administrators, rights: FullControl }
    - { user: "{{ xmip_account }}", rights: Modify }


- name: The ports the node's configuration listens on
  ansible.windows.win_command:
    argv:
      - "{{ xmip_program }}"
      - --configuration
      - "{{ xmip_configuration }}\\node.xmip"
      - --listening
  register: xmip_listening
  changed_when: false
  # Asked under --check too, so a check sees an opening that differs.
  failed_when: xmip_listening.rc != 0 and not ansible_check_mode
  check_mode: false

- name: An opening for each, named for the node
  ansible.windows.win_firewall_rule:
    name: "xmip-{{ xmip_node_name }}-{{ item | replace('/', '-') }}"
    localport: "{{ item.split('/')[0] }}"
    protocol: "{{ item.split('/')[1] }}"
    direction: in
    action: allow
    state: present
    enabled: true
  loop: "{{ xmip_listening.stdout_lines | map('split') | map('first') | list }}"

- name: No opening the node's configuration no longer listens on
  ansible.windows.win_powershell:
    script: |
      param([string] $Node, [string[]] $Wanted)
      $Ansible.Changed = $false
      foreach ($rule in Get-NetFirewallRule -Name "xmip-$Node-*" -ErrorAction SilentlyContinue) {
          if ($rule.Name -notin $Wanted) {
              Remove-NetFirewallRule -Name $rule.Name
              $Ansible.Changed = $true
          }
      }
    parameters:
      Node: "{{ xmip_node_name }}"
      Wanted: "{{ xmip_listening.stdout_lines | map('split') | map('first') | map('replace', '/', '-') | map('regex_replace', '^', 'xmip-' ~ xmip_node_name ~ '-') | list }}"

# Started with the machine; started now by started.yml, with every node of
# the environment together, since none accepts work before its Xmip Storage.
- name: The node's service started with the machine
  ansible.windows.win_service:
    name: "xmip-{{ xmip_node_name }}"
    start_mode: auto
