---
# One Xmip node on its own machine, Windows or AlmaLinux alike, in the same
# steps: its account, the cluster's xmip.toml, its certificate from the
# cluster's own authority, the estate's package (whose `xmip-service
# --install` lays the node out, slices it and registers and starts its
# service), its slice kept as `xmip-service --slice` prints it, a firewall
# opening for exactly the ports `xmip-service --listening` says its
# configuration listens on, and its service running. How each step is done
# on each system is windows.yml's and linux.yml's; every rule about the
# node is xmip-service's, which the role asks.

- name: Refuse a node, a cluster or a package left unnamed
  ansible.builtin.assert:
    that:
      - xmip_node_name | length > 0
      - xmip_cluster_name | length > 0
      - xmip_package | length > 0
    fail_msg: >-
      REFUSED: xmip_node_name, xmip_cluster_name and xmip_package name the
      node this host is, its cluster and the package it is installed from.

- name: The node on a Windows machine
  ansible.builtin.import_tasks: windows.yml
  when: ansible_os_family == 'Windows'

- name: The node on an AlmaLinux machine
  ansible.builtin.import_tasks: linux.yml
  when: ansible_os_family != 'Windows'
