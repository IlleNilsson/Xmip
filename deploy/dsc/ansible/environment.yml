---
# An Xmip environment on machines that are installed (README.md): the names
# of the cluster and its nodes on the DNS server first, then each node on
# its machine, Windows and AlmaLinux alike. Which node runs on which machine
# is the inventory's, never the cluster's xmip.toml (ADR-0028 and ADR-0015,
# amendments 2026-10-21).

- name: The cluster's and the nodes' names
  hosts: xmip_name_server
  gather_facts: false
  roles:
    - xmip_name

- name: The Xmip nodes
  hosts: xmip_nodes
  roles:
    - xmip_node
