  - { name: xmip-core-contract-protobuf, start: false }
  - { name: xmip-core-contract-wsdl, start: false }
  - { name: xmip-core-contract-openapi, start: false }
  - { name: xmip-core-contract-asyncapi, start: false }
  - { name: xmip-core-contract-sql, start: false }
  # Logic
  - { name: xmip-core-logic-http-api, start: true }
  - { name: xmip-core-logic-soap, start: false }
  - { name: xmip-core-logic-grpc, start: false }
  # Paths
  - { name: xmip-core-path-json-pointer, start: true }
