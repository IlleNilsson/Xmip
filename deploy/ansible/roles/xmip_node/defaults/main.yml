  - { name: xmip-core-transport-azure-blob, start: false }
  - { name: xmip-core-transport-google-cloud-storage, start: false }
  - { name: xmip-core-transport-mssql, start: false }
  - { name: xmip-core-transport-mysql, start: false }
  # Contracts
  - { name: xmip-core-contract-csv, start: true }
  - { name: xmip-core-contract-json-schema, start: true }
  - { name: xmip-core-contract-xml-schema, start: true }
  - { name: xmip-core-contract-regex, start: true }
