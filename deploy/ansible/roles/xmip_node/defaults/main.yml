---
xmip_install_root: /opt/xmip
xmip_node_name: local-xmip-node
xmip_cluster_name: local-xmip-cluster
xmip_persistence_engine: rocksdb
xmip_management_engine: sqlite
# ADR-0045: offline unless said. Set true per node that may reach out.
xmip_online: false

# The technologies this node loads, by repository name (ADR-0011), and whether
# each starts. One entry per module the estate has built, kept in step with
# architecture.toml maturity; a playbook overrides the list for a node that
# carries less. Started by default: the transports and contracts a plain HTTP
# and file node needs; the rest present but stopped until a Location names them.
xmip_modules:
  # Transports
  - { name: xmip-core-transport-file, start: true }
  - { name: xmip-core-transport-tcp, start: true }
  - { name: xmip-core-transport-udp, start: true }
  - { name: xmip-core-transport-http, start: true }
  - { name: xmip-core-transport-smtp, start: false }
  - { name: xmip-core-transport-websocket, start: false }
  - { name: xmip-core-transport-mllp, start: false }
  - { name: xmip-core-transport-modbus, start: false }
  - { name: xmip-core-transport-bacnet, start: false }
  - { name: xmip-core-transport-serial, start: false }
  - { name: xmip-core-transport-can-bus, start: false }
  - { name: xmip-core-transport-mqtt, start: false }
  - { name: xmip-core-transport-nats, start: false }
  - { name: xmip-core-transport-syslog, start: false }
  - { name: xmip-core-transport-coap, start: false }
  - { name: xmip-core-transport-ftp, start: false }
  - { name: xmip-core-transport-pop3, start: false }
  - { name: xmip-core-transport-redis-streams, start: false }
  - { name: xmip-core-transport-dns, start: false }
  - { name: xmip-core-transport-imap, start: false }
  - { name: xmip-core-transport-amqp, start: false }
  - { name: xmip-core-transport-iec-60870-5-104, start: false }
  - { name: xmip-core-transport-dnp3, start: false }
  - { name: xmip-core-transport-kafka, start: false }
  - { name: xmip-core-transport-cotp, start: false }
  - { name: xmip-core-transport-s7comm, start: false }
  - { name: xmip-core-transport-secs-gem, start: false }
  - { name: xmip-core-transport-snmp, start: false }
  - { name: xmip-core-transport-ssdp, start: false }
  - { name: xmip-core-transport-mdns, start: false }
  - { name: xmip-core-transport-dhcp, start: false }
  - { name: xmip-core-transport-webdav, start: false }
  - { name: xmip-core-transport-activemq, start: false }
  - { name: xmip-core-transport-rabbitmq, start: false }
  - { name: xmip-core-transport-nats-jetstream, start: false }
