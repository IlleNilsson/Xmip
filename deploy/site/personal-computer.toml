# A site: a node on a person's own computer, moving the files and mail that
# person handles and keeping an eye on itself (ADR-0015, amendment
# 2026-10-01). Build-XmipService -Site personal-computer turns it into a
# build; the node's TOML then picks, at run time, from what the build made
# possible.

description = "A person's computer: files and mail, one node of its own."

target = "computer"

# One machine, so it keeps Xmip Storage itself: only a node with the storage
# role stores (ADR-0056, amendment 2026-10-20).
roles = ["executing", "monitoring", "storage"]

# The technologies this deployment chose, by repository name (ADR-0015,
# amendment 2026-10-19). The `location` policy admits at each Location the
# node starts what its configuration says (ADR-0050 section 5): without a
# policy nothing is permitted, so a file dropped in is received and sent on
# only where the build links one. Every build verifies a drop folder's
# circumstance itself (the owner, 2026-10-19). SFTP fetches from and puts
# on a trading Party's server; the Playground's nodes on machines of their
# own reach its Parties' far end by it (ADR-0028, amendment 2026-10-22).
technologies = [
  "xmip-core-transport-file",
  "xmip-core-transport-sftp",
  "xmip-core-transport-smtp",
  "xmip-core-transport-imap",
  "xmip-core-authorize-location",
]
