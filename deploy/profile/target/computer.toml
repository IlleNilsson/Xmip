# The computer target: a person's own Windows or Mac machine, running a node
# of its own beside its user (ADR-0015, amendment 2026-10-01). A site names
# it; Build-XmipService turns the site into a build.

description = "A person's Windows or Mac computer, running one node of its own."

# The Rust target triples a build for this target is made for.
triples = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

# The root crate's features every build for this target carries: RocksDB,
# the runtime store's one engine (ADR-0015, amendment 2026-10-01: Xmip
# Storage, and RocksDB always the embedded runtime engine), which brings the
# platform's key store with it.
features = ["persist-rocksdb"]

# The technologies this target decides, not a domain: the embedded engines,
# RocksDB for the runtime database and SQLite for the administration
# database, and the key stores that seal them (DPAPI on Windows, the
# keychain on a Mac).
claims = [
  "xmip-core-persist-rocksdb",
  "xmip-core-persist-sqlite",
  "xmip-core-secret-dpapi",
  "xmip-core-secret-keychain",
]

# What this target cannot have, each feature with the reason; a role or a
# domain needing one is refused.
[refuses]
cluster = """\
  A person's computer sleeps, roams and is shut down by its user, so it runs \
  a node of its own and joins no cluster."""
