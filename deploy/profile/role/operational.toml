# The operational role: changes runtime state or an operational outcome:
# claims, checkpoints, retries, resumes, suspends (NodeRole::Operational,
# ADR-0056). The root crate's capability features a node in this role is
# built with; xmip-service's own (node, audit, observe) are its [[bin]]
# required-features and always on.

description = "Changes runtime state or an operational outcome."

features = [
  "archive",
  "cluster",
  "event",
  "persist",
  "resilience",
  "retain",
]

# The archive targets a node in this role is built with, by repository
# name: an archiving role names them and no domain selects one (ADR-0015,
# amendment 2026-10-14). Parquet is the default (owner, 2026-09-07).
archives = [
  "xmip-core-archive-azure-blob",
  "xmip-core-archive-file",
  "xmip-core-archive-gcs",
  "xmip-core-archive-mariadb",
  "xmip-core-archive-mssql",
  "xmip-core-archive-parquet",
  "xmip-core-archive-postgresql",
  "xmip-core-archive-s3",
  "xmip-core-archive-sql",
  "xmip-core-archive-sqlite",
]
