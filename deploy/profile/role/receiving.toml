# The receiving role: serves the receive stage, where a Receive Location
# starts (NodeRole::Receiving, ADR-0056). The root crate's capability
# features a node in this role is built with; xmip-service's own (node,
# audit, observe) are its [[bin]] required-features and always on.

description = "Serves the receive stage: a Receive Location starts here."

features = [
  "authenticate",
  "authorize",
  "contract",
  "identify",
  "party",
  "path",
  "persist",
  "prepare",
  "promote",
  "resilience",
  "retain",
]
