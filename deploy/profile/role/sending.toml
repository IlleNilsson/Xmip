# The sending role: serves the send stage, where a Send Port starts
# (NodeRole::Sending, ADR-0056). The root crate's capability features a
# node in this role is built with; xmip-service's own (node, audit,
# observe) are its [[bin]] required-features and always on.

description = "Serves the send stage: a Send Port starts here."

features = [
  "archive",
  "authenticate",
  "authorize",
  "contract",
  "demote",
  "identify",
  "party",
  "path",
  "persist",
  "prepare",
  "resilience",
]
