# The sending role: serves the send stage, where a Send Port starts
# (NodeRole::Sending, ADR-0056). The root crate's capability features a
# node in this role is built with; xmip-service's own (node, audit,
# observe) are its [[bin]] required-features and always on.

description = "Serves the send stage: a Send Port starts here."

features = [
  "archive",
  "authenticate",
  "authorize",
  "contract",
  "demote",
  "identify",
  "party",
  "path",
  "persist",
  "prepare",
  "resilience",
]

# The archive targets a node in this role is built with, by repository
# name: an archiving role names them (ADR-0015, amendment 2026-10-14). Parquet is the default (owner, 2026-09-07).
archives = [
  "xmip-core-archive-azure-blob",
  "xmip-core-archive-file",
  "xmip-core-archive-gcs",
  "xmip-core-archive-mariadb",
  "xmip-core-archive-mssql",
  "xmip-core-archive-parquet",
  "xmip-core-archive-postgresql",
  "xmip-core-archive-s3",
  "xmip-core-archive-sql",
  "xmip-core-archive-sqlite",
]
