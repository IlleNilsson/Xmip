sha256 = "0a73534e6ee50cdbb2a29ac48657ca0ad13cf0f424cf63808e4df7baeb87b8be"
executable = "package/lib/tsc.exe"

[archive.typescript.linux-x64]
url = "https://github.com/microsoft/typescript-go/releases/download/typescript/v7.0.2/typescript-linux-x64.tgz"
sha256 = "7ecad6f67377e831856367ab062ef394f21506a611405bf8ac0ff039348637d3"
executable = "package/lib/tsc"

[archive.typescript.linux-arm64]
url = "https://github.com/microsoft/typescript-go/releases/download/typescript/v7.0.2/typescript-linux-arm64.tgz"
sha256 = "c83d931ac9dd7549cde6e71246aa9d6a9812843023df3e277fe3b5dcf41dd0ea"
executable = "package/lib/tsc"

[archive.typescript.macos-x64]
url = "https://github.com/microsoft/typescript-go/releases/download/typescript/v7.0.2/typescript-darwin-x64.tgz"
sha256 = "eba158cb54050f723d5ff781438f33de5640054440bb4f2bd170cfe9bc2eb551"
executable = "package/lib/tsc"

[archive.typescript.macos-arm64]
url = "https://github.com/microsoft/typescript-go/releases/download/typescript/v7.0.2/typescript-darwin-arm64.tgz"
sha256 = "902e2fe1cf0799198ef902c6b8c310a450fef629a6baba41d45641ef75c04ebd"
executable = "package/lib/tsc"
