# Prerequisites for a machine that runs or builds Xmip.
#
# This file decides; Install-XmipPrerequisite applies it.
#
# ADR-0021: current platforms only. Every entry tracks the current stable
# release rather than pinning a version, which is why these declare a channel
# and a floor rather than a target. The floor states what would break; it does
# not freeze anything. Xmip integrates with ancient systems — see
# architecture/identity-by-technology.md, where the protocols go back to the
# 1970s — but it does not run on them.
#
# PowerShell runs on Windows, Linux and macOS, so a prerequisite is declared
# per operating system and per package manager. A key under an operating system
# is the manager, the value is what that manager calls the package. An absent
# operating system means the prerequisite does not apply there.
#
# Install-XmipPrerequisite.ps1 hard-codes exactly one thing, PSToml, because
# reading this file requires it.
#
# Roles are cumulative.

[role.operator]
description = "Runs Xmip and drives it from the command line."
include = []

[role.developer]
description = "Builds Xmip from source."
include = ["operator"]

[role.build]
description = "Produces release artifacts."
include = ["developer"]

# ---------------------------------------------------------------------------

[prerequisite.powershell]
role = "operator"
probe = "pwsh --version"
minimum = "7.6.7"
channel = "stable"
note = """
The one prerequisite Xmip cannot install for you, because the tooling is
written in it. Every entry point declares #requires -PSEdition Core and
-Version 7.6.7, so a machine below the floor is refused by PowerShell itself,
by name and version. If Install-XmipPrerequisite is running at all, this is already
satisfied, so it is reported rather than installed.

Windows PowerShell 5.1 and PowerShell 6 are not supported. ADR-0021.
"""

[prerequisite.powershell.windows]
winget = "Microsoft.PowerShell"

[prerequisite.powershell.macos]
brew = "powershell"

[prerequisite.git]
role = "operator"
probe = "git --version"
minimum = "2.40"

[prerequisite.git.windows]
winget = "Git.Git"

[prerequisite.git.macos]
brew = "git"

[prerequisite.git.linux]
apt = "git"
dnf = "git"
zypper = "git"
pacman = "git"

[prerequisite.pester]
role = "developer"
source = "psgallery"
id = "Pester"
channel = "stable"
minimum = "6.0"
note = """
Latest stable, no pinned version — the same rule as Rust. Pester 6 requires
PowerShell 7.4 or later, which the 7.6.7 floor above already guarantees.

The minimum is 6.0 rather than a specific build because Pester 6 changed how
discovery works: it now discovers and runs per file, where 5 discovered every
file first. That is invisible for isolated tests and is the sort of thing worth
stating a floor for.

Windows ships Pester 3 in the system module path and PowerShell autoloads the
first Pester it finds, so the old one wins unless told otherwise. Pester 3 has
no -Output parameter and does not understand BeforeAll or -Because, so test/
fails to run at all rather than reporting anything useful:

    Import-Module Pester -MinimumVersion 6.0.0 -Force

Installing needs -SkipPublisherCheck, because the Pester 3 already in the
module path carries a different Microsoft signature.

The tests use the classic Should -Be syntax. Pester 6 adds a Should-* family
(note the dash) and the old syntax still ships and still works, so both are
valid and can be mixed while migrating. When Xmip commits to the new style,
$config.Should.DisableV5 = $true makes the old syntax throw so it cannot be
used by accident.
"""

[prerequisite.pstoml]
role = "operator"
source = "psgallery"
id = "PSToml"
note = "Reads the Xmip TOML manifests. PowerShell has no built-in TOML parser. Operating system independent, so it carries no per-system table."

[prerequisite.poshgit]
role = "operator"
source = "psgallery"
id = "posh-git"
note = """
The prompt: the branch, how far ahead and behind, and what is changed, in
front of every command. Get-XmipStatus answers the same question for the whole
estate from `git status --porcelain=v2 --branch`, which carries the ahead and
behind counts itself. Operating system independent, so it carries no
per-system table.
"""

[prerequisite.rust]
role = "developer"
probe = "rustup --version"
channel = "stable"
component = ["rustfmt", "clippy"]
note = "Latest stable, no pinned version. rust-toolchain.toml at the repository root is what actually selects it, so rustup uses the same compiler for a developer machine and for CI. This entry installs rustup; the toolchain file chooses the toolchain. CI runs cargo fmt --check and clippy with -D warnings, so both components are required rather than optional."

[prerequisite.rust.windows]
winget = "Rustlang.Rustup"

[prerequisite.rust.macos]
brew = "rustup"

[prerequisite.rust.linux]
apt = "rustup"
dnf = "rustup"
fallback = "https://rustup.rs"
note = "Older distributions do not package rustup. The upstream installer pipes a script into a shell, which the script will print rather than run."

[prerequisite.linker]
role = "developer"
note = "Rust compiles but cannot link without a system toolchain, and the failure appears at the linker rather than the compiler, which reads as a Rust problem and is not one."

[prerequisite.linker.windows]
present_path = ['%ProgramFiles(x86)%\Microsoft Visual Studio\*\BuildTools\VC\Tools\MSVC\*\bin\Hostx64\x64\link.exe', '%ProgramFiles%\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\link.exe']
winget = "Microsoft.VisualStudio.BuildTools"
override = "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"
elevation = true
note = "BuildTools without the VCTools workload leaves no link.exe."

[prerequisite.linker.macos]
command = "xcode-select --install"

[prerequisite.linker.linux]
apt = "build-essential"
dnf = "gcc"
zypper = "gcc"
pacman = "base-devel"

[prerequisite.dotnet]
role = "developer"
optional = true
probe = "dotnet --version"
minimum = "11.0"
channel = "preview"
note = "For the Blazor surfaces in ADR-0014. Latest preview until .NET 11 reaches stable on 10 November 2026, latest stable from then on: set channel to stable and change the winget identifier to Microsoft.DotNet.SDK.11 on that date. On 2026-10-19 the preview channel is release candidate 2, SDK 11.0.100-rc.2.26504.105 of 2026-10-13, which every global.json names; winget's Microsoft.DotNet.SDK.Preview carries it."

[prerequisite.dotnet.windows]
winget = "Microsoft.DotNet.SDK.Preview"

[prerequisite.dotnet.macos]
brew = "dotnet-sdk"

[prerequisite.dotnet.linux]
fallback = "https://dot.net/v1/dotnet-install.sh"

[prerequisite.maui]
role = "developer"
optional = true
note = "The MAUI workloads for the desktop and phone GUI (ADR-0014, amendment 2026-10-14). Xmip.Operations builds for Android on every machine and for Windows on Windows, so a landing of xmip-core-gui needs both. A new .NET SDK band removes every workload: install them again after each SDK upgrade. iOS (maui-ios) builds only on macOS. On 2026-10-22 the SDK 11.0.100-rc.2 band's maui and maui-android are 11.0.0-rc.2.26505.5, until .NET 11 is generally available on 2026-11-10."

[prerequisite.maui.windows]
present_path = ['%ProgramFiles%\dotnet\packs\Microsoft.Android.Sdk.Windows\*', '%ProgramFiles%\dotnet\packs\Microsoft.Maui.Sdk*\*']
command = "dotnet workload install maui maui-android"
elevation = true

[prerequisite.maui.macos]
command = "dotnet workload install maui maui-android maui-ios"

[prerequisite.android-sdk]
role = "developer"
optional = true
note = "The Android SDK the phone build packages with, per user, no elevation: the platform and build-tools the maui-android workload targets, API 37 with the .NET 11 workloads (checked 2026-10-22). Its installer target expects a cmdline-tools directory and fails without one, so the command creates it first. ANDROID_HOME names it where it is elsewhere. Build-XmipService -Remote Android -Package apk needs it, with the NDK and the Android JDK."

[prerequisite.android-sdk.windows]
present_path = ['%ANDROID_HOME%\platforms\android-*', '%LOCALAPPDATA%\Android\Sdk\platforms\android-*']
command = "New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA\\Android\\Sdk\\cmdline-tools; dotnet build -t:InstallAndroidDependencies -f net11.0-android -p:AndroidSdkDirectory=$env:LOCALAPPDATA\\Android\\Sdk -p:AcceptAndroidSDKLicenses=True module/core/operation/gui/src/Xmip.Operations"

[prerequisite.android-ndk]
role = "developer"
optional = true
note = "The Android NDK, whose clang links the Rust runtime library for Android (aarch64-linux-android, x86_64-linux-android; rustup target add both). Unpacked under the SDK's ndk directory, named by its version; latest LTS from Google, checked against the SHA-1 Google publishes."

[prerequisite.android-ndk.windows]
present_path = ['%ANDROID_HOME%\ndk\*\toolchains\llvm\prebuilt\windows-x86_64', '%LOCALAPPDATA%\Android\Sdk\ndk\*\toolchains\llvm\prebuilt\windows-x86_64']
fallback = "https://developer.android.com/ndk/downloads"
note = "The latest LTS is r30, 30.0.16248370 (checked 2026-10-22 on developer.android.com/ndk/downloads)."

[prerequisite.android-jdk]
role = "developer"
optional = true
note = "The Java Development Kit the .NET for Android build runs its tools with: Microsoft's OpenJDK 21, the one Microsoft tests .NET for Android against (checked 2026-10-22 on learn.microsoft.com/dotnet/android/getting-started/installation/dependencies). Only the phone's APK needs it; it is not the Java event binding's JDK 27 (prerequisite.java). JAVA_HOME names it. Nothing in the phone build uses Node.js."

[prerequisite.android-jdk.windows]
present_path = ['%ProgramFiles%\Microsoft\jdk-21*\bin\java.exe']
winget = "Microsoft.OpenJDK.21"
elevation = true

[prerequisite.typos]
role = "developer"
probe = "typos --version"
minimum = "1.51"
channel = "stable"
note = """
The spelling check (crate-ci/typos, written in Rust; 1.51.1 the current
release on 2026-10-06). test/Spelling.Test.ps1 runs it over the estate and a
landing over each module it tests, with the root's _typos.toml; a machine
without it fails both, by this name. Linux distributions other than Arch
build it with cargo, which the rust entry above already brings.
"""

[prerequisite.typos.windows]
winget = "Crate-CI.Typos"

[prerequisite.typos.macos]
brew = "typos-cli"

[prerequisite.typos.linux]
pacman = "typos"
fallback = "cargo install typos-cli --locked"

# ---------------------------------------------------------------------------
# Desired state, for test level 2 alone: the environment templates under
# deploy/dsc put a cluster's nodes on machines of their own (ADR-0015,
# amendment 2026-10-21). Neither is needed to build, test or land Xmip, and
# an environment uses one of the two, never both; both cover Windows and
# Linux alike (the owner, 2026-10-21: "dotnet is cross platform, so is
# Blazor, MAUI and DSC. We keep Ansible and other tech for familiarity and
# support for the project.").

[prerequisite.dsc]
role = "operator"
optional = true
probe = "dsc --version"
minimum = "3.2"
channel = "stable"
note = "Microsoft DSC v3, the standalone dsc command (3.3.0 the current release on 2026-10-21; 3.2.0 generally available 2026-04-29). The host that runs deploy/dsc/msdsc and every machine an environment document is applied on need it, with PowerShell 7.6, which the Xmip resources run in."

[prerequisite.dsc.windows]
winget = "Microsoft.DSC"

[prerequisite.dsc.linux]
dnf = "dsc"
note = "From Microsoft's package repository, packages.microsoft.com, where DSC 3.3 publishes its Linux packages."

[prerequisite.ansible]
role = "operator"
optional = true
probe = "ansible --version"
minimum = "2.21"
channel = "stable"
note = "ansible-core (2.21.5 the current release on 2026-10-05), the controller of deploy/dsc/ansible; 2.21 is the first to run Windows modules in PowerShell 7. A distribution's own package may be older, so it is installed with Python's pip into a folder of its own, with pywinrm for the Windows machines; Python is Ansible's, never Xmip's."

[prerequisite.ansible.linux]
command = "python3 -m venv ~/.local/share/xmip-ansible && ~/.local/share/xmip-ansible/bin/pip install ansible-core pywinrm && ~/.local/share/xmip-ansible/bin/ansible-galaxy collection install ansible.windows ansible.posix"

[prerequisite.ansible.macos]
command = "python3 -m venv ~/.local/share/xmip-ansible && ~/.local/share/xmip-ansible/bin/pip install ansible-core pywinrm && ~/.local/share/xmip-ansible/bin/ansible-galaxy collection install ansible.windows ansible.posix"

# ---------------------------------------------------------------------------
# Event binding languages. ADR-0065: a program at the perimeter subscribes to
# Events from C, C++, Java or Python through the bindings in xmip-core-abi; it
# is its own process, and no such runtime is loaded into an Xmip process
# (ADR-0018, amendment 2026-10-05). Each language below is the toolchain
# xmip-core-abi's verify-event-bindings.ps1 builds and tests its binding with.
#
# Every one is optional, and stays so. The owner, 2026-10-20: "Xmip is able
# to use Java, but it is not in the core", and "every language except Rust is
# optional" for Xmip itself. A toolchain is needed only to build and test
# what uses it: the landing (Test-XmipEventBinding) and the script verify a
# binding where its tool is here at its floor, and say of one whose tool is
# not "SKIPPED: Java not installed; the Java Event binding is not verified",
# failing nothing in the core for it. .NET and PowerShell are another matter:
# the operator surfaces and the estate's tooling are built on them.

[prerequisite.c]
role = "developer"
optional = true
probe = "zig version"
note = "One compiler for C and C++ on every platform: zig cc and zig c++ are clang with the platform libc bundled, so the C and C++ event bindings build the same way on Windows, macOS and Linux with no Visual Studio, Xcode or gcc dependency. Chosen 2026-09-07 over a per-platform compiler because the build has to be one line in a script."

[prerequisite.c.windows]
winget = "zig.zig"

[prerequisite.c.macos]
brew = "zig"

[prerequisite.c.linux]
apt = "zig"
dnf = "zig"
pacman = "zig"
fallback = "https://ziglang.org/download/"

[prerequisite.java]
role = "developer"
optional = true
probe = "javac -version"
minimum = "27"
channel = "stable"
note = "For the Java event binding in xmip-core-abi: the foreign function and memory API, final since Java 22, compiled with javac --release 27. A perimeter program in its own process (ADR-0065). JDK 27 is the current release (2026-09-15); JDK 25 is the current long-term support release."

[prerequisite.java.windows]
winget = "Amazon.Corretto.27.JDK"
elevation = true
note = "A machine-scope MSI; winget offers no per-user installer, so the install prompts for elevation. Microsoft builds OpenJDK only for long-term support releases (Microsoft.OpenJDK.25), so JDK 27 comes from Amazon Corretto."

[prerequisite.java.macos]
brew = "openjdk"

[prerequisite.java.linux]
apt = "openjdk-27-jdk"
dnf = "java-latest-openjdk-devel"
pacman = "jdk-openjdk"

[prerequisite.python]
role = "developer"
optional = true
probe = "python --version"
minimum = "3.15"
channel = "stable"
note = "For the Python event binding in xmip-core-abi: ctypes over the runtime library, tested with python -m unittest. A perimeter program in its own process (ADR-0065). Python 3.15.0 is the current release (2026-10-09)."

[prerequisite.python.windows]
command = "winget install --id Python.PythonInstallManager --exact; py install 3.15"
note = "Python 3.15 is installed on Windows through the Python install manager, per user; winget carries no Python.Python.3.15."

[prerequisite.python.macos]
brew = "python@3.15"

[prerequisite.python.linux]
apt = "python3"
dnf = "python3"
pacman = "python"

[prerequisite.libudev]
role = "developer"
probe = "pkg-config --exists libudev"
note = """
Linux only, and only to build three transports: serial, m-bus and
wireless-m-bus. Each reaches a serial port through serialport, which reaches
udev through libudev-sys, which is a build script over the system library —
so a machine without libudev's development files does not fail at run time,
it fails to compile, in a C build script, with pkg-config's own message.

Found on 2026-09-19 by building the estate on a clean AlmaLinux box: 242 of
246 crates passed and these three could not build at all. The estate calls
itself cross-platform, so a Linux developer meeting that on their third
transport should meet it here instead.

Windows and macOS reach a serial port without udev and declare nothing.
"""

[prerequisite.libudev.linux]
apt = "libudev-dev"
dnf = "systemd-devel"
zypper = "systemd-devel"
pacman = "systemd-libs"

[prerequisite.libclang]
role = "developer"
probe = "clang --version"
note = """
For the runtime store, xmip-core-persist-rocksdb (ADR-0015, amendment
2026-09-25). RocksDB is C++: its crate compiles it with the platform's C++
compiler and binds it through bindgen, which loads libclang while it builds.
A machine without libclang does not fail at run time, it fails to compile, in
librocksdb-sys's build script, with "Unable to find libclang". bindgen finds
it on the path, in LLVM's default install directory, or where LIBCLANG_PATH
points.

The C++ compiler itself is the linker entry above on Windows (the VCTools
workload is C and C++) and on macOS (the command line tools); Linux names it
in cxx below. The first Windows build of RocksDB takes some twenty minutes;
later builds reuse it.

A device build that leaves the runtime store out needs neither (ADR-0015:
each engine is a technology under persist).
"""

[prerequisite.libclang.windows]
present_path = ['%LIBCLANG_PATH%\libclang.dll', '%ProgramFiles%\LLVM\bin\libclang.dll']
winget = "LLVM.LLVM"
elevation = true
note = "A machine-scope installer; winget offers no per-user one, so the install prompts for elevation. It puts clang and libclang.dll in C:\\Program Files\\LLVM\\bin, where bindgen looks first."

[prerequisite.libclang.macos]
brew = "llvm"

[prerequisite.libclang.linux]
apt = "libclang-dev"
dnf = "clang-devel"
zypper = "clang-devel"
pacman = "clang"

[prerequisite.cxx]
role = "developer"
probe = "c++ --version"
note = "Linux only: the C++ compiler RocksDB's crate builds with (libclang above). The linker entry installs gcc, which compiles C and not C++; build-essential and base-devel already carry g++, so apt and pacman repeat them only to say so. Found on 2026-09-25 building the runtime store on the AlmaLinux guest, which had gcc and no g++."

[prerequisite.cxx.linux]
apt = "build-essential"
dnf = "gcc-c++"
zypper = "gcc-c++"
pacman = "base-devel"

[prerequisite.nfpm]
role = "build"
probe = "nfpm --version"
note = """
Linux only: builds the .deb and the .rpm from deploy/package/linux/nfpm.yaml
(ADR-0015, amendment 2026-10-13), 2.48 the current release on 2026-10-13.
Not used yet: builds are Windows-only for now, so no Linux package has been
built. The Windows MSI needs nothing here beyond the .NET SDK above: dotnet
build fetches WiX Toolset 7 from NuGet, and WiX 7 builds only once its Open
Source Maintenance Fee EULA is accepted on the machine, the owner's decision.
"""

[prerequisite.nfpm.linux]
fallback = "https://nfpm.goreleaser.com/docs/install/"

# ---------------------------------------------------------------------------

# Not a package: the event source the operating system's log is written under
# on Windows when audit cannot persist a record (ADR-0062 clause 3). Its name
# is declared once, as XMIP_EVENT_SOURCE in the ABI's xmip_operate.h, and
# Install-XmipPrerequisite reads it there, as xmip-core-audit and
# Xmip.Surface do through their bindings.
[eventSource]
role = "operator"
log = "Application"
note = """
Registering an event source needs elevation once, and Install-XmipPrerequisite
never elevates: run elevated with -Install and it registers the source,
otherwise it prints the line to run. Until then, every entry the fallback
writes goes under the Application log's .NET Runtime source and says so in its
first sentence. Linux and macOS need nothing: the journal, syslog and the
unified log take an entry from any program.
"""

# ---------------------------------------------------------------------------

# Not a package: a release archive, fetched, verified by its SHA-256 and
# unpacked under .local-work/tool/<name>/<version> by Install-XmipPrerequisite
# -Install -IncludeOptional, with no package manager and no Node.js
# (Install-XmipArchive.ps1). One table per operating system and architecture,
# as the release names its assets; `executable` is the program inside.
[archive.typescript]
role = "developer"
optional = true
version = "7.0.2"
note = """
TypeScript's native compiler, the Go port, stable since 2026-07-08: tsc, a
single program with the standard library's declarations beside it, as
microsoft/typescript-go releases it for each platform
(https://github.com/microsoft/typescript-go/releases/tag/typescript/v7.0.2).
Build-XmipService -Extension VsCode compiles the VS Code extension's shell
with it and packages the VSIX; Node.js is never needed on a developer's
machine (the owner, 2026-10-22; ADR-0014, amendment 2026-10-22). The shell's
lint and tests run in its CI alone.
"""

[archive.typescript.windows-x64]
url = "https://github.com/microsoft/typescript-go/releases/download/typescript/v7.0.2/typescript-win32-x64.tgz"
sha256 = "61fc4e141d2bc687db580e71bbfa63b9c209f0310645d82ca1b457eb3a24fd19"
executable = "package/lib/tsc.exe"

[archive.typescript.windows-arm64]
