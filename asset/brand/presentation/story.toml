[[section]]
title = "Xmip"
headline = "Cross OS Messaging & Integration Platform"
screen = "Accountable messaging and integration, under your control.\nOpen source. Xmip is said “Smip”."
voice = "female"
power = "both"
narration = "Welcome to Xmip. Xmip stands for Cross OS Messaging & Integration Platform. It connects the systems an organization runs, and it keeps an account of every message it takes on. It is open source, and it runs on your own machines, with or without the internet. Let us follow one order through it, then see how it is configured, run, operated and extended."
sources = ["README.md", "CONTRIBUTING.md"]
note = ""
layout = ["cover"]
alt = "The Xmip logo, and the two hosts, female on the left and male on the right, welcoming the viewer."

[[section]]
title = "Who it is for"
headline = "Four people, four answers"
screen = "Each asks a different question. Xmip answers all four."
voice = "male"
power = false
narration = "Xmip answers four people. The CEO asks whether the business keeps moving when an exchange fails. The CIO asks who controls it and where it runs. The developer asks how an integration is built, and the operator asks what went wrong and what to do now. Each answer follows."
sources = ["README.md"]
note = ""
layout = ["scene", "four"]
alt = "Four cards. CEO: does the business keep moving when an exchange fails? Every accepted message is kept, and every outcome is recorded. CIO: who controls it, and where does it run? On your machines, offline first, open source. Developer: how do I build an integration? Readable TOML, a designer in VS Code, modules in many languages. Operator: what went wrong, and what do I do now? Health in words, the evidence, retry and replay."

[[section]]
title = "One order through Xmip"
headline = "Example: one order to completion"
screen = "Payment agreed. Factory production or warehouse stock. One Instance follows every part until the order is complete."
voice = "female"
power = false
narration = "Here is an example of one order, followed to completion. It illustrates a business flow you can build with Xmip; the exact steps and deadline are this example's choices. A client's order arrives at a Receive Location, where Xmip takes messages in, and a Subscription, a filter on what a message holds, starts a Work Process Instance, one run of the flow, for this order alone. The Instance notes the order and keeps values of its own: the lines ordered, delivered and accepted. Every later message about the order carries its number, and a Correlation on that number brings each one to the same Instance. After payment is received, or a promise to pay is accepted, the order goes to a factory for production or is fulfilled from warehouse stock. Production updates, shipment notices and delivery confirmations all return to the same Instance. Goods may ship in parts: as finished goods leave the factory or the warehouse ships, the transporter delivers and the client answers, each part is counted, and a refused or returned part comes off the count, to be delivered again or credited. Until every line is accepted, the Instance waits again; then it confirms the order to the ERP, the business system that takes orders, and completes. If thirty days pass first, it fails as overdue. Operators see each Work Process's newest Instances, what each waits for and its values, and can dismiss a failed one or retry it once its cause is fixed."
sources = ["doc/terminology.md", "doc/architecture/runtime-model.md", "doc/decision/ADR-0066-routes-are-configured-transforms-and-processes-are-compiled.md", "module/core/capability/process/doc/process-instances.md"]
note = "Illustrative business flow, not a fixed Xmip process. The tests demonstrate order-in-parts tracking; this example adds payment and factory or warehouse fulfillment."
layout = ["scene", "order"]
alt = "Example order 4711. The client orders three lines; payment is received or a promise to pay accepted. Fulfillment branches: the factory produces goods, or the warehouse supplies stock. Parts ship, the transporter confirms delivery and the client accepts, refuses or returns them. Every update carries the order number to one Work Process Instance. Its values track Ordered 3, Delivered 2 and Accepted 2. Until all lines are accepted it waits again. All accepted leads to confirmation to ERP; thirty days leads to overdue failure. Operators inspect the Instance and its values. The business steps and deadline are illustrative choices."

[[section]]
title = "Acceptance and recovery"
headline = "Accepted once, never lost"
screen = "Before acceptance the sender owns it. After, Xmip keeps it and records every step."
voice = "male"
power = false
narration = "Acceptance is where responsibility changes hands. Before it, the stream, the raw bytes that arrive, belongs to its sender, and a refusal says where and why. Once Xmip accepts it, it becomes a message, written to storage before anything acts on it. Each delivery to a destination is a journey, and every journey ends Completed, Failed, or Dismissed by an operator; a failed delivery is retried. A message nothing wanted waits in the Dead Message Queue until its routing is fixed and it is replayed. Every step is audited."
sources = ["README.md", "doc/terminology.md", "doc/decision/ADR-0013-journey-model.md"]
note = ""
layout = ["scene", "accept"]
alt = "A dashed lime line marks acceptance. On the sender's side, a Stream arrives and is audited before anything else; a refused one says where and why and stays the sender's. On Xmip's side, a Message is written to storage before anything acts on it; every Journey ends Completed, Failed or Dismissed; a Message nothing wanted goes to the Dead Message Queue, to be replayed once its Subscription is fixed. An audit lane runs under every step."

[[section]]
title = "Configuration you can read"
headline = "Configuration you can read and review"
screen = "One TOML file, plain readable text, describes the cluster: its nodes, its routes, and what each piece of work requires."
voice = "male"
power = true
narration = "An integration in Xmip is text you can read. One TOML file, a plain-text configuration format, describes the cluster: its nodes, its routes, and what each piece of work requires. Teams version it, compare it and review it like code. Every save is validated, then sliced into each node's own part."
sources = ["CONTRIBUTING.md", "doc/terminology.md", "test/core/system-test/configuration/Xmip-reference-environment.xmip"]
note = ""
layout = ["scene", "toml"]
alt = "An excerpt of the Reference Environment, Xmip-reference-environment.xmip: the node EX1 declares the role processing and the Node capability order-approval-module; the Work Process Order approval requires order-approval-module; the Subscription Approved sales orders has the Send Port Sales orders to ERP as its destination. and its filter ends Approval = 'approved'. Below: EX1 is only this node's name in the file; Xmip reads its roles and capabilities, never its name."
accessibility_notes = "The male host gently flexes their arms to emphasize configuration you can read in TOML."

[[section]]
title = "Designing in VS Code"
headline = "Draw it in VS Code, keep it as text"
screen = "The designer and the file are one. Xmip's rules live in its language server, which any LSP editor can use."
voice = "female"
power = true
narration = "VS Code is where an integration is drawn. The designer draws the same cluster file the text holds, so a change in one is a change in the other. Completion, validation and renaming that follows every reference come from Xmip's own language server. It speaks the standard Language Server Protocol, so other editors can use Xmip's rules through their own LSP clients."
sources = ["doc/decision/ADR-0064-developers-design-in-vs-code.md"]
note = ""
layout = ["scene", "designer"]
alt = "A screenshot of the VS Code designer drawing the route Order to cash from the System Tests' cluster file: four Receive Locations on the left, the Subscriptions with their filters in the middle, the Work Process Order approval, and the Send Ports on the right, joined by the lines the designer draws. The list of what the file holds runs down the left edge."
accessibility_notes = "The female host gently flexes their arms to emphasize designing in VS Code."

[[section]]
title = "Roles and Node capabilities"
headline = "Configuration places work, never a name"
screen = "Nodes declare what they have. Work says what it requires. Xmip matches the two."
voice = "female"
power = false
narration = "Where work runs is configuration, never a node's name. Here are three receiving nodes, a processing node, an executing node that receives, processes and sends at low latency, and three sending nodes. Each declares its roles, and its Node capabilities: words for what its environment gives it, such as a firewall opening or an installed module. Work that requires nothing goes to any node with the role; work that names what it requires goes only to a node that has it. One node with every role works; more nodes are split out as security, firewalls and load need."
sources = ["doc/terminology.md", "doc/decision/ADR-0056-a-node-declares-what-it-can-do.md", "test/core/system-test/configuration/Xmip-reference-environment.xmip"]
note = ""
layout = ["scene", "place"]
alt = "Left, five pieces of work: Receive Locations that require nothing; a Work Process that requires order-approval-module; Receive Locations that require firewall-party-d or firewall-party-e; the Send Port Remittances to ERP, which requires erp-direct; Send Ports that require nothing. Right, the nodes, each led by its role with its name in the file beside it: receiving nodes, RX1 to RX3; a processing node, EX1, declaring order-approval-module; an executing node, EX2, declaring firewall-party-d, firewall-party-e and erp-direct; sending nodes, TX1 to TX3. Gray lines place the work requiring nothing by role alone, the Receive Locations on the receiving nodes and the Send Ports on the sending nodes, and both on the executing node, which serves every stage; lime lines place each piece of work that requires something on the node that declares it. A key below says gray is by role, lime by role and what it requires."

[[section]]
title = "Xmip Storage"
headline = "Work belongs to the cluster, not a node"
screen = "Every node reaches Xmip Storage. When a node dies, another picks its work up."
voice = "male"
power = false
narration = "The work belongs to the cluster, not to a node. Every node reaches Xmip Storage for all storage, and its Ledger holds every stream, message and journey until it is done. Nodes work by time-limited claims, so when one dies, another picks its work up. A primary Storage node has standbys that follow every write. Stopped in order, it hands its writes over, and a standby takes over at once. One that vanishes is waited for, never guessed about."
sources = ["doc/terminology.md", "doc/decision/ADR-0056-a-node-declares-what-it-can-do.md", "doc/architecture/deployment-model.md"]
note = ""
layout = ["scene", "storage"]
alt = "A receiving, a processing and a sending node each reach Xmip Storage by time-limited claims. Inside Xmip Storage, a primary holding the Ledger, administration and audit hands every write to a standby that follows it. Below, two cases: stopped in order, the primary hands its writes over and the standby takes over at once; vanished, it is waited for, never guessed, so there is no second primary."

[[section]]
title = "One plan, four ways"
headline = "One plan, four ways to run it"
screen = "The same cluster file everywhere. Each way has its own safety and security trade-offs: Xmip advises, you choose."
voice = "female"
power = "both-power"
narration = "One plan runs four ways: as local processes, in containers, on virtual machines, and on physical machines. Virtual machines run on Hyper-V, on KVM with libvirt, or on VMware. The cluster file stays the same; which node runs where belongs to the environment. The System Tests prove the flow as processes on one computer, and the Systems Tests prove it on virtual machines, Windows and Linux. Each way has its own safety and security trade-offs: Xmip advises, and you choose."
sources = ["doc/decision/ADR-0015-packaging.md", "doc/decision/ADR-0028-the-xmip-system-test.md", "deploy/dsc/README.md", "doc/terminology.md"]
note = ""
layout = ["scene", "ways"]
alt = "Four numbered tiles. Local processes, a process per node on one computer: the System Tests. Containers, wherever yours live. Virtual machines on Hyper-V, KVM with libvirt or VMware: the Systems Tests. Physical machines, a machine per node or one for all: your site."
accessibility_notes = "The female host on the left and the male host on the right gently flex their arms to emphasize working across operating systems."

[[section]]
title = "Offline by design"
headline = "No internet needed to install or run"
screen = "Packages are built where the internet is. Install, operate and run with none."
voice = "male"
power = false
narration = "Xmip is offline by design. Packages are built where the internet is reachable, then brought in, and installation, operation and the runtime need no internet at all. Nothing at runtime checks a license or downloads a module. A node that may reach out says so with the Node capability online; a node without it is offline. The networked option is there when you choose it."
sources = ["doc/decision/ADR-0045-offline-is-the-default.md", "doc/decision/ADR-0056-a-node-declares-what-it-can-do.md"]
note = ""
layout = ["scene", "offline"]
alt = "Three steps. One, prepare: where the internet is reachable, build the package. Two, bring it in: the package carries everything an installation needs. Three, install and run: no internet, nothing fetched. Below, the line capabilities equals online: only a node that declares the Node capability online may reach out; a node without it is offline."

[[section]]
title = "Operating Xmip"
headline = "Every surface gives the same answer"
screen = "The xmip command line, PowerShell, web, desktop and phone read one operator model; MCP clients come through the command line."
voice = "female"
power = true
narration = "Operators choose their surface: the xmip command line, PowerShell, the web view, the desktop or the phone. Each reads one shared operator model, so they cannot disagree, and an MCP client, the Model Context Protocol that AI assistants speak, reads Xmip through the command line. Health is said in words: Fine, Paused, Working, Stressed, Exhausted or Done. A group is Holding when something inside it needs attention, and it shows that item and its evidence."
sources = ["doc/decision/ADR-0014-operator-surfaces.md", "doc/decision/ADR-0052-the-operator-surfaces-share-one-model.md", "doc/decision/ADR-0041-health-is-a-mood-and-does-not-propagate.md", "doc/decision/ADR-0071-xmip-is-reached-over-mcp-through-the-command-line.md"]
note = ""
layout = ["scene", "operate"]
alt = "A screenshot of the web view's Monitor following the System Tests' cluster C1: the cluster Fine, the receive, Work Process and send stages at 16 each, and the nodes listed beneath. Over its lower right corner, the desktop app, Xmip Operations, shows the same cluster Fine."
accessibility_notes = "The female host gently flexes their arms to emphasize operations from any surface, the phone among them."

[[section]]
title = "Reports and Quests"
headline = "Reports present, Quests probe"
screen = "Every Report is in one list. A Quest finds evidence and gaps; it never says compliant."
voice = "male"
power = false
narration = "A Report presents data Xmip already keeps, such as the Audit and the Dead Messages. A Quest probes an installation first, and its Report presents what it found. The first is the Regulation Quest, its regulation a parameter, GDPR, Europe's data protection regulation, first: for each requirement, the evidence or the gap, and the action that closes it. It never says compliant; that judgment stays yours. The Firewall, Security, Resilience and Dependency Reports sit in the same list, eleven in all, on every surface."
sources = ["module/core/operation/report/doc/reports.md", "doc/decision/ADR-0072-a-quest-probes-and-the-regulation-is-a-parameter.md", "doc/terminology.md"]
note = ""
layout = ["scene", "reports"]
alt = "The Reports list, each with its kind. Audit and Dead Messages are Reports. Regulation with GDPR, Firewall, Security, Resilience and Dependency are probing reports. A document icon marks a Report; a magnifier marks a probing report. Below: seven of the eleven Reports, one list on every surface; a magnifier marks one a Quest probes first."

[[section]]
title = "Extending Xmip"
headline = "Extend it in the language you know"
screen = "Your Work Processes, Transformations and other units cross one C ABI. The Xmip Designer generates Rust."
voice = "male"
power = false
narration = "Xmip is extended through one boundary, its C ABI, the binary interface every language can call. Your Work Processes, Transformations, Prepare steps and other units are libraries a node opens: write them in Rust, in C# with Xmip's Module package, in C or C++ against the C header, or in any language that exports a C function, and the node cannot tell one from another. The Xmip Designer generates Rust from a design. Events, Xmip's notices of what happened, cross the same boundary, bound for C, C++, Java, Python and C#. Code on another machine reaches Xmip over its HTTP/2 API, inside Xmip's mutual TLS."
sources = ["module/foundation/abi/README.md", "doc/decision/ADR-0075-packages-for-developers.md", "doc/decision/ADR-0061-a-provider-builds-against-the-sdk.md", "doc/decision/ADR-0065-events-are-subscribed-from-any-language.md"]
note = ""
layout = ["scene", "extend"]
alt = "Your units, in four kinds of language, each reaching a node through one C ABI: Rust, by hand or by the Xmip Designer; C#, with Xmip.Module; C and C++, with the C header xmip_module.h; any language that exports a C function. Below: Events are bound for C, C++, Java, Python and C# through the same ABI."

[[section]]
title = "Open source"
headline = "Open source, with its reasons on record"
screen = "Xmip's core is written in Rust. It is AGPL-3.0-or-later; the module boundary is Apache-2.0."
voice = "female"
power = true
narration = "Xmip's core is written in Rust, and Xmip is open source. Xmip itself is under the GNU Affero General Public License, version three or later, and it cannot be relicensed or withdrawn. Its module boundary, the headers, bindings and packages a module is built against, is under the Apache License, so the module you write stays yours. Every architectural decision is a record with its reasons, seventy-five so far, and tests hold the rules on every change."
sources = ["CONTRIBUTING.md", "README.md", "doc/decision/ADR-0023-licensing-model.md", "doc/decision/ADR-0061-a-provider-builds-against-the-sdk.md", "doc/decision/ADR-0028-the-xmip-system-test.md"]
note = "Xmip AGPL-3.0-or-later; the module boundary Apache-2.0 (decided 2026-11-24)"
layout = ["scene", "open"]
alt = "Four cards. AGPL: Xmip itself, version 3 or later; it cannot be relicensed or withdrawn. Apache-2.0: the module boundary, the headers, bindings and packages a module builds against, so your module stays yours. 75: decision records, each with its reasons. Tests three ways: internal tests, the System Tests on one computer, the Systems Tests on machines."
accessibility_notes = "The female host gently flexes their arms to emphasize open-source freedom."

[[section]]
title = "Measured"
headline = "Measured, not promised"
screen = "More than a millisecond beyond the load is a defect to find, not a timeout to raise."
voice = "male"
power = false
narration = "Xmip is measured, not promised. Its rule: anything it does around a message that takes more than a millisecond, beyond the load it carries, is a defect to find. Carrying a file in and out on one node, Xmip's own work measured 430 microseconds at the median of twenty runs, with the storage device's own sync time counted apart. And seventy transports run in a node today, of the eighty-eight declared, each proven sending a file to its far end, nine of them on Linux alone."
sources = ["CONTRIBUTING.md", "doc/decision/ADR-0018-service-and-host.md", "doc/decision/ADR-0015-packaging.md", "README.md"]
note = "Timings on a quiet machine, 2026-11-09; transports as of 2026-11-25"
layout = ["scene", "measured"]
alt = "Three figures. 430 microseconds: Xmip's own work per file, file in to file out on one node, the median of twenty runs on a quiet machine, 2026-11-09. 2.4 milliseconds: the storage device's own sync time for that same file, counted apart. 70 of 88: transports a node runs today, each proven sending a file to its far end, nine of them on Linux alone. Recorded in the decision records and the README."

