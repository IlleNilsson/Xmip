text = "The Xmip Designer generates Rust from a visual design."
start = 28.1971164
duration = 3.5937501

[[scene.caption]]
text = "Events are notifications about what happened in Xmip."
start = 31.7908665
duration = 3.6298078

[[scene.caption]]
text = "They use the same interface, with bindings for C, C++, Java, Python, and C#."
start = 35.4206743
duration = 5.9254809

[[scene.caption]]
text = "Remote clients connect through the HTTP/2 API."
start = 41.3461553
duration = 4.0144232

[[scene.caption]]
text = "An API is the programming interface a client uses to call the platform."
start = 45.3605785
duration = 4.5322117

[[scene.caption]]
text = "The connection uses mutual TLS: both sides prove their identity, and the traffic is encrypted."
start = 49.8927902
duration = 6.477404

