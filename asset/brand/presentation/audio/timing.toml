[[scene.caption]]
text = "Here is an example: one order, followed through to completion."
start = 0.05
duration = 4.125

[[scene.caption]]
text = "These business steps and the thirty-day deadline are choices for this scenario."
start = 4.175
duration = 4.4125

[[scene.caption]]
text = "The order arrives at a Receive Location, the endpoint where Xmip receives incoming data."
start = 8.5875
duration = 5.4375

[[scene.caption]]
text = "A Subscription checks the message against a filter and selects its destination."
start = 14.025
duration = 4.875

[[scene.caption]]
text = "In this example, it starts a Work Process Instance: one execution of the business flow, dedicated to this order."
start = 18.9
duration = 7.7125

[[scene.caption]]
text = "The Instance tracks the lines ordered, delivered, and accepted."
start = 26.6125
duration = 3.8625

[[scene.caption]]
text = "Every update carries the order number."
start = 30.475
duration = 2.575

[[scene.caption]]
text = "Correlation uses that shared identifier to bring each update back to the same Instance."
start = 33.05
duration = 5.475

[[scene.caption]]
text = "Once payment is received, or a promise to pay is accepted, fulfillment can begin."
start = 38.525
duration = 5.3375

[[scene.caption]]
text = "A factory produces the goods, or a warehouse supplies them from stock."
start = 43.8625
duration = 4.7625

[[scene.caption]]
text = "Production updates and shipment notices come back to the same order."
start = 48.625
duration = 4.1625

[[scene.caption]]
text = "Goods can ship in parts."
start = 52.7875
duration = 1.8125

[[scene.caption]]
text = "The transporter confirms delivery, and the customer accepts, refuses, or returns each part."
start = 54.6
duration = 6.3

[[scene.caption]]
text = "The Instance updates its counts."
start = 60.9
duration = 2.3875

[[scene.caption]]
text = "A refused or returned part must be delivered again or credited."
start = 63.2875
duration = 3.9875

[[scene.caption]]
text = "It waits until every line is accepted, then confirms completion to the ERP, the enterprise resource planning system that manages the order."
start = 67.275
duration = 8.85

[[scene.caption]]
text = "If thirty days pass first, the order is marked overdue and the Instance fails."
start = 76.125
duration = 4.9625

[[scene.caption]]
text = "Operators can inspect its state and values, resolve a failure, and retry or dismiss it."
start = 81.0875
duration = 5.9

[[scene]]
file = "scene-04.wav"

[[scene.caption]]
text = "Acceptance marks the handover of responsibility."
start = 0.05
duration = 3.3894232

[[scene.caption]]
text = "Before acceptance, the incoming stream, the raw data being transferred, remains the sender's responsibility."
start = 3.4394232
duration = 6.4163463

[[scene.caption]]
text = "If Xmip refuses it, the response explains where and why."
start = 9.8557695
duration = 4.1485578

[[scene.caption]]
text = "Once accepted, the message is written to storage before processing begins."
start = 14.0043274
duration = 4.9019232

[[scene.caption]]
text = "Each delivery to a destination is tracked as a Journey."
start = 18.9062506
duration = 3.4375001

[[scene.caption]]
text = "Its outcome is Completed, Failed, or Dismissed by an operator."
start = 22.3437508
duration = 4.5552886

[[scene.caption]]
text = "Failed deliveries can be retried."
start = 26.8990394
duration = 2.3557693

[[scene.caption]]
text = "If no Subscription matches, the message waits in the Dead Message Queue."
start = 29.2548087
duration = 4.2437501

[[scene.caption]]
text = "Correct the routing, then replay it."
start = 33.4985589
duration = 2.5721154

[[scene.caption]]
text = "The audit records every step."
start = 36.0706743
duration = 2.1384616

[[scene]]
file = "scene-05.wav"

[[scene.caption]]
text = "Xmip configuration is written in TOML, a plain-text format designed to be easy to read."
start = 0.05
duration = 5.8514425

[[scene.caption]]
text = "One cluster file describes the nodes, routes, and requirements for each piece of work."
start = 5.9014425
duration = 5.5528848

[[scene.caption]]
text = "Teams can version it, compare changes, and review it alongside their code."
start = 11.4543273
duration = 4.7475963

[[scene.caption]]
text = "Configuration is validated on save, and each node receives the part it needs."
start = 16.2019236
duration = 5.2403848

[[scene]]
file = "scene-06.wav"

[[scene.caption]]
text = "In Visual Studio Code, usually called VS Code, you can design an integration visually or edit its TOML directly."
start = 0.05
duration = 7.625

[[scene.caption]]
text = "Both views work with the same cluster file, so they stay in step."
start = 7.675
duration = 4.0375

[[scene.caption]]
text = "The Xmip language server provides completion, validation, and renaming across references."
start = 11.7125
duration = 5.9875

[[scene.caption]]
text = "It uses the Language Server Protocol, or LSP: the standard that connects editors to language tools."
start = 17.7
duration = 6.9125

[[scene.caption]]
text = "Other editors with an LSP client can use those same services."
start = 24.6125
duration = 4.2

[[scene]]
file = "scene-07.wav"

[[scene.caption]]
text = "Xmip assigns work by configuration."
start = 0.05
duration = 2.7125

[[scene.caption]]
text = "A node is a running Xmip program."
start = 2.7625
duration = 2.2125

[[scene.caption]]
text = "Its name does not decide its role."
start = 4.975
duration = 2.3125

[[scene.caption]]
text = "In this example, there are receiving nodes, a processing node, an executing node, and sending nodes."
start = 7.2875
duration = 6.4

[[scene.caption]]
text = "The executing node can receive, process, and send."
start = 13.6875
duration = 3.65

[[scene.caption]]
text = "Each node declares its roles: receiving, processing, or sending."
start = 17.3375
duration = 4.35

[[scene.caption]]
text = "It also declares Node capabilities, which describe what its environment provides, such as access through a firewall or an installed module."
start = 21.6875
duration = 8.5875

[[scene.caption]]
text = "Xmip matches those declarations to the requirements of the work."
start = 30.275
duration = 3.9625

[[scene.caption]]
text = "With no extra requirements, any node with the right role can take it."
start = 34.2375
duration = 4.2875

[[scene.caption]]
text = "You can run all roles on one node, or distribute them as security boundaries and load require."
start = 38.525
duration = 5.825

[[scene]]
file = "scene-08.wav"

[[scene.caption]]
text = "Work belongs to the cluster."
start = 0.05
duration = 2.0052885

[[scene.caption]]
text = "All nodes use Xmip Storage, and the Ledger keeps track of streams, messages, and journeys."
start = 2.0552885
duration = 5.9855771

[[scene.caption]]
text = "A claim gives a node responsibility for a piece of work for a limited time."
start = 8.0408656
duration = 4.6163463

[[scene.caption]]
text = "If a node fails, another can take over when that claim expires."
start = 12.657212
duration = 4.2437501

[[scene.caption]]
text = "The primary Storage node also has standbys that follow its writes."
start = 16.9009621
duration = 4.1807693

[[scene.caption]]
text = "During an orderly shutdown, it hands over to a standby."
start = 21.0817315
duration = 3.5697116

[[scene.caption]]
text = "If it disappears unexpectedly, takeover waits for the required safety interval."
start = 24.6514432
duration = 5.4225963

[[scene.caption]]
text = "Xmip does not guess and risk two active primaries."
start = 30.0740395
duration = 3.2197116

[[scene]]
file = "scene-09.wav"

[[scene.caption]]
text = "The same cluster plan supports four deployment models: local processes, containers, virtual machines, and physical machines."
start = 0.05
duration = 8.025

[[scene.caption]]
text = "Local processes run as separate programs on one computer."
start = 8.075
duration = 3.9125

[[scene.caption]]
text = "Containers package the running environment."
start = 11.9875
duration = 2.9125

[[scene.caption]]
text = "Virtual machines provide separate operating systems, while physical machines provide separate hardware."
start = 14.9
duration = 6.325

[[scene.caption]]
text = "For virtual machines, the options include Hyper-V, KVM with libvirt, and VMware."
start = 21.225
duration = 6.4375

[[scene.caption]]
text = "Placement belongs to the environment; the cluster configuration stays the same."
start = 27.6625
duration = 5.3625

[[scene.caption]]
text = "The System Tests exercise the flow as local processes."
start = 33.025
duration = 3.8375

[[scene.caption]]
text = "The Systems Tests exercise it across Windows and Linux virtual machines."
start = 36.8625
duration = 4.9125

[[scene.caption]]
text = "Each deployment model has its own security and operational trade-offs."
start = 41.775
duration = 4.55

[[scene.caption]]
text = "Xmip advises; you choose."
start = 46.325
duration = 2.1375

[[scene]]
