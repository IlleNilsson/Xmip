[[scene.caption]]
text = "Xmip answers four people."
start = 0
duration = 1.95

[[scene.caption]]
text = "The CEO asks whether the business keeps moving when an exchange fails."
start = 2.13
duration = 5.025

[[scene.caption]]
text = "The CIO asks who controls it and where it runs."
start = 7.335
duration = 3.425

[[scene.caption]]
text = "The developer asks how an integration is built, and the operator asks what went wrong and what to do now."
start = 10.94
duration = 6.775

[[scene.caption]]
text = "Each answer follows."
start = 17.895
duration = 1.725

[[scene]]
file = "scene-03.wav"

[[scene.caption]]
text = "Here is one sales order from a trading partner."
start = 0
duration = 3.175

[[scene.caption]]
text = "A Receive Location accepts it, and Xmip publishes it as a message."
start = 3.355
duration = 4.675

[[scene.caption]]
text = "A Subscription is a filter on what a message holds, and a destination."
start = 8.21
duration = 4.775

[[scene.caption]]
text = "The first sends the order to a Work Process that approves it; the approved order is published again, and a second Subscription sends it to the ERP."
start = 13.165
duration = 9.725

[[scene.caption]]
text = "No filter ever names a node."
start = 23.07
duration = 2.5

[[scene.caption]]
text = "This is the flow Xmip's own System Tests run."
start = 25.75
duration = 3.2

[[scene]]
file = "scene-04.wav"

[[scene.caption]]
text = "Acceptance is where responsibility changes hands."
start = 0
duration = 3.6

[[scene.caption]]
text = "Before it, the stream belongs to its sender, and a refusal says where and why."
start = 3.78
duration = 5.35

[[scene.caption]]
text = "Once Xmip accepts it, the message is written to storage before anything acts on it."
start = 9.31
duration = 5.5

[[scene.caption]]
text = "Every journey ends Completed, Failed or Dismissed, and a failed delivery is retried."
start = 14.99
duration = 5.875

[[scene.caption]]
text = "A message nothing wanted waits in the Dead Message Queue until its routing is fixed and it is replayed."
start = 21.045
duration = 6.525

[[scene.caption]]
text = "Every step is audited."
start = 27.75
duration = 1.85

[[scene]]
file = "scene-05.wav"

[[scene.caption]]
text = "An integration in Xmip is text you can read."
start = 0
duration = 3.2

[[scene.caption]]
text = "One TOML file describes the cluster: its nodes, its routes, and what each piece of work requires."
start = 3.38
duration = 6.9

[[scene.caption]]
text = "Teams version it, compare it and review it like code."
start = 10.46
duration = 3.425

[[scene.caption]]
text = "Every save is validated, then sliced into each node's own part."
start = 14.065
duration = 4.65

[[scene]]
file = "scene-06.wav"

[[scene.caption]]
text = "VS Code is where an integration is drawn."
start = 0
duration = 3.875

[[scene.caption]]
text = "The designer draws the same cluster file the text holds, so a change in one is a change in the other."
start = 4.055
duration = 6.6

[[scene.caption]]
text = "Completion, validation and renaming that follows every reference come from Xmip's own language server, written in Rust."
start = 10.835
duration = 7.8

[[scene.caption]]
text = "It speaks the standard Language Server Protocol, so other editors can use Xmip's rules through their own LSP clients."
start = 18.815
duration = 7.75

[[scene]]
file = "scene-07.wav"

[[scene.caption]]
text = "Where work runs is configuration, never a node's name."
start = 0
duration = 4

[[scene.caption]]
text = "Each node declares its roles: receiving, processing, sending, or executing all three at low latency."
start = 4.18
duration = 7.4

[[scene.caption]]
text = "It also declares its Node capabilities: words for what its environment gives it, such as a firewall opening or an installed module."
start = 11.76
duration = 9.05

[[scene.caption]]
text = "Work names what it requires, and Xmip places it on a node that has it."
start = 20.99
duration = 4.65

[[scene.caption]]
text = "One node with every role works; more nodes are split out as security, firewalls and load need."
start = 25.82
duration = 6.6

[[scene]]
file = "scene-08.wav"

[[scene.caption]]
text = "The work belongs to the cluster, not to a node."
start = 0
duration = 3.025

[[scene.caption]]
text = "Every node reaches Xmip Storage for all storage, and its Ledger holds every stream, message and journey until it is done."
start = 3.205
duration = 8.35

[[scene.caption]]
text = "Nodes work by time-limited claims, so when one dies, another picks its work up."
start = 11.735
duration = 5.55

[[scene.caption]]
text = "A primary Storage node has standbys that follow every write."
start = 17.465
duration = 4.225

[[scene.caption]]
text = "Stopped in order, it hands its writes over, and a standby takes over at once."
start = 21.87
duration = 4.925

[[scene.caption]]
text = "One that vanishes is waited for, never guessed about."
start = 26.975
duration = 3.575

[[scene]]
file = "scene-09.wav"

[[scene.caption]]
text = "One plan runs four ways: as local processes, in containers, on virtual machines, and on physical machines."
start = 0
duration = 7.8

[[scene.caption]]
text = "Virtual machines run on Hyper-V, on KVM with libvirt, or on VMware."
start = 7.98
duration = 6.125

[[scene.caption]]
text = "The cluster file stays the same; which node runs where belongs to the environment."
start = 14.285
duration = 5.575

[[scene.caption]]
text = "The System Tests prove the flow as processes on one computer, and the Systems Tests prove it on virtual machines, Windows and Linux."
start = 20.04
duration = 8.675

[[scene.caption]]
text = "Each way has its own safety and security trade-offs: Xmip advises, and you choose."
start = 28.895
duration = 5.8

[[scene]]
file = "scene-10.wav"

[[scene.caption]]
text = "Xmip is offline by design."
start = 0
duration = 2.15

[[scene.caption]]
text = "Packages are built where the internet is reachable, then brought in, and installation, operation and the runtime need no internet at all."
start = 2.33
duration = 9.075

[[scene.caption]]
text = "Nothing at runtime checks a license or downloads a module."
start = 11.585
duration = 4.25

[[scene.caption]]
text = "A node that may reach out says so with the Node capability online; a node that declares nothing is offline."
start = 16.015
duration = 7.475

[[scene.caption]]
text = "The networked option is there when you choose it."
start = 23.67
duration = 2.825

[[scene]]
file = "scene-11.wav"

[[scene.caption]]
text = "Operators choose their surface: the xmip command line, PowerShell, the web view, the desktop or the phone."
start = 0
duration = 7

[[scene.caption]]
text = "Each reads one shared operator model, so they cannot disagree, and an MCP client reads Xmip through the command line."
start = 7.18
duration = 7.975

[[scene.caption]]
text = "Health is said in words: Fine, Paused, Working, Stressed, Exhausted or Done."
start = 15.335
duration = 5.45

[[scene.caption]]
text = "A scope above is Holding when something beneath it needs attention, and it carries that leaf and its evidence."
start = 20.965
duration = 6.925

[[scene]]
file = "scene-12.wav"

[[scene.caption]]
text = "A Report presents data Xmip already keeps, such as the Audit and the Dead Messages."
start = 0
duration = 5.7

[[scene.caption]]
text = "A Quest probes an installation first, and its Report presents what it found."
start = 5.88
duration = 5.125

[[scene.caption]]
text = "The first is the Regulation Quest, its regulation a parameter, GDPR first: for each requirement, the evidence or the gap, and the action that closes it."
start = 11.185
duration = 10.675

[[scene.caption]]
text = "It never says compliant; that judgment stays yours."
start = 22.04
duration = 3.575

[[scene.caption]]
text = "The Firewall, Security, Resilience and Dependency Reports sit in the same list, eleven in all, on every surface."
start = 25.795
duration = 7.9

[[scene]]
file = "scene-13.wav"

[[scene.caption]]
text = "Xmip is extended through one boundary."
start = 0
duration = 2.775

[[scene.caption]]
text = "A module is a library a node opens through the C ABI, written in Rust, or in C# with Xmip's Module package, published as a native library."
start = 2.955
duration = 10.925

[[scene.caption]]
text = "The node cannot tell the two apart, and a template starts a new module with its test."
start = 14.06
duration = 5.575

[[scene.caption]]
text = "Code on another machine reaches Xmip only over its HTTP/2 API, inside Xmip's mutual TLS."
start = 19.815
duration = 8.825

[[scene]]
file = "scene-14.wav"

[[scene.caption]]
text = "Xmip is open source."
start = 0
duration = 2

[[scene.caption]]
text = "Xmip itself is under the GNU Affero General Public License, version three or later, and it cannot be relicensed or withdrawn."
start = 2.18
duration = 9.15

[[scene.caption]]
text = "Its module boundary, the headers, bindings and packages a module is built against, is under the Apache License, so the module you write stays yours."
start = 11.51
duration = 10.1

[[scene.caption]]
text = "Every architectural decision is a record with its reasons, seventy-five so far, and tests hold the rules: the internal tests on every change, the System Tests on one computer, and the Systems Tests on machines."
start = 21.79
duration = 14.3

[[scene]]
file = "scene-15.wav"

[[scene.caption]]
text = "Xmip is measured, not promised."
start = 0
duration = 2.175

[[scene.caption]]
text = "Its rule: anything it does around a payload that takes more than a millisecond is a defect to find."
start = 2.355
duration = 6.35

[[scene.caption]]
text = "Carrying a file in and out on one node, Xmip's own work measured 430 microseconds at the median of twenty runs, with the storage's syncs counted apart."
start = 8.885
duration = 10.475

[[scene.caption]]
text = "And the honest count: six transports run in the assembled service today, of the eighty-eight declared."
start = 19.54
duration = 6.525

