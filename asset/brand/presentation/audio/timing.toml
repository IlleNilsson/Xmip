[[scene]]
file = "scene-02.wav"

[[scene.caption]]
text = "Different roles need different answers."
start = 0.05
duration = 2.29375

[[scene.caption]]
text = "For the CEO, it is business continuity when an exchange fails."
start = 2.34375
duration = 4.1586539

[[scene.caption]]
text = "For the CIO, it is control over the platform and where it runs."
start = 6.502404
duration = 3.954327

[[scene.caption]]
text = "Developers need a practical way to build integrations."
start = 10.4567311
duration = 3.6298078

[[scene.caption]]
text = "Operators need to see what happened and recover when something goes wrong."
start = 14.0865389
duration = 4.2067309

[[scene.caption]]
text = "Xmip brings those views together."
start = 18.2932699
duration = 2.3086539

[[scene]]
