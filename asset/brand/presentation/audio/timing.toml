duration = 2.3903847

[[scene.caption]]
text = "Build the packages where internet access is available, then bring them into your environment."
start = 2.4403847
duration = 5.4682694

[[scene.caption]]
text = "Installation, operation, and runtime execution need no internet connection."
start = 7.9086541
duration = 5.1442309

[[scene.caption]]
text = "The runtime does not download modules or contact a license server."
start = 13.052885
duration = 4.0504809

[[scene.caption]]
text = "A node that needs external access must declare the online capability."
start = 17.103366
duration = 4.3750001

[[scene.caption]]
text = "Without it, the node stays offline."
start = 21.4783661
duration = 2.3076923

