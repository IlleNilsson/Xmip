[[scene.caption]]
text = "Work Processes, Transformations, Prepare steps, and other units are loaded as libraries."
start = 15.1562505
duration = 5.877404

[[scene.caption]]
text = "You can write them in Rust, C#, C++, or another language that exports the required C functions."
start = 21.0336546
duration = 7.1634618

