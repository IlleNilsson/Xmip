# How the narration's voice says a written term. The owner, 2026-11-24: "You really
# have to work on the pronunciation of acronyms, they are bad", and "So just listen to
# tech podcasts": the form practitioners say aloud, a project's own stated
# pronunciation first.
#
# narrate.mjs applies this to each section's narration before synthesis only; the
# slides and the captions keep the written form. The longest written term wins where
# two overlap, and a term matches only as a whole word. kokoro-js 1.x has no inline
# phoneme markup (its text normalizer reads brackets and parentheses as punctuation
# before phonemizing), so every spoken form is spelled in words the voice reads.
#
# basis = "source": the project or its owner states how it is said, cited in `source`.
# basis = "convention": how practitioners commonly say it; the owner corrects these.

[[term]]
written = "Xmip"
spoken = "Smip"
ignore_case = true
basis = "source"
source = "asset/brand/presentation/README.md: Pronounce Xmip as Smip, one syllable"

